<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Sóc · Nuôi con</title>
<!-- Chặn trình duyệt tự bôi đen app (Chrome Android "Chủ đề tối → Làm tối trang web",
     Samsung Internet dark mode…): app tự lo màu sáng/tối, đừng đảo màu giúp.
     Script dưới đổi sang 'dark' khi theme đang dùng thật sự là nền tối. -->
<meta name="color-scheme" content="only light" />
<meta name="theme-color" content="#c65b52" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
<!-- Font viết tay Patrick Hand (dùng chung với Just Us) cho theme "Sổ tay" -->
<link rel="stylesheet" href="../fonts.css" />

<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.6/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<style>
/* =========================================================================
   Bộ nhận diện riêng của app Sóc.
   Trước đây app mược da "Sổ tay" của Just Us (giấy be, viền đứt, thẻ nghiêng,
   chữ viết tay). Da đó hợp app đôi, nhưng ở đây nó làm phần y tế trông kém
   tin cậy, và tệ hơn: màu chính của nó là đỏ gạch, gần trùng với màu cấp cứu
   nên thứ quan trọng nhất lại không nổi lên được.
   Nay Sóc có hệ màu riêng, và ĐỎ CHỈ DÙNG CHO CẤP CỨU — không dùng ở đâu khác.
   ========================================================================= */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface-2:#f6f9fa; --raised:#ffffff;
  --ink:#0f1a20; --ink-2:#4c6472; --ink-3:#7b909c;
  --line:#dde5e9; --line-2:#eaf0f2;
  --brand:#0d6a7a; --brand-2:#128ea3; --brand-soft:#e0eff2; --brand-ink:#0a5462;
  --good:#1d7a4d; --good-soft:#e2f2e9;
  --warn:#a86400; --warn-soft:#fcf0dc;
  --danger:#bd3226; --danger-2:#d8503f; --danger-soft:#fbe9e6;
  --on-brand:#ffffff;
  --shadow-1:0 1px 2px rgba(15,26,32,.06);
  --shadow-2:0 1px 2px rgba(15,26,32,.05), 0 10px 24px -14px rgba(15,26,32,.28);
  --r-sm:9px; --r:14px; --r-lg:20px;
  --t-xs:12px; --t-sm:13.5px; --t-md:15px; --t-lg:17px; --t-xl:21px; --t-2xl:30px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:22px; --sp-6:30px;
  --gut:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1215; --surface:#141d21; --surface-2:#19242a; --raised:#1c282e;
    --ink:#e9f0f2; --ink-2:#a2b7c0; --ink-3:#7b929c;
    --line:#26343a; --line-2:#1f2b31;
    --brand:#4cb4c7; --brand-2:#6bcbdb; --brand-soft:#12333b; --brand-ink:#9ddfeb;
    --good:#4cb782; --good-soft:#12312270;
    --warn:#d9a253; --warn-soft:#32270f;
    --danger:#e2705f; --danger-2:#ef8574; --danger-soft:#3a1c18;
    --on-brand:#06222a;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.7);
  }
}
body.dark{
  --bg:#0c1215; --surface:#141d21; --surface-2:#19242a; --raised:#1c282e;
  --ink:#e9f0f2; --ink-2:#a2b7c0; --ink-3:#7b929c;
  --line:#26343a; --line-2:#1f2b31;
  --brand:#4cb4c7; --brand-2:#6bcbdb; --brand-soft:#12333b; --brand-ink:#9ddfeb;
  --good:#4cb782; --good-soft:#123122;
  --warn:#d9a253; --warn-soft:#32270f;
  --danger:#e2705f; --danger-2:#ef8574; --danger-soft:#3a1c18;
  --on-brand:#06222a;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.4), 0 12px 28px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:var(--t-md); line-height:1.55; letter-spacing:.1px;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  background:var(--bg); color:var(--ink); min-height:100vh;
}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
.app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:var(--t-md);color:var(--ink)}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Thanh trên: tên bé + nút cấp cứu luôn trong tầm tay ===== */
.hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px var(--gut);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr .id{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.hdr .mark{width:32px;height:32px;border-radius:10px;background:var(--brand-soft);
  display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.hdr .nm{font-size:var(--t-md);font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:var(--t-xs);color:var(--ink-2);line-height:1.25}
.hdr-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);font-size:17px;flex:0 0 auto}
.hdr-btn.sos{background:var(--danger);border-color:var(--danger);color:#fff}

/* ===== Nội dung ===== */
.wrap{padding:0 0 var(--sp-5)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-1);padding:var(--sp-4);margin:var(--sp-3) var(--gut)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-1);padding:13px 14px;margin:var(--sp-2) var(--gut)}
.item .it-top{display:flex;align-items:flex-start;gap:8px}
.item h4{margin:0;font-size:var(--t-sm);font-weight:700;flex:1;line-height:1.4}
.sec-title{font-weight:700;font-size:var(--t-xs);letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ink-3);margin:var(--sp-5) var(--gut) var(--sp-2);display:flex;align-items:center;gap:8px}
.muted{color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.center{text-align:center}
.empty{text-align:center;color:var(--ink-2);padding:26px 20px;font-size:var(--t-sm);line-height:1.6}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:var(--t-xs);font-weight:600;min-height:32px}
.pill.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.hot{background:var(--danger);border-color:var(--danger);color:#fff}

.btn{background:var(--brand);color:var(--on-brand);border-radius:var(--r-sm);
  padding:12px 16px;font-weight:700;font-size:var(--t-sm);display:inline-flex;
  align-items:center;justify-content:center;gap:7px;width:100%;min-height:46px;
  box-shadow:var(--shadow-1)}
.btn.sm{padding:9px 13px;width:auto;min-height:40px}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);color:#fff}
.iconbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:15px;flex:0 0 auto}
.xbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-3);font-size:15px;flex:0 0 auto}
.tick{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:var(--sp-3)}
.field label{font-size:var(--t-xs);font-weight:700;color:var(--ink-2)}
.inp{background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:12px 13px;width:100%;color:var(--ink);min-height:46px}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{border-color:var(--brand);outline:none}
textarea.inp{resize:vertical;min-height:72px;line-height:1.55}

.prog{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:8px}
.prog > i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* ===== Điều hướng hai tầng =====
   Dưới: 5 nhóm chính. Trong nhóm: hàng tab gạch chân.
   Trước đây 10 mục nằm trong một lưới 3 hàng, chiếm gần một phần tư màn hình
   ở MỌI trang và không cho biết mục nào đang cần để ý. */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;
  z-index:50;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.dock button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;padding:5px 2px;border-radius:11px;
  min-height:52px;justify-content:center;position:relative}
.dock button .ic{font-size:20px;line-height:1.15}
.dock button.on{color:var(--brand)}
.dock button .dot{position:absolute;top:5px;right:calc(50% - 17px);width:7px;height:7px;
  border-radius:50%;background:var(--warn);border:1.5px solid var(--surface)}

.subtabs{display:flex;gap:2px;overflow-x:auto;padding:2px var(--gut) 0;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:0 0 auto;padding:11px 12px 9px;font-size:var(--t-sm);font-weight:600;
  color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap;min-height:44px}
.subtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ===== Khối mở ra đọc ===== */
.col-h{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;
  min-height:40px;font-size:var(--t-xs);letter-spacing:1.2px;text-transform:uppercase}
.col-chev{font-size:10px;color:var(--ink-3);width:11px;text-align:center}

/* ===== Cấp cứu: đỏ chỉ ở đây ===== */
.sos-bar{display:flex;align-items:center;gap:11px;margin:var(--sp-3) var(--gut);
  padding:13px 14px;border-radius:var(--r);background:var(--danger);color:#fff;
  width:calc(100% - var(--gut)*2);text-align:left;box-shadow:var(--shadow-1);min-height:56px}
.sos-bar b{font-size:var(--t-sm);display:block;font-weight:700}
.sos-bar small{font-size:11.5px;opacity:.92;display:block}
.sos-bar .ic{font-size:22px;flex:0 0 auto}
.callout{border-radius:var(--r-sm);padding:11px 13px;margin-top:10px;font-size:var(--t-sm);line-height:1.6}
.callout.er{background:var(--danger-soft);border-left:3px solid var(--danger)}
.callout.er .h{color:var(--danger);font-weight:800;font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.callout.tip{background:var(--brand-soft);border-left:3px solid var(--brand)}
.lbl-do{font-size:var(--t-xs);font-weight:800;color:var(--good);letter-spacing:.8px;text-transform:uppercase}
.lbl-dont{font-size:var(--t-xs);font-weight:800;color:var(--danger);letter-spacing:.8px;text-transform:uppercase}
.lbl-neutral{font-size:var(--t-xs);font-weight:800;color:var(--ink-2);letter-spacing:.8px;text-transform:uppercase}
.note{font-size:var(--t-xs);color:var(--ink-2);line-height:1.6;margin:var(--sp-3) var(--gut) 0;
  border-left:2px solid var(--line);padding-left:11px}

/* ===== Trang chủ ===== */
.hero{text-align:center;padding:var(--sp-5) var(--gut) var(--sp-2)}
.hero .av{width:78px;height:78px;border-radius:26px;background:var(--brand-soft);
  margin:0 auto;display:grid;place-items:center;font-size:38px;box-shadow:var(--shadow-1)}
.hero .nm{font-size:var(--t-xl);font-weight:800;margin-top:11px;line-height:1.2}
.hero .ag{font-size:var(--t-sm);color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:var(--sp-3) var(--gut)}
.stat{margin:0;padding:13px 14px}
.stat .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
.stat .v{font-size:var(--t-xl);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:1px}
.stat .v .u{font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:var(--sp-3) var(--gut)}
.tile{margin:0;padding:16px 9px;text-align:center;display:block;width:100%;min-height:96px}
.tile .ic{font-size:25px;line-height:1.15;display:block}
.tile b{display:block;font-size:var(--t-sm);margin-top:5px}
.tile small{color:var(--ink-2);font-size:11.5px;display:block;margin-top:1px}
.alert{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:var(--sp-2) var(--gut);
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--r);box-shadow:var(--shadow-1);width:calc(100% - var(--gut)*2);text-align:left;min-height:52px}

/* ===== Tấm che (sheet) ===== */
.ov{position:fixed;inset:0;z-index:80;background:rgba(6,14,18,.5);display:flex;
  align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--sp-4) var(--sp-4) var(--sp-6);max-height:88vh;overflow:auto;position:relative;
  animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 34px 12px 0;font-size:var(--t-lg)}
.sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;color:var(--ink-2);font-size:17px}

/* ===== Tìm kiếm ===== */
.hit{display:block;width:100%;text-align:left;margin:var(--sp-2) 0;padding:12px 13px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.hit .where{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.hit .t{font-size:var(--t-sm);font-weight:600;margin-top:2px}
.hit .s{font-size:var(--t-xs);color:var(--ink-2);margin-top:2px;line-height:1.5}

/* ===== Lưới 30 ngày tập bô ===== */
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid30 span{aspect-ratio:1;border-radius:5px;font-size:9px;display:grid;place-items:center;
  color:var(--ink-3);background:var(--line-2);font-variant-numeric:tabular-nums}
.grid30 span.dry{background:var(--good);color:#fff}
.grid30 span.wet{background:var(--warn-soft);color:var(--warn)}

/* ===== Trạng thái nạp / lỗi ===== */
.skel{margin:var(--sp-3) var(--gut);height:74px;border-radius:var(--r);
  background:linear-gradient(90deg,var(--line-2) 25%,var(--surface-2) 50%,var(--line-2) 75%);
  background-size:400% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* Tiện ích nhỏ dùng lại */
.num{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.2}
.num .u{font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.bul{margin:0;padding-left:19px;font-size:var(--t-sm);line-height:1.65}
.bul li{margin-bottom:6px}
.bul.dont{color:var(--danger)}
.collapse{margin:0}
.col-body{margin:0}
</style>
</head>
<body>
<div id="root"></div>

<!-- Chống nháy theme: lấy đúng theme đang chọn bên Just Us (cùng origin, chung localStorage) -->
<script>
(function(){
  try{
    var raw=localStorage.getItem('ju.setup');
    var s=raw?JSON.parse(raw):{};
    var t=s.theme||'sotay';
    var mode=s.darkMode||'light';
    var dark=mode==='dark'||(mode==='system'&&typeof window.matchMedia==='function'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.body.className='theme-'+t+(dark?' dark':'');
  }catch(e){document.body.className='theme-sotay';}
  // Đọc màu nền THẬT đang áp dụng rồi báo cho trình duyệt biết app đang sáng hay tối
  try{
    var v=getComputedStyle(document.body).getPropertyValue('--bg').trim();
    var m=/^#([0-9a-f]{6})$/i.exec(v), isDark=false;
    if(m){ var n=parseInt(m[1],16);
      isDark=((((n>>16)&255)*0.299+(((n>>8)&255))*0.587+(n&255)*0.114)/255)<0.5; }
    document.documentElement.style.colorScheme=isDark?'dark':'only light';
  }catch(e){}
})();
</script>

<!-- Dữ liệu tĩnh dùng chung với Just Us: ../data/child.json -->
<script>
(function(){
  window.JUD={ CHILD_VACCINES:[], CHILD_MILESTONES:[], CHILD_TIPS:[], CHILD_PACK:[], CHILD_SKILLS:[],
    PLAY_LIB:[], WEAN_MENU:[], PARENTING_QS:[], ILL_SYMPTOMS:[], KIDS_CAFES:[], SKILL_GUIDES:[], CHILD_ISSUES:[],
    // Đợt 1: an toàn · kịch bản câu nói · sức khoẻ theo mùa · dạy bé · ngày thường · giấy tờ
    EMERGENCY:[], RED_FLAGS:[], DANGER_ITEMS:[], HOME_SAFETY:[], CONTACT_SUGGEST:[],
    TANTRUM_SCRIPTS:[], CHILD_BEHAVIOR:[], CHORES_2Y:[], SELF_CORNER:[],
    DRESS_TEMP:[], DRESS_RULES:[], SEASON_ILL:[], SCARY_TASKS:[], WEEKEND_PLANS:[], CHILD_DOCS:[],
    // Đợt 2: tập bô + chuẩn tăng trưởng WHO (hai khoá WHO_* là object theo giới tính)
    POTTY_READY:[], POTTY_TIMES:[], POTTY_FIX:[], WHO_WEIGHT:{}, WHO_HEIGHT:{},
    // Bổ sung: giấc ngủ · răng · khám & sàng lọc định kỳ
    SLEEP_NEED:[], SLEEP_ROUTINE:[], SLEEP_FIX:[], TEETH_ORDER:[], CHECKUP_SCHEDULE:[], DEV_REDFLAGS:[],
    TEETH_CARE:{},
    // Đợt 4: giấc ngày & cai ti đêm · chuẩn bị và các bước cai bỉm · Montessori · STEAM
    SLEEP_MORE:[], POTTY_PREP:[], POTTY_STEPS:[],
    MONTESSORI_PRINCIPLES:[], MONTESSORI_ACT:[], MONTESSORI_MAT:[],
    STEAM_PRINCIPLES:[], STEAM_ACT:[], STEAM_LABEL:{},
    // Đợt 3: đi lớp · ra khỏi nhà · tâm lý bé và bố mẹ
    SCHOOL_START:[], SCHOOL_ILL:[], TEACHER_NOTE:[], TRIP_PACK:[], TRIP_TIPS:[], DUTY_SLOTS:[],

/* Nén ảnh trước khi tải lên — cạnh dài tối đa 1200px, JPEG chất lượng 0.82 */
function compressImage(file,maxSide,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=img; const m=maxSide||1200;
      if(Math.max(w,h)>m){ const r=m/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>b?resolve(b):reject(new Error('nén ảnh lỗi')),'image/jpeg',quality||0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('không đọc được ảnh')); };
    img.src=url;
  });
}

}

function useLocal(key,initial){

    window.addEventListener('ju:remote',h);

  return [v,setV];
}

const _fold=(x)=>(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
let _IDX=null;
function SearchSheet({onClose,onGo}){
  const [q,setQ]=useState('');
  const idx=useMemo(()=>{ if(!_IDX) _IDX=searchIndex(); return _IDX; },[]);
  const hits=useMemo(()=>{
    const k=_fold(q.trim()); if(k.length<2) return [];
    return idx.map(it=>{
      const t=_fold(it.title), b=_fold(it.body), w=_fold(it.where);
      let sc=0;
      if(t.indexOf(k)>=0) sc+=10;
      if(w.indexOf(k)>=0) sc+=6;   // tên mục cũng đáng kể: gõ "mọc răng" phải ra phần Răng
      if(b.indexOf(k)>=0) sc+=3;
      return sc?{...it,sc}:null;
    }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,25);
  },[q,idx]);
  return (
    <Sheet title="Tìm trong app" onClose={onClose}>
      <input className="inp" autoFocus placeholder="vd: sốt co giật, ăn vạ, mọc răng, tè dầm…" value={q} onChange={e=>setQ(e.target.value)}/>
      {q.trim().length>=2 && hits.length===0 && <div className="empty">Không thấy gì khớp với “{q.trim()}”.</div>}
      {q.trim().length<2 && <div className="muted" style={{fontSize:'var(--t-xs)',marginTop:10,lineHeight:1.6}}>Gõ từ 2 chữ trở lên. Không cần bỏ dấu — gõ “sot co giat” cũng ra.</div>}
      {hits.map((h,i)=>(
        <button key={i} className="hit" onClick={()=>onGo(h.tab)}>
          <div className="where">{h.where} · {TAB_NAME[h.tab]||h.tab}</div>
          <div className="t">{h.title}</div>
          {h.body && <div className="s">{h.body.slice(0,110)}…</div>}
        </button>
      ))}
    </Sheet>
  );
}

/* ============ Sao lưu & khôi phục ============
   Trước đây toàn bộ nhật ký, mốc, ảnh chỉ nằm ở localStorage + đúng một hàng
   trên Supabase. Không có đường nào lấy dữ liệu ra. */
function MenuSheet({onClose}){
  const [msg,setMsg]=useState('');
  const [st,setSt]=useState(Cloud.status);
  useEffect(()=>{ Cloud.onChange=setSt; return ()=>{ Cloud.onChange=null; }; },[]);
  const exportAll=()=>{
    const dump={app:'soc',version:1,at:new Date().toISOString(),data:{}};
    CHILD_KEYS.forEach(k=>{ const v=store.get(k,null); if(v!=null) dump.data[k]=v; });
    const blob=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='soc-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{document.body.removeChild(a);}catch(_){} URL.revokeObjectURL(url); },600);
    setMsg('Đã tải file sao lưu về máy.');
  };
  const importAll=(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value='';
    if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const j=JSON.parse(rd.result);
        const d=(j&&j.data)?j.data:j;
        const keys=Object.keys(d).filter(k=>CHILD_KEYS.indexOf(k)>=0);
        if(!keys.length){ setMsg('File này không có dữ liệu của app Sóc.'); return; }
        if(!confirm('Ghi đè '+keys.length+' nhóm dữ liệu của bé bằng nội dung trong file? Dữ liệu hiện tại trên máy này sẽ bị thay.')) return;
        keys.forEach(k=>store.set(k,d[k]));
        window.dispatchEvent(new CustomEvent('ju:remote'));
        Cloud.schedulePush();
        setMsg('Đã khôi phục '+keys.length+' nhóm dữ liệu.');
      }catch(err){ setMsg('File không đọc được — cần đúng file JSON đã xuất từ app Sóc.'); }
    };
    rd.readAsText(f);
  };
  const synced=store.get('ju.synced',null);
  return (
    <Sheet title="Cài đặt & dữ liệu" onClose={onClose}>
      <div className="card" style={{margin:'0 0 12px'}}>
        <div className="row"><span style={{fontSize:19}}>{st==='on'?'☁️':'📴'}</span>
          <div className="grow"><b style={{fontSize:'var(--t-sm)'}}>{st==='on'?'Đang đồng bộ với nửa kia':'Chưa nối đám mây'}</b>
            <div className="muted" style={{fontSize:'var(--t-xs)',marginTop:2,lineHeight:1.55}}>
              {st==='on'
                ? (synced? ('Lần gần nhất: '+new Date(synced).toLocaleString('vi-VN')) : 'Đã nối, chưa có lần ghi nào.')
                : 'Dữ liệu chỉ nằm trên máy này. Mở Just Us đăng nhập và ghép cặp thì app tự đồng bộ theo.'}
            </div></div></div>
      </div>
      <div className="sec-title" style={{margin:'0 0 8px'}}>Sao lưu</div>
      <div className="muted" style={{fontSize:'var(--t-xs)',lineHeight:1.6,marginBottom:10}}>
        Nhật ký, mốc, số đo và đường dẫn ảnh của bé là thứ không mua lại được. Thỉnh thoảng tải một file về máy hoặc gửi vào email cho chắc.
      </div>
      <button className="btn" onClick={exportAll}>⬇️ Tải file sao lưu</button>
      <label className="btn ghost" style={{marginTop:10,display:'flex',cursor:'pointer'}}>
        ⬆️ Khôi phục từ file
        <input type="file" accept="application/json,.json" onChange={importAll} style={{display:'none'}}/>
      </label>
      {msg && <div className="callout tip" style={{marginTop:12}}>{msg}</div>}
      <div className="note" style={{margin:'16px 0 0'}}>
        Ảnh không nằm trong file sao lưu — file chỉ giữ đường dẫn. Ảnh thật nằm trên kho ảnh chung với Just Us.
      </div>
      <a className="btn soft" href="../index.html" style={{marginTop:16,textDecoration:'none'}}>← Về Just Us</a>
    </Sheet>
  );
}

// Đường cân nặng 6 lần đo gần nhất — vẽ tay bằng SVG, không cần thư viện.
function Spark({points}){
  if(!points || points.length<2) return null;
  const W=96,H=34,pad=3;
  const min=Math.min(...points), max=Math.max(...points), span=(max-min)||1;
  const xy=points.map((v,i)=>[pad+i*(W-pad*2)/(points.length-1), H-pad-((v-min)/span)*(H-pad*2)]);
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+' L'+xy[xy.length-1][0].toFixed(1)+' '+H+' L'+xy[0][0].toFixed(1)+' '+H+' Z';
  const end=xy[xy.length-1];
  return (
    <svg width={W} height={H} viewBox={'0 0 '+W+' '+H} aria-label="đường cân nặng gần đây">
      <path d={area} fill="var(--surface-2)"/>
      <path d={line} fill="none" stroke="var(--brand)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={end[0]} cy={end[1]} r="3" fill="var(--brand)"/>
    </svg>
  );
}

/* ============ Mục 4 — biểu đồ tăng trưởng theo chuẩn WHO ============ */
// Nội suy tuyến tính giữa hai mốc 3 tháng của bảng WHO rút gọn.
function whoAt(table,gender,m){
  const rows=table[gender==='nu'?'nu':'nam']; if(!rows||!rows.length||m==null) return null;
  if(m<=rows[0][0]) return rows[0].slice(1);
  if(m>=rows[rows.length-1][0]) return rows[rows.length-1].slice(1);
  for(let i=0;i<rows.length-1;i++){
    const a=rows[i],b=rows[i+1];
    if(m>=a[0]&&m<=b[0]){ const f=(m-a[0])/(b[0]-a[0]);
      return [1,2,3].map(j=>a[j]+(b[j]-a[j])*f); }
  }
  return null;
}
// "Bé đang nằm ở đâu so với chuẩn" — chỉ nói theo dải, không phán chẩn đoán.
function whoBand(v,ref){
  if(v==null||!ref) return null;
  if(v<ref[0]) return {k:'low',t:'thấp hơn dải chuẩn (dưới P3)',c:'#c0392b'};
  if(v>ref[2]) return {k:'high',t:'cao hơn dải chuẩn (trên P97)',c:'#c0392b'};
  if(v<ref[1]) return {k:'mid',t:'trong dải chuẩn, dưới mức giữa',c:'var(--good)'};
  return {k:'mid',t:'trong dải chuẩn, trên mức giữa',c:'var(--good)'};
}
function GrowthChart({growth,child,months,kind}){
  const gender=child.gender==='nu'?'nu':'nam';
  const table=kind==='h'?WHO_HEIGHT:WHO_WEIGHT;
  const rows=table[gender]||[];
  if(!rows.length) return null;
  const pts=(growth||[]).filter(g=>(kind==='h'?g.h:g.w)!=null && child.dob)
    .map(g=>({m:Math.max(0,Math.round((new Date(g.date+'T00:00:00')-new Date(child.dob+'T00:00:00'))/(30.44*86400000))), v:(kind==='h'?g.h:g.w)}))
    .sort((a,b)=>a.m-b.m);
  const W=300,H=190,L=26,R=6,T=8,B=18;
  const maxM=Math.min(36,Math.max(12,(months==null?24:months)+6, pts.length?pts[pts.length-1].m+3:0));
  const inRange=rows.filter(r=>r[0]<=maxM+3);
  const lo=Math.min(...inRange.map(r=>r[1]), ...pts.map(p=>p.v));
  const hi=Math.max(...inRange.map(r=>r[3]), ...pts.map(p=>p.v));
  const pad=(hi-lo)*0.08||1;
  const y0=lo-pad, y1=hi+pad;
  const X=m=>L+(m/maxM)*(W-L-R);
  const Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const path=(idx)=>inRange.map((r,i)=>(i?'L':'M')+X(r[0]).toFixed(1)+' '+Y(r[idx]).toFixed(1)).join(' ');
  const bandArea=inRange.map((r,i)=>(i?'L':'M')+X(r[0]).toFixed(1)+' '+Y(r[1]).toFixed(1)).join(' ')
    +' '+inRange.slice().reverse().map(r=>'L'+X(r[0]).toFixed(1)+' '+Y(r[3]).toFixed(1)).join(' ')+' Z';
  const kidPath=pts.map((p,i)=>(i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const ticks=[0,6,12,18,24,30,36].filter(t=>t<=maxM);
  const unit=kind==='h'?'cm':'kg';
  return (
    <svg width="100%" viewBox={'0 0 '+W+' '+H} style={{display:'block'}} role="img"
      aria-label={'Biểu đồ '+(kind==='h'?'chiều cao':'cân nặng')+' của bé so với dải chuẩn WHO'}>
      <path d={bandArea} fill="var(--surface-2)" opacity="0.75"/>
      <path d={path(1)} fill="none" stroke="var(--line)" strokeWidth="1"/>
      <path d={path(3)} fill="none" stroke="var(--line)" strokeWidth="1"/>
      <path d={path(2)} fill="none" stroke="var(--ink-2)" strokeWidth="1" strokeDasharray="3 3"/>
      {ticks.map(t=>(<g key={t}>
        <line x1={X(t)} y1={H-B} x2={X(t)} y2={H-B+3} stroke="var(--line)"/>
        <text x={X(t)} y={H-B+13} fontSize="8" fill="var(--ink-2)" textAnchor="middle">{t}</text>
      </g>))}
      <text x="2" y={Y(y1)+8} fontSize="8" fill="var(--ink-2)">{Math.round(y1)}</text>
      <text x="2" y={Y(y0)} fontSize="8" fill="var(--ink-2)">{Math.round(y0)}</text>
      <text x={W-R} y={H-B+13} fontSize="8" fill="var(--ink-2)" textAnchor="end">tháng tuổi</text>
      {pts.length>1 && <path d={kidPath} fill="none" stroke="var(--brand)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      {pts.map((p,i)=><circle key={i} cx={X(p.m)} cy={Y(p.v)} r={i===pts.length-1?3.5:2.2} fill="var(--brand)"/>)}
      {pts.length>0 && <text x={X(pts[pts.length-1].m)} y={Y(pts[pts.length-1].v)-6} fontSize="9" fill="var(--brand)" textAnchor="middle" fontWeight="700">{pts[pts.length-1].v}{unit}</text>}
    </svg>
  );
}
function GrowthWHO({growth,child,months}){
  const [kind,setKind]=useState('w');
  const last=(growth||[])[0];
  const v=last?(kind==='h'?last.h:last.w):null;
  const ref=whoAt(kind==='h'?WHO_HEIGHT:WHO_WEIGHT,child.gender,months);
  const band=whoBand(v,ref);
  const unit=kind==='h'?'cm':'kg';
  if(!child.dob) return <div className="empty muted">Nhập ngày sinh của bé ở trang chủ để vẽ được biểu đồ theo tuổi.</div>;
  return (
    <div>
      <div className="row" style={{margin:'0 14px 6px',gap:7}}>
        <button className="pill" style={kind==='w'?{background:'var(--brand)',color:'var(--on-brand)'}:{}} onClick={()=>setKind('w')}>⚖️ Cân nặng</button>
        <button className="pill" style={kind==='h'?{background:'var(--brand)',color:'var(--on-brand)'}:{}} onClick={()=>setKind('h')}>📐 Chiều cao</button>
      </div>
      <div className="card">
        <GrowthChart growth={growth} child={child} months={months} kind={kind}/>
        <div className="row" style={{gap:10,marginTop:6,flexWrap:'wrap'}}>
          <span className="muted" style={{fontSize:10.5}}>▬ đường của bé</span>
          <span className="muted" style={{fontSize:10.5}}>▨ dải chuẩn P3–P97</span>
          <span className="muted" style={{fontSize:10.5}}>┅ mức giữa P50</span>
        </div>
      </div>
      {v!=null && ref && band && <div className="card" style={{borderLeft:'4px solid '+band.c}}>
        <div style={{fontSize:13.5}}><b>{v} {unit}</b> ở {months} tháng — {band.t}.</div>
        <div className="muted" style={{fontSize:12,marginTop:4}}>
          Chuẩn WHO cho {child.gender==='nu'?'bé gái':'bé trai'} {months} tháng: {ref[0].toFixed(1)}–{ref[2].toFixed(1)} {unit}, mức giữa {ref[1].toFixed(1)} {unit}.
        </div>
      </div>}
      {v==null && <div className="muted center" style={{fontSize:12,margin:'0 14px'}}>Chưa có số đo {kind==='h'?'chiều cao':'cân nặng'} nào — ghi ở phần “Chiều cao & cân nặng” bên dưới.</div>}
      <div className="note">{months!=null&&months>36 && <><b>Bé đã trên 36 tháng</b> — bảng trong app dừng ở mốc 36 tháng nên phần so sánh bên trên chỉ còn tham khảo rất thô. </>}Bảng chuẩn trong app là bản <b>rút gọn theo mốc 3 tháng</b> của chuẩn WHO 0–36 tháng, số đã làm tròn và giữa hai mốc thì nội suy — dùng để nhìn xu hướng, không thay bảng chuẩn của bác sĩ. Một lần đo lệch dải không có nhiều ý nghĩa bằng việc đường của bé đi lên đều đặn. Thấy bé rơi ra ngoài dải hoặc đứng cân nhiều tháng thì cho đi khám dinh dưỡng.</div>
    </div>
  );
}

/* ============ Mục 3 — bỏ bỉm / tập ngồi bô ============ */
function PottyTab(){
  const [p,setP]=useLocal('ju.childPotty',{ready:{},log:{}});
  const ready=p.ready||{}, log=p.log||{};
  const readyN=POTTY_READY.filter(r=>ready[r]).length;
  const today=todayISO();
  const td=log[today]||{ok:0,acc:0};
  const set=(patch)=>setP({...p,...patch});
  const bump=(field,delta)=>{ const cur=log[today]||{ok:0,acc:0};
    const next={...cur,[field]:Math.max(0,(cur[field]||0)+delta)};
    set({log:{...log,[today]:next}}); };
  const toggleNight=()=>{ const cur=log[today]||{ok:0,acc:0};
    set({log:{...log,[today]:{...cur,night:!cur.night}}}); };
  const dayOf=(iso)=>{ const d=log[iso]; if(!d) return null;
    return ((d.acc||0)===0 && (d.ok||0)>0) ? 'dry' : ((d.ok||0)>0||(d.acc||0)>0 ? 'wet' : null); };
  // chuỗi ngày khô liên tiếp tính lùi từ hôm nay
  let streak=0;
  for(let i=0;i<400;i++){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    const st=dayOf(iso);
    if(st==='dry') streak++;
    else if(i===0) continue;  // hôm nay chưa ghi thì chưa tính là đứt
    else break;
  }
  const days=[]; for(let i=29;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    days.push({iso,st:dayOf(iso),d:d.getDate()}); }
  const started=!!p.start;
  return (
    <div>
      {!started && <div className="card" style={{background:'linear-gradient(135deg,var(--surface-2),var(--surface))'}}>
        <b style={{fontSize:14}}>🚽 Bé sẵn sàng bỏ bỉm chưa?</b>
        <div className="muted" style={{fontSize:12,margin:'4px 0 8px',lineHeight:1.55}}>Tick những dấu hiệu bé đã có. Từ khoảng 4 dấu hiệu trở lên là thời điểm thuận lợi — chưa đủ thì cứ đợi thêm, bắt đầu sớm quá thường kéo dài hơn.</div>
        <div className="prog"><i style={{width:(readyN/POTTY_READY.length*100)+'%'}}></i></div>
        <div className="muted" style={{fontSize:11,marginTop:4}}>{readyN}/{POTTY_READY.length} dấu hiệu</div>
      </div>}
      {!started && <div className="card" style={{padding:'4px 13px'}}>
        {POTTY_READY.map(r=>(
          <div key={r} className="row" style={{padding:'8px 0',borderBottom:'1px solid var(--line)'}}>
            <button className="tick" onClick={()=>{ const n={...ready}; if(n[r]) delete n[r]; else n[r]=true; set({ready:n}); }} style={{fontSize:19}}>{ready[r]?'✅':'⬜'}</button>
            <span className="grow" style={{fontSize:13.5}}>{r}</span>
          </div>
        ))}
      </div>}
      {!started && <div style={{margin:'10px 14px'}}>
        <button className="btn" onClick={()=>set({start:todayISO()})}>🚽 Bắt đầu tập từ hôm nay</button>
      </div>}

      {started && <>
        <div className="card center" style={{background:'linear-gradient(135deg,var(--surface-2),var(--surface))'}}>
          <div className="muted" style={{fontSize:11}}>Chuỗi ngày khô liên tiếp</div>
          <div style={{fontSize:34,fontWeight:800,color:'var(--brand)',lineHeight:1.15}}>{streak}</div>
          <div className="muted" style={{fontSize:11}}>bắt đầu tập từ {fmtDateVN(p.start)}</div>
        </div>
        <div className="sec-title">✍️ Hôm nay</div>
        <div className="card">
          <div className="row" style={{gap:8}}>
            <button className="btn sm grow" onClick={()=>bump('ok',1)}>✓ Đi đúng bô ({td.ok||0})</button>
            <button className="btn sm soft grow" onClick={()=>bump('acc',1)}>💧 Tè dầm ({td.acc||0})</button>
          </div>
          <div className="row" style={{gap:8,marginTop:8}}>
            <button className="pill" onClick={()=>bump('ok',-1)}>− bô</button>
            <button className="pill" onClick={()=>bump('acc',-1)}>− dầm</button>
            <span className="grow"></span>
            <button className="pill" style={td.night?{background:'var(--good)',color:'#fff'}:{}} onClick={toggleNight}>🌙 Đêm khô</button>
          </div>
        </div>
        <div className="sec-title">📅 30 ngày gần đây</div>
        <div className="card">
          <div className="grid30">
            {days.map(d=>(
              <span key={d.iso} title={fmtDateVN(d.iso)} className={d.st||''}>{d.d}</span>
            ))}
          </div>
          <div className="row" style={{gap:10,marginTop:7,flexWrap:'wrap'}}>
            <span className="muted" style={{fontSize:10.5}}>🟩 ngày khô</span>
            <span className="muted" style={{fontSize:10.5}}>🟨 có tè dầm</span>
            <span className="muted" style={{fontSize:10.5}}>⬜ chưa ghi</span>
          </div>

/* Việc đến hạn của bé — dùng chung cho thẻ "📌 Cần để ý" ở trang chủ và cho thông báo.
   Trả về [{id,ic,t,go}]; id dùng để mỗi ngày chỉ báo một lần cho mỗi việc. */
function childDueList({child,months,vac,ill,growth,packDone,schoolDays}){
  child=child||{}; vac=vac||{}; growth=growth||[]; ill=ill||[];
  const out=[];
  const dueVac=months==null?[]:CHILD_VACCINES.filter(v=>vacAgeMonths(v.age)<=months);
  const vacMissing=dueVac.filter(v=>!v.items.every(it=>vac[v.age+'|'+it]));
  const nextVac=months==null?null:CHILD_VACCINES.find(v=>vacAgeMonths(v.age)>months);
  const nextVacDays=(nextVac&&child.dob)? daysFromToday(new Date(new Date(child.dob+'T00:00:00').getTime()+vacAgeMonths(nextVac.age)*30.44*86400000).toISOString().slice(0,10)) : null;
  const last=growth[0];
  const daysSinceMeasure=last? daysFromToday(last.date) : null; // âm = bao nhiêu ngày trước
  const sickOpen=ill.filter(x=>!x.recovered);

  if(vacMissing.length) out.push({id:'vacmiss',ic:'💉',t:'Còn mũi chưa tiêm: '+vacMissing.map(v=>v.age).join(', '),go:'health'});
  if(nextVac&&nextVacDays!=null&&nextVacDays>=0&&nextVacDays<=60) out.push({id:'vacnext'+nextVac.age,ic:'💉',t:'Mũi '+nextVac.age+' còn '+nextVacDays+' ngày',go:'health'});
  if(schoolDays!=null&&schoolDays>=0&&schoolDays<=60) out.push({id:'school',ic:'🎒',t:'Đi lớp còn '+schoolDays+' ngày · đồ đã soạn '+packDone+'/'+CHILD_PACK.length,go:'school'});
  if(sickOpen.length) out.push({id:'sick'+sickOpen[0].id,ic:'🤒',t:'Đợt ốm từ '+fmtDateVN(sickOpen[0].date)+' chưa đánh dấu đã khỏi',go:'health'});
  if(daysSinceMeasure!=null&&daysSinceMeasure<=-30) out.push({id:'measure',ic:'📏',t:'Đã '+Math.abs(daysSinceMeasure)+' ngày chưa đo cân nặng',go:'health'});
  if(!child.dob) out.push({id:'dob',ic:'🎂',t:'Chưa nhập ngày sinh — nhập để app hiện đúng mốc theo tuổi',go:null});
  return out;
}

/* ============ Mục 5 — nhắc việc ============
   App Sóc không có server đẩy (web-push nằm bên Just Us), nên chỉ nhắc được
   KHI APP ĐANG MỞ: kiểm lúc mở, mỗi 15 phút, và mỗi lần quay lại tab.
   Mỗi việc chỉ báo một lần trong ngày — dấu vết lưu ở ju.childNotiSeen
   (riêng từng máy, KHÔNG đồng bộ, để máy kia vẫn được nhắc). */
function NotiRunner({due,childName}){
  const [cfg]=useLocal('ju.childNoti',{on:false});
  const ids=due.map(d=>d.id).join('|');
  useEffect(()=>{
    if(!cfg.on || typeof Notification==='undefined') return;
    const tick=()=>{
      if(Notification.permission!=='granted') return;
      const day=todayISO();
      let seen=store.get('ju.childNotiSeen',null)||{};
      if(seen.date!==day) seen={date:day,ids:{}};
      const fresh=due.filter(d=>!seen.ids[d.id]);
      if(!fresh.length) return;
      const body=fresh.slice(0,4).map(x=>x.ic+' '+x.t).join('\n');
      const opts={body,icon:'icon.svg',badge:'icon.svg',tag:'soc-daily-'+day,data:{url:'./'}};
      const title='🐿️ '+(childName||'Bé')+' — nhắc hôm nay';
      try{
        if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
          navigator.serviceWorker.getRegistration().then(r=>{
            if(r&&r.showNotification) r.showNotification(title,opts); else new Notification(title,opts);
          }).catch(()=>{ try{ new Notification(title,opts); }catch(_){} });
        } else new Notification(title,opts);
      }catch(e){}
      fresh.forEach(f=>{ seen.ids[f.id]=1; });
      store.set('ju.childNotiSeen',seen);
    };
    tick();
    const iv=setInterval(tick,15*60*1000);
    const onVis=()=>{ if(!document.hidden) tick(); };
    document.addEventListener('visibilitychange',onVis);
    return ()=>{ clearInterval(iv); document.removeEventListener('visibilitychange',onVis); };
  },[cfg.on,ids,childName]);
  return null;
}

      </div>
    </div>
  );
}

        </div>
        </Collapse>
        <Collapse id="child-schoolpick" defaultOpen={false} title="🏫 Chọn trường mầm non">
          <SchoolPicker/>
        </Collapse>
        <Collapse id="child-schoolstart" defaultOpen={false} title="📆 Lịch làm quen ngày đầu đi lớp">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Tăng dần thay vì thả cả ngày ngay hôm đầu — bé quen nhanh hơn và ít ốm hơn.</div>
          {SCHOOL_START.map(s=>(
            <div key={s.d} className="item" style={{padding:'9px 13px'}}>
              <b style={{fontSize:13.5}}>{s.d}</b>
              <div className="muted" style={{fontSize:12.5,marginTop:2,lineHeight:1.55}}>{s.t}</div>
            </div>
          ))}
        </Collapse>
        <Collapse id="child-teachernote" defaultOpen={false} title="📝 Tờ dặn cô">
          <TeacherNote child={child} people={people}/>
        </Collapse>
        <Collapse id="child-schoolill" defaultOpen={false} title="🦠 Bệnh hay lây ở lớp — nghỉ mấy ngày">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Số ngày nghỉ là mức thường được khuyến cáo; trường và bác sĩ có thể yêu cầu khác.</div>
          <GuideList items={SCHOOL_ILL} keyOf={x=>x.n} titleOf={x=>x.n} iconOf={x=>x.icon} render={x=>(
            <div style={{fontSize:13,lineHeight:1.6}}>
              <div><b>Dấu hiệu:</b> {x.sign}</div>
              <div style={{marginTop:4}}><b>Nghỉ học:</b> {x.off}</div>
              <div className="muted" style={{marginTop:4}}>⚠️ {x.note}</div>
            </div>
          )}/>
        </Collapse>
        <Collapse id="child-docs" defaultOpen={false} title="🗂️ Giấy tờ của bé">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Danh sách để soát cho đủ. Bản chụp thì cất bên <b>Just Us → Giấy tờ</b> (mã hoá đầu-cuối) — đừng lưu thành kho thứ hai ở đây.</div>
          {CHILD_DOCS.map(d=>(
            <div key={d.n} className="item" style={{padding:'9px 13px'}}>
              <div className="row"><span style={{fontSize:19,flex:'0 0 auto'}}>{d.icon}</span>
                <div className="grow"><b style={{fontSize:13.5}}>{d.n}</b>
                  <div className="muted" style={{fontSize:12.5,marginTop:2,lineHeight:1.5}}>{d.d}</div></div>
                <button className="tick" onClick={()=>setDocs(s=>{ const n={...s}; if(n[d.n]) delete n[d.n]; else n[d.n]=true; return n; })} style={{fontSize:19}}>{docs[d.n]?'✅':'⬜'}</button></div>
            </div>
          ))}
          <div style={{margin:'10px 14px'}}><a className="btn soft" href="../index.html" style={{display:'block',textAlign:'center',textDecoration:'none'}}>🔒 Mở mục Giấy tờ bên Just Us</a></div>
        </Collapse>
      </div>}

      {tab==='family' && <div>
        <Collapse id="child-twos" defaultOpen={false} title="🌪️ “Khủng hoảng tuổi lên 2” là gì">
          <div className="card">
            <div style={{fontSize:13.5,lineHeight:1.65}}>{TWOS_CRISIS.what}</div>
            <div className="muted" style={{fontSize:12.5,marginTop:8,lineHeight:1.6}}>🕐 {TWOS_CRISIS.when}</div>
            <div style={{marginTop:9,fontSize:12,fontWeight:800}}>NHÌN RA Ở ĐÂU</div>
            {bullets(TWOS_CRISIS.signs||[],{marginTop:3})}
            <div style={{marginTop:9,fontSize:12,fontWeight:800,color:'var(--good)'}}>ĐI QUA CHO NHẸ</div>
            {bullets(TWOS_CRISIS.help||[],{marginTop:3})}
            <div className="muted" style={{fontSize:12.5,marginTop:9,lineHeight:1.6}}>🌤️ {TWOS_CRISIS.end}</div>
          </div>
        </Collapse>
        <Collapse id="child-burnout" defaultOpen={false} title="🫂 Bố mẹ đuối sức">
          <div className="card">
            <div className="muted" style={{fontSize:12.5,lineHeight:1.6}}>{PARENT_BURNOUT.lead}</div>
            <div style={{marginTop:9,fontSize:12,fontWeight:800}}>DẤU HIỆU</div>
            {bullets(PARENT_BURNOUT.signs||[],{marginTop:3})}
            <div style={{marginTop:9,fontSize:12,fontWeight:800,color:'var(--good)'}}>LÀM ĐƯỢC NGAY HÔM NAY</div>
            {bullets(PARENT_BURNOUT.now||[],{marginTop:3})}
            <div style={{marginTop:9,fontSize:12,fontWeight:800}}>SAN SẺ VỚI NHAU</div>
            {bullets(PARENT_BURNOUT.share||[],{marginTop:3})}
            <div className="callout er"><div className="h">Khi nào cần người giúp</div>
              <div style={{fontSize:12.5,lineHeight:1.6}}>{PARENT_BURNOUT.help}</div></div>
          </div>
        </Collapse>
        <Collapse id="child-parenting" defaultOpen={false} title="🤝 Thống nhất cách dạy con">
          <ParentingAgreement/>
        </Collapse>
        <Collapse id="child-duty" defaultOpen={false} title="🤝 Ai lo việc nào">
          <DutyBoard people={people}/>
        </Collapse>
      </div>}

      {tab==='parent' && <div>
        <Collapse id="child-scripts" defaultOpen={false} title="💬 Con đang ăn vạ — nói câu gì bây giờ">
          <TantrumScripts/>
        </Collapse>
        <Collapse id="child-behavior" defaultOpen={false} title="🧭 Hành vi tuổi lên 2">
          <GuideList items={CHILD_BEHAVIOR} keyOf={x=>x.title} titleOf={x=>x.title} iconOf={x=>x.icon} render={x=>(
            <div>
              <div className="muted" style={{fontSize:12.5,lineHeight:1.6}}>{x.lead}</div>
              {bullets(x.steps,{marginTop:7})}
              {x.note && <div className="muted" style={{fontSize:11.5,marginTop:7,lineHeight:1.55}}>⚠️ {x.note}</div>}
            </div>
          )}/>
        </Collapse>
        <Collapse id="child-chores" defaultOpen={false} title="🧹 Việc nhà vừa sức bé 2 tuổi">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Tuổi này bé thật sự thích giúp. Qua tuổi này là hết hứng, nên tận dụng đúng lúc.</div>
          {CHORES_2Y.map(c=>(
            <div key={c.n} className="item" style={{padding:'9px 13px'}}>
              <div className="row"><span style={{fontSize:19,flex:'0 0 auto'}}>{c.icon}</span>
                <div className="grow"><b style={{fontSize:13.5}}>{c.n}</b>
                  <div className="muted" style={{fontSize:12.5,marginTop:2}}>{c.d}</div></div></div>
            </div>
          ))}
        </Collapse>
        <Collapse id="child-corner" defaultOpen={false} title="🪜 Bày nhà cho bé tự làm được">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Mục “Kỹ năng tự lập” dạy bé cách làm; phần này là bày nhà sao cho bé làm được mà không cần gọi mẹ.</div>
          {SELF_CORNER.map(c=>(
            <div key={c.n} className="item" style={{padding:'9px 13px'}}>
              <div className="row"><span style={{fontSize:19,flex:'0 0 auto'}}>{c.icon}</span>
                <div className="grow"><b style={{fontSize:13.5}}>{c.n}</b>
                  <div className="muted" style={{fontSize:12.5,marginTop:2,lineHeight:1.5}}>{c.d}</div></div></div>
            </div>
          ))}
        </Collapse>
        <Collapse id="child-skillguides" defaultOpen={false} title="🌱 Dạy kỹ năng tự túc đầu tiên">
        <div className="muted center" style={{fontSize:11,margin:'0 14px 6px'}}>Bấm từng kỹ năng để xem cách dạy theo bước. Mỗi bé một nhịp — cứ từ từ, khen nhiều 💛</div>
        {SKILL_GUIDES.filter(g=>!gDone[g.name]).map(g=><SkillGuide key={g.name} g={g} done={false} onTick={()=>setGDone({...gDone,[g.name]:true})}/>)}
        {SKILL_GUIDES.some(g=>gDone[g.name]) && <div className="muted" style={{fontSize:11,margin:'10px 14px 4px'}}>✅ Bé đã biết ({SKILL_GUIDES.filter(g=>gDone[g.name]).length}) — bấm nút xanh để bỏ đánh dấu:</div>}
        {SKILL_GUIDES.filter(g=>gDone[g.name]).map(g=><SkillGuide key={g.name} g={g} done={true} onTick={()=>{ const n={...gDone}; delete n[g.name]; setGDone(n); }}/>)}
        </Collapse>
        <Collapse id="child-issues" defaultOpen={false} title="🧩 Vấn đề thường gặp & cách xử lý">
          <div className="muted center" style={{fontSize:11,margin:'0 14px 6px'}}>Bấm vào chủ đề để xem gợi ý.</div>
          <div className="card">
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {CHILD_ISSUES.map(f=><button key={f.title} className="pill" onClick={()=>setBrowseIssue(f)}>{f.icon} {f.title}</button>)}
            </div>
          </div>
        </Collapse>
        {browseIssue && <Sheet title={browseIssue.icon+' '+browseIssue.title} onClose={()=>setBrowseIssue(null)}>
          <ul style={{margin:'4px 0 0',paddingLeft:18,fontSize:14,lineHeight:1.7}}>{browseIssue.tips.map((t,i)=><li key={i} style={{marginBottom:7}}>{t}</li>)}</ul>
        </Sheet>}
        {/* Nhật ký "điều đầu tiên" đã chuyển sang tab 📔 Kỷ niệm cho gọn một mối */}
        <div className="sec-title">😤 Nhật ký “cơn ăn vạ”</div>
        <div className="muted center" style={{fontSize:11,margin:'0 14px 4px'}}>Ghi tình huống + cách xử lý hiệu quả để lần sau rút kinh nghiệm.</div>
        <div className="card">
          <input className="inp" placeholder="Tình huống (vd: không cho xem TV thì khóc)" value={tanForm.situation} onChange={e=>setTanForm({...tanForm,situation:e.target.value})}/>
          <input className="inp" style={{marginTop:8}} placeholder="Cách mình đã xử lý" value={tanForm.handling} onChange={e=>setTanForm({...tanForm,handling:e.target.value})}/>
          <button className="btn" style={{marginTop:8}} onClick={addTantrum}>＋ Ghi lại</button>
        </div>
        {tantrum.map(x=>(
          <div key={x.id} className="item">
            <div className="it-top"><h4 style={{fontSize:14}}>😤 {x.situation}</h4>
              <button className="xbtn" aria-label="Xoá" onClick={()=>{ if(confirm('Xoá ghi chép này?')) setTantrum(tantrum.filter(y=>y.id!==x.id)); }}>✕</button></div>
            {x.handling && <div className="muted" style={{fontSize:12.5,marginTop:3}}>💡 Cách xử lý: {x.handling}</div>}
            <div className="row" style={{marginTop:6,gap:6}}><span className="muted" style={{fontSize:11}}>{fmtDateVN(x.date)} · Hiệu quả?</span>
              <button className="pill" style={{background:x.worked===true?'var(--good)':'var(--surface-2)',color:x.worked===true?'#fff':'var(--brand-ink)'}} onClick={()=>setTanWorked(x.id,true)}>👍 Có</button>
              <button className="pill" style={{background:x.worked===false?'#b06b6b':'var(--surface-2)',color:x.worked===false?'#fff':'var(--brand-ink)'}} onClick={()=>setTanWorked(x.id,false)}>👎 Không</button></div>
          </div>
        ))}
      </div>}
      <Dock tab={tab} onGo={setTab} alertGroups={alertGroups}/>
    </div>
  );
}

/* ============ Vỏ app ============ */
function App(){
  const setup=store.get('ju.setup',{})||{};
  const people={a:setup.a||{name:'Bố',avatar:'🧑'}, b:setup.b||{name:'Mẹ',avatar:'👩'}};
  const me=store.get('ju.me',setup.me||'a');
  // Dữ liệu tĩnh hỏng thì nói thẳng, đừng vẽ các mục rỗng một cách im lặng
  if(!(CHILD_VACCINES||[]).length && !(EMERGENCY||[]).length){
    return (
      <div className="app">
        <header className="hdr"><div className="id"><span className="mark">🐿️</span>
          <span className="nm">Sóc</span></div></header>
        <div className="card" style={{marginTop:24}}>
          <b style={{fontSize:'var(--t-lg)'}}>Chưa tải được nội dung</b>
          <div className="muted" style={{fontSize:'var(--t-sm)',margin:'8px 0 14px',lineHeight:1.6}}>
            App không đọc được <code>data/child.json</code>. Thường là do lần đầu mở mà không có mạng.
            Bật mạng rồi tải lại trang là xong — sau lần đầu thì app chạy được cả khi offline.
          </div>
          <button className="btn" onClick={()=>location.reload()}>↻ Tải lại</button>
          <a className="btn ghost" href="../index.html" style={{marginTop:10,textDecoration:'none'}}>← Về Just Us</a>
        </div>
      </div>
    );
  }
  return (
    <div className="app">
      <ChildCare people={people} me={me}/>
    </div>
  );
}

window.__SC_OK=true;
const __root=ReactDOM.createRoot(document.getElementById('root'));
const __mount=()=>{ try{ __root.render(<App/>); }catch(e){ console.error(e); } };
const __ready=window.__JU_DATA_READY||Promise.resolve();
Promise.race([__ready,new Promise(r=>setTimeout(r,5000))]).then(__mount,__mount);
__ready.then(__mount,()=>{});
// Nối đám mây sau khi đã vẽ xong (không chặn màn hình)
Cloud.init();
window.addEventListener('ju:remote',()=>{});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Cloud.ready) Cloud.pull(); });
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
