name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Từ 23/11/2026 (QD-377) app chạy ở just-us-nha.pages.dev; địa chỉ github.io cũ chỉ còn
      # trang chuyển hướng dọn dữ liệu khỏi gốc chung, kèm trang chuyển hướng Tâm linh cũ.
      # ⛔ Đừng trả về `path: .` — đó là đẩy lại cả app lên gốc chung.
      - name: Gom trang chuyển hướng
        run: |
          mkdir -p _site
          cp -R chuyen-huong/. _site/
          cp -R tam-linh _site/tam-linh
          rm -rf _site/tam-linh/__pycache__
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
