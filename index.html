  {k:'chill',label:'🍃 Chill / sống chậm',cats:['cafe'],re:/chill|thư giãn|sống chậm|yên|nhẹ nhàng|bình yên/i},
  {k:'lamviec',label:'💻 Hợp làm việc',cats:['cafe'],re:/làm việc|học bài|yên tĩnh|wifi|sách|cổ điển/i},
  {k:'boardgame',label:'🎲 Board game',cats:['cafe'],re:/board game|boardgame/i},

  {k:'haisan',label:'🦐 Hải sản',cats:['an'],re:/hải sản|ốc|cua|ngao|nghêu|tôm/i},
  {k:'chay',label:'🥗 Chay',cats:['an'],re:/chay/i},

];
const vibeTags=(s)=> VIBES.filter(v=>(v.cats.indexOf(s.cat)>=0)&&v.re.test((s.n||'')+' '+(s.note||''))).map(v=>v.k);

        <select className="inp grow" value={vibe} onChange={e=>setVibe(e.target.value)} style={{fontSize:12.5}}>
          <option value="">🏷️ Mọi kiểu quán</option>
          {VIBES.filter(v=>!cat||v.cats.indexOf(cat)>=0).map(v=><option key={v.k} value={v.k}>{v.label}</option>)}

      <div className="filters">
        <button className={sort==='near'?'on':''} onClick={()=>setSort('near')}>📍 Gần → xa</button>

        <button className={sort==='kid'?'on':''} onClick={()=>setSort('kid')}>🧸 Hợp trẻ em</button>
        <button className={sort==='default'?'on':''} onClick={()=>setSort('default')}>Mặc định</button>
      </div>
      <div className="row" style={{margin:'8px 14px 0'}}><span className="muted grow" style={{fontSize:11.5}}>{list.length} địa điểm · từ nhà ({NHA.name.split(',')[0]}){hidden.length?` · đã ẩn ${hidden.length}`:''}</span>
        {hidden.length>0 && <button className="muted" style={{fontSize:11.5}} onClick={()=>{ if(confirm('Hiện lại tất cả gợi ý đã ẩn?')) setHidden([]); }}>↩︎ Khôi phục</button>}</div>
      {list.map((s,i)=>(
        <div key={i} className="item">
          <div className="it-top"><h4>{catIcon(s.cat)} {s.n}{isKidSpot(s)?<span className="pill" style={{marginLeft:6,fontSize:10,padding:'1px 6px',verticalAlign:'middle'}}>🧸 hợp trẻ em</span>:null}</h4></div>
          <div className="muted" style={{fontSize:12,marginTop:2}}>📍 {s.area}{distOf(s)!=null?` · 📏 ~${distOf(s).toFixed(distOf(s)<10?1:0)} km từ nhà`:''}</div>
          {(s.h||s.p) && <div className="muted" style={{fontSize:12,marginTop:3}}>{s.h?'🕘 '+s.h:''}{s.h&&s.p?'  ·  ':''}{s.p?'💵 '+s.p+(isFood(s)&&s.p.indexOf('/')<0?'/người':''):''}</div>}
          {s.note && <div className="it-note">{s.note}</div>}
          <div className="it-meta">
            <span className="pill">{budgetLabel(s.budget)}</span>
            <a className="pill" href={mapsUrl(s)} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>⭐ Đánh giá · chỉ đường</a>
            <span className="grow"></span>
            <button className="pill" onClick={()=>isFood(s)?addFood(s):addIdea(s)}>{isFood(s)?'🍽️ Lưu Quán':'💡 Lưu'}</button>
            {s.lat!=null && <button className="pill" onClick={()=>pin(s)}>📍 Ghim</button>}
            <button className="iconbtn" title="Ẩn gợi ý này" onClick={()=>hide(s)}>🚫</button>
          </div>
        </div>
      ))}
      <div style={{height:8}}></div>
    </div>
  );
}

function EventsSuggest({me,flash}){
  const [prefs,setPrefs]=useLocal('ju.eventPrefs',{});
  const [,setEvents]=useLocal('ju.events',[]);
  const rate=(id,v)=>{ const n={...prefs}; n[id]= n[id]===v? 0 : v; if(!n[id]) delete n[id]; setPrefs(n); };
  const tagScore={};
  HN_EVENTS.forEach(e=>{ const r=prefs[e.id]; if(r) e.tags.forEach(t=>tagScore[t]=(tagScore[t]||0)+r); });
  const score=(e)=> e.tags.reduce((s,t)=>s+(tagScore[t]||0),0) + (prefs[e.id]||0)*0.1;
  const sorted=HN_EVENTS.slice().sort((a,b)=>score(b)-score(a));
  const topTags=Object.entries(tagScore).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>EVENT_TAGS[t]);
  const addToCal=(e)=>{ setEvents(p=>[{id:uid(),title:'🎪 '+e.title,date:'',note:e.where+' · '+e.when,by:me,todos:[],createdAt:Date.now()},...p]); flash('Đã thêm vào Sự kiện: '+e.title); };
  return (
    <div>
      <div className="muted center" style={{fontSize:12,margin:'10px 14px'}}>🎪 Sự kiện ở Hà Nội — bấm 👍/👎 để app hiểu gu hai đứa, lần sau gợi ý hợp hơn.</div>
      {topTags.length>0 && <div className="card" style={{background:'linear-gradient(135deg,var(--chip),var(--card))'}}><b style={{fontSize:13.5}}>💖 Gu của hai đứa:</b> <span style={{fontSize:13.5}}>{topTags.join(' · ')}</span></div>}
      {sorted.map(e=>(
        <div key={e.id} className="item">
          <div className="it-top"><h4>🎪 {e.title}</h4></div>
          <div className="muted" style={{fontSize:12,marginTop:2}}>📅 {e.when} · 📍 {e.where}</div>
          <div className="muted" style={{fontSize:11.5,marginTop:3}}>{e.tags.map(t=>EVENT_TAGS[t]).filter(Boolean).join(' · ')}</div>
          {e.note && <div className="it-note">{e.note}</div>}
          <div className="it-meta">
            <button className="pill" style={{background:prefs[e.id]===1?'var(--good)':'var(--chip)',color:prefs[e.id]===1?'#fff':'var(--chip-tx)'}} onClick={()=>rate(e.id,1)}>👍 Thích</button>
            <button className="pill" style={{background:prefs[e.id]===-1?'#b06b6b':'var(--chip)',color:prefs[e.id]===-1?'#fff':'var(--chip-tx)'}} onClick={()=>rate(e.id,-1)}>👎 Không</button>
            <span className="grow"></span>
            <button className="pill" onClick={()=>addToCal(e)}>📅 Thêm lịch</button>
          </div>
        </div>
      ))}
      <div className="muted center" style={{fontSize:11,margin:'6px 14px'}}>Danh sách được cập nhật định kỳ. Sự kiện theo mùa/âm lịch ghi rõ thời gian.</div>
    </div>
  );
}

/* ============ Check-in quán (đã ghé + tự đánh giá) ============ */
function CheckIns({people,me}){
  const [items,setItems]=useLocal('ju.checkins',[]);
  const [open,setOpen]=useState(false);
  const [edit,setEdit]=useState(null);
  const [filter,setFilter]=useState('all');
  const save=(c)=>{ if(c.id) setItems(items.map(x=>x.id===c.id?c:x)); else { setItems([{...c,id:uid(),by:me,createdAt:Date.now()},...items]); celebrate(['📸','💞','✨']); } setOpen(false);setEdit(null); };
  const del=(id)=>{ if(confirm('Xoá check-in này?')) setItems(items.filter(x=>x.id!==id)); };
  const mapsUrl=(c)=>{ const q=[c.name,c.address].filter(Boolean).join(' '); return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(/hà nội|hanoi/i.test(q)?q:q+' Hà Nội'); };
  let shown=items.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')|| b.createdAt-a.createdAt);
  if(filter!=='all') shown=shown.filter(x=>x.type===filter);
  return (
    <div>
      <div className="row" style={{margin:'10px 14px'}}><span className="grow muted" style={{fontSize:13}}>Quán đã ghé · {items.length} lần</span>
        <button className="btn sm" onClick={()=>{setEdit(null);setOpen(true);}}>📸 Check-in mới</button></div>
      <div className="filters">
        <button className={filter==='all'?'on':''} onClick={()=>setFilter('all')}>Tất cả</button>
        <button className={filter==='cafe'?'on':''} onClick={()=>setFilter('cafe')}>☕ Cafe</button>
        <button className={filter==='food'?'on':''} onClick={()=>setFilter('food')}>🍜 Quán ăn</button>
      </div>
      {shown.length===0 && <div className="empty"><span className="big">📸</span>Đến quán mới? Check-in + chấm điểm + lưu ảnh & địa chỉ ngay — kể cả quán chưa có trong danh sách!</div>}
      {shown.map(c=>(
        <div key={c.id} className="item">
          {c.photo && <PhotoImg photo={c.photo} style={{width:'100%',maxHeight:210,objectFit:'cover',borderRadius:10,marginBottom:8,display:'block'}}/>}
          <div className="it-top"><h4>{c.type==='food'?'🍜':'☕'} {c.name}</h4>
            {typeof c.rating==='number'&&c.rating>0 && <Stars value={c.rating}/>}</div>
          {c.address && <div className="it-note muted">📍 {c.address}</div>}
          {c.review && <div className="it-note">{c.review}</div>}
          <div className="it-meta">
            <span className="av-sm">{people[c.by]?.avatar||'❤️'}</span>
            {c.date && <span className="muted" style={{fontSize:12}}>{fmtDateVN(c.date)}</span>}
            <a className="pill" href={mapsUrl(c)} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>🗺️ Google Maps</a>
            <span className="grow"></span>
            <button className="iconbtn" onClick={()=>{setEdit(c);setOpen(true);}}>✏️</button>
            <button className="iconbtn" onClick={()=>del(c.id)}>🗑️</button>
          </div>
        </div>
      ))}
      {open && <CheckInForm init={edit} onClose={()=>{setOpen(false);setEdit(null);}} onSave={save}/>}
    </div>
  );
}
function CheckInForm({init,onClose,onSave}){
  const [f,setF]=useState(()=>init?{...init}:{name:'',type:'cafe',address:'',rating:0,review:'',photo:null,date:todayISO()});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const fileRef=useRef(null); const [busy,setBusy]=useState(false);
  const [q,setQ]=useState(''); const [results,setResults]=useState([]); const [searching,setSearching]=useState(false);
  const tRef=useRef(null);
  const runSearch=(text)=>{ setQ(text); clearTimeout(tRef.current);
    if(text.trim().length<3){ setResults([]); return; }
    tRef.current=setTimeout(async()=>{ setSearching(true);
      try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&accept-language=vi&countrycodes=vn&q='+encodeURIComponent(text)); setResults(await r.json()); }
      catch(e){ setResults([]); } setSearching(false);
    },550);
  };
  const pick=(r)=>{ const nm=(r.display_name||'').split(',')[0].trim();
    setF(p=>({...p,name:nm,address:(r.display_name||'').replace(/,?\s*Việt Nam$/,'').trim(),lat:parseFloat(r.lat),lng:parseFloat(r.lon)}));
    setResults([]); setQ(''); };
  const onFile=async(e)=>{ const file=e.target.files[0]; if(!file)return; e.target.value=''; setBusy(true);
    try{ if(Cloud.connected()){ const p=await Cloud.uploadPhoto(file); set('photo',{path:p}); setBusy(false); }
      else { const r=new FileReader(); r.onload=()=>{ set('photo',{src:r.result}); setBusy(false); }; r.readAsDataURL(file); } }
    catch(err){ setBusy(false); } };
  return (
    <Sheet title={(init?'Sửa ':'')+'📸 Check-in quán'} onClose={onClose}>
      <div className="field"><label>🔎 Tìm quán (tự điền địa chỉ)</label>
        <input className="inp" autoFocus value={q} onChange={e=>runSearch(e.target.value)} placeholder="Gõ tên quán hoặc địa chỉ…"/>
        {searching && <div className="muted" style={{fontSize:12,marginTop:4}}>Đang tìm…</div>}
        {results.length>0 && <div className="card" style={{margin:'6px 0 0',padding:'2px 10px',maxHeight:190,overflow:'auto'}}>
          {results.map((r,i)=>(<div key={i} className="row" style={{padding:'8px 0',borderBottom:'1px solid var(--line)',cursor:'pointer',gap:8}} onClick={()=>pick(r)}>
            <span style={{fontSize:15}}>📍</span><span className="grow" style={{fontSize:12.5,lineHeight:1.3}}>{r.display_name}</span></div>))}
        </div>}
        <div className="muted" style={{fontSize:11,marginTop:3}}>Gợi ý từ OpenStreetMap — chọn xong vẫn sửa tên/địa chỉ bên dưới được.</div>
      </div>
      <div className="field"><label>Tên quán</label>
        <input className="inp" value={f.name} onChange={e=>set('name',e.target.value)} placeholder="VD: Cafe Đinh / Bún chả ..."/></div>
      <div className="field"><label>Loại</label>
        <div className="emoji-row">
          <button className={f.type==='cafe'?'on':''} onClick={()=>set('type','cafe')} style={{width:'auto',padding:'8px 12px',fontSize:13}}>☕ Cafe</button>
          <button className={f.type==='food'?'on':''} onClick={()=>set('type','food')} style={{width:'auto',padding:'8px 12px',fontSize:13}}>🍜 Quán ăn</button>
        </div></div>
      <div className="field"><label>Địa chỉ</label>
        <input className="inp" value={f.address} onChange={e=>set('address',e.target.value)} placeholder="Số nhà, phố, quận… (để mở Google Maps)"/></div>
      <div className="field"><label>Đánh giá của hai đứa</label><div><Stars value={f.rating||0} onChange={v=>set('rating',v)}/></div></div>
      <div className="field"><label>Ảnh</label>
        {f.photo
          ? <div style={{position:'relative'}}><PhotoImg photo={f.photo} style={{width:'100%',height:160,objectFit:'cover',borderRadius:12,display:'block'}}/>
              <button className="pill" style={{position:'absolute',top:6,right:6}} onClick={()=>set('photo',null)}>✕ Bỏ ảnh</button></div>
          : <button className="btn soft" onClick={()=>fileRef.current.click()}>{busy?'Đang tải…':'📷 Thêm ảnh'}</button>}
        <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile}/></div>
      <div className="field"><label>Ngày ghé</label>
        <input className="inp" type="date" value={f.date||''} onChange={e=>set('date',e.target.value)}/></div>
      <div className="field"><label>Nhận xét</label>
        <textarea className="inp" value={f.review} onChange={e=>set('review',e.target.value)} placeholder="Đồ uống/món ăn, không gian, giá, có quay lại không…"/></div>
      <button className="btn" onClick={()=>{ if(f.name.trim()) onSave(f); }}>📸 Lưu check-in</button>
    </Sheet>
  );
}

function DateIdeas({people,me}){
  const [items,setItems]=useLocal('ju.ideas',[]);
  const [events,setEvents]=useLocal('ju.events',[]);
  const [bFilter,setBFilter]=useState('');
  const [open,setOpen]=useState(false);
  const [edit,setEdit]=useState(null);
  const [pick,setPick]=useState(null);
  const [sugOpen,setSugOpen]=useState(false);
  const [planning,setPlanning]=useState(null);
  const [planDate,setPlanDate]=useState('');
  const schedule=()=>{ if(!planDate)return; setEvents([{id:uid(),title:'Hẹn hò: '+planning.title,date:planDate,note:planning.note||'',remind:1,by:me,todos:[]},...events]); celebrate(['📅','💞','✨']); setPlanning(null); setPlanDate(''); };

  const save=(it)=>{
    if(it.id) setItems(items.map(x=>x.id===it.id?it:x));
    else setItems([{...it,id:uid(),by:me,fav:false,done:false,createdAt:Date.now()},...items]);

  };
  const addIdea=(title,budget)=> setItems(prev=>[{title,budget,id:uid(),by:me,fav:false,done:false,createdAt:Date.now()},...prev]);
  const del=(id)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setItems(items.filter(x=>x.id!==id)); } };
  const toggle=(id,f)=>setItems(items.map(x=>x.id===id?{...x,[f]:!x[f]}:x));

  const pool=bFilter?items.filter(x=>x.budget===bFilter):items;
  const shown=pool.slice().sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||b.createdAt-a.createdAt);
  const [wnote,setWnote]=useState('');
  const [wbusy,setWbusy]=useState(false);
  const random=async()=>{
    let arr;
    if(pool.length) arr=pool;
    else if(bFilter) arr=(IDEA_SUGGEST[bFilter]||[]).map(t=>({title:t,budget:bFilter}));
    else arr=[].concat.apply([],Object.keys(IDEA_SUGGEST).map(k=>IDEA_SUGGEST[k].map(t=>({title:t,budget:k}))));
    if(!arr.length) return;
    setWbusy(true);
    const w=await getWeather(GIANGVO.lat,GIANGVO.lng);
    setWbusy(false);
    let filtered=arr, note='';
    if(w){
      if(w.storm){ filtered=arr.filter(x=>ideaOutdoor(x.title)===false); note='⛈️ '+w.text+' '+w.temp+'° — chỉ gợi ý trong nhà'; }
      else if(w.rain){ filtered=arr.filter(x=>ideaOutdoor(x.title)!==true); note='🌧️ '+w.text+' '+w.temp+'° — ưu tiên trong nhà'; }
      else if(w.temp>=35){ filtered=arr.filter(x=>ideaOutdoor(x.title)!==true); note='🥵 Nắng nóng '+w.temp+'° — ưu tiên trong nhà/có điều hoà'; }
      else { note=w.icon+' '+w.text+' '+w.temp+'° — thời tiết đẹp, thoải mái ra ngoài'; }
      if(!filtered.length) filtered=arr;
      note+=' · nguồn '+w.src;
    } else { note='(Không lấy được thời tiết — gợi ý ngẫu nhiên)'; }
    setWnote(note);
    setPick(filtered[Math.floor(Math.random()*filtered.length)]);
  };

  return (
    <div>
      <div className="filters">
        <button className={bFilter===''?'on':''} onClick={()=>setBFilter('')}>Mọi mức</button>
        {BUDGETS.map(b=><button key={b.k} className={bFilter===b.k?'on':''} onClick={()=>setBFilter(b.k)}>{b.label}</button>)}
      </div>
      <div className="row" style={{margin:'10px 14px',gap:8}}>
        <button className="btn grow" onClick={random} disabled={wbusy}>{wbusy?'⏳ Xem thời tiết…':'🎲 Gợi ý theo thời tiết'}</button>
        <button className="btn sm soft" onClick={()=>setSugOpen(true)}>💡 Thư viện</button>
        <button className="btn sm soft" onClick={()=>{setEdit(null);setOpen(true);}}>＋</button>
      </div>
      {pick && (
        <div className="card center" style={{borderColor:'var(--primary)',borderWidth:2}}>
          {wnote && <div className="muted" style={{fontSize:12,marginBottom:4}}>{wnote}</div>}
          <div className="muted" style={{fontSize:12}}>🎲 Hôm nay nên…</div>
          <div style={{fontSize:20,fontWeight:800,margin:'6px 0'}}>{pick.title}</div>
          {pick.budget && <span className="pill">{budgetLabel(pick.budget)}</span>}
          {pick.note && <div className="it-note" style={{marginTop:8}}>{pick.note}</div>}
        </div>
      )}
      {shown.length===0 && <div className="empty"><span className="big">💡</span>Thêm ý tưởng hẹn hò theo từng mức ngân sách.</div>}
      {shown.map(it=>(
        <div key={it.id} className={'item'+(it.done?' dn':'')}>
          <div className="it-top">
            <h4>{it.title}</h4>
            <button className={'heartbtn'+(it.fav?' on':'')} onClick={()=>toggle(it.id,'fav')}>{it.fav?'❤️':'🤍'}</button>
          </div>
          {it.note && <div className="it-note">{it.note}</div>}
          <div className="it-meta">
            <span className="av-sm">{people[it.by]?.avatar||'❤️'}</span>
            {it.budget && <span className="pill">{budgetLabel(it.budget)}</span>}
            <span className="grow"></span>
            <button className="pill" onClick={()=>{setPlanning(it);setPlanDate('');}}>📅 Lên lịch</button>
            <button className="pill" onClick={()=>toggle(it.id,'done')}>{it.done?'↩︎ Bỏ':'✓ Đã đi'}</button>
            <button className="iconbtn" onClick={()=>{setEdit(it);setOpen(true);}}>✏️</button>
            <button className="iconbtn" onClick={()=>del(it.id)}>🗑️</button>
          </div>
        </div>
      ))}
      {open && <ItemForm title={(edit?'Sửa ':'Thêm ')+'ý tưởng hẹn hò'} init={edit} fields={['budget','note']}
        onClose={()=>{setOpen(false);setEdit(null);}} onSave={save}/>}

      {sugOpen && <Sheet title="💡 Thư viện ý tưởng hẹn hò" onClose={()=>setSugOpen(false)}>
        {BUDGETS.map(b=>{
          const left=(IDEA_SUGGEST[b.k]||[]).filter(s=>!items.some(it=>(it.title||'').trim().toLowerCase()===s.toLowerCase()));
          if(left.length===0) return null;
          return (
            <div key={b.k} style={{marginBottom:12}}>
              <div className="muted" style={{fontSize:12.5,fontWeight:800,margin:'4px 0 6px'}}>{b.label}</div>
              <div>{left.map(s=>(
                <button key={s} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5}}
                  onClick={()=>addIdea(s,b.k)}>＋ {s}</button>
              ))}</div>
            </div>
          );
        })}
        <div className="muted center" style={{fontSize:12}}>Chạm để thêm vào danh sách của hai bạn.</div>
      </Sheet>}

      {planning && <Sheet title={'📅 Lên lịch: '+planning.title} onClose={()=>setPlanning(null)}>
        <div className="muted" style={{fontSize:12.5,marginBottom:10}}>Chọn ngày hẹn — sẽ tạo một sự kiện và nhắc trước 1 ngày.</div>
        <div className="field"><label>Ngày hẹn hò</label>
          <input className="inp" type="date" value={planDate} onChange={e=>setPlanDate(e.target.value)} autoFocus/></div>
        <button className="btn" onClick={schedule}>💞 Tạo lịch hẹn</button>
      </Sheet>}
    </div>
  );
}

/* ============ Map spots ============ */
function MapSpots({people,me}){
  const [spots,setSpots]=useLocal('ju.spots',[]);
  const [checkins]=useLocal('ju.checkins',[]);
  const [showCk,setShowCk]=useState(true);
  const mapRef=useRef(null), elRef=useRef(null), layerRef=useRef(null);
  const [picking,setPicking]=useState(false);
  const [draft,setDraft]=useState(null); // {lat,lng}
  const [form,setForm]=useState(null);
  const [search,setSearch]=useState(''); const [results,setResults]=useState([]); const [searching,setSearching]=useState(false);
  const doSearch=async()=>{ if(!search.trim())return; setSearching(true);
    try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=vi&q='+encodeURIComponent(search)); setResults(await r.json()); }
    catch(e){ setResults([]); } setSearching(false); };
  const chooseResult=(r)=>{ const lat=parseFloat(r.lat), lng=parseFloat(r.lon);
    if(mapRef.current) mapRef.current.setView([lat,lng],15);
    setDraft({lat,lng}); setForm({title:(r.display_name||'').split(',')[0],cat:'chơi',note:''}); setResults([]); setSearch(''); };

  useEffect(()=>{
    if(!window.L || mapRef.current) return;
    const map=L.map(elRef.current,{zoomControl:true}).setView([21.0278,105.8342],12); // Hà Nội
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    layerRef.current=L.layerGroup().addTo(map);
    map.on('click',(e)=>{
      setPicking(p=>{
        if(p){ setDraft({lat:e.latlng.lat,lng:e.latlng.lng}); setForm({title:'',cat:'chơi',note:''}); return false; }
        return p;
      });
    });
    mapRef.current=map;
  },[]);

  // vẽ markers
  useEffect(()=>{
    const lg=layerRef.current; if(!lg) return;
    lg.clearLayers();
    spots.forEach(s=>{
      if(s.lat==null) return;
      const m=L.marker([s.lat,s.lng]).addTo(lg);
      m.bindPopup('<b>'+(s.cat==='ăn'?'🍜 ':'📍 ')+(s.title||'')+'</b>'+(s.done?' ✅':'')+(s.note?'<br>'+s.note:''));
    });
    if(showCk) checkins.forEach(c=>{
      if(c.lat==null||c.lng==null) return;
      const icon=L.divIcon({className:'',html:'<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">💗</div>',iconSize:[22,22],iconAnchor:[11,11]});
      const m=L.marker([c.lat,c.lng],{icon}).addTo(lg);
      m.bindPopup('<b>💗 '+(c.name||'')+'</b>'+(c.rating?'<br>'+'⭐'.repeat(c.rating):'')+(c.address?'<br>'+c.address:'')+(c.comment?'<br><i>'+c.comment+'</i>':''));
    });
  },[spots,checkins,showCk]);

  const addSpot=()=>{
    if(!form.title.trim()){ return; }
    setSpots([{id:uid(),title:form.title,cat:form.cat,note:form.note,lat:draft.lat,lng:draft.lng,by:me,done:false,createdAt:Date.now()},...spots]);
    setForm(null);setDraft(null);
  };
  const del=(id)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setSpots(spots.filter(x=>x.id!==id)); } };
  const toggle=(id)=>setSpots(spots.map(x=>x.id===id?{...x,done:!x.done}:x));

  return (
    <div>
      <div className="row" style={{margin:'10px 14px 0',gap:8}}>
        <button className={'btn grow'+(picking?'':' soft')} onClick={()=>setPicking(!picking)}>
          {picking?'👆 Chạm lên bản đồ để ghim…':'📍 Ghim chỗ mới'}</button>
      </div>
      <div className="row" style={{margin:'6px 14px',gap:8,justifyContent:'center'}}>
        <span className="muted" style={{fontSize:12}}>Lưu những chỗ hai đứa muốn đi / đã đi.</span>
        {checkins.some(c=>c.lat!=null) && <button className="muted" style={{fontSize:11.5}} onClick={()=>setShowCk(v=>!v)}>{showCk?'💗 Ẩn check-in':'💗 Hiện check-in'}</button>}
      </div>
      <div className="row" style={{margin:'0 14px 6px',gap:8}}>
        <input className="inp grow" placeholder="🔎 Tìm địa điểm theo tên…" value={search}
          onChange={e=>setSearch(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') doSearch(); }}/>
        <button className="btn sm" onClick={doSearch}>{searching?'…':'Tìm'}</button>
      </div>
      {results.length>0 && <div className="card" style={{padding:'4px 12px',marginTop:0}}>
        {results.map((r,i)=>(
          <div key={i} className="row" style={{padding:'8px 0',borderBottom:'1px solid var(--line)',cursor:'pointer'}} onClick={()=>chooseResult(r)}>
            <span style={{fontSize:15}}>📍</span><span className="grow" style={{fontSize:13}}>{r.display_name}</span>
          </div>
        ))}
      </div>}
      <div id="map" ref={elRef}></div>

      {spots.length===0 && <div className="empty">Chưa ghim chỗ nào. Bấm “Ghim chỗ mới” rồi chạm lên bản đồ.</div>}
      {spots.map(s=>(
        <div key={s.id} className={'item'+(s.done?' dn':'')}>
          <div className="it-top">
            <h4>{s.cat==='ăn'?'🍜 ':'📍 '}{s.title}</h4>
            <button className="iconbtn" onClick={()=>{ if(mapRef.current&&s.lat!=null){ mapRef.current.setView([s.lat,s.lng],16); window.scrollTo({top:0,behavior:'smooth'});} }}>🔍</button>
          </div>
          {s.note && <div className="it-note">{s.note}</div>}
          <div className="it-meta">
            <span className="av-sm">{people[s.by]?.avatar||'❤️'}</span>
            {s.lat!=null && <a className="pill" href={'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>🗺️ Chỉ đường</a>}
            <span className="grow"></span>
            <button className="pill" onClick={()=>toggle(s.id)}>{s.done?'↩︎ Chưa đi':'✓ Đã đi'}</button>
            <button className="iconbtn" onClick={()=>del(s.id)}>🗑️</button>
          </div>
        </div>
      ))}

      {form && (
        <Sheet title="Ghim chỗ mới" onClose={()=>{setForm(null);setDraft(null);}}>
          <div className="field"><label>Tên chỗ</label>
            <input className="inp" autoFocus value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Quán cà phê, công viên…"/></div>
          <div className="field"><label>Loại</label>
            <select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}>
              <option value="chơi">📍 Chỗ chơi</option><option value="ăn">🍜 Chỗ ăn</option></select></div>
          <div className="field"><label>Ghi chú</label>
            <textarea className="inp" value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
          <button className="btn" onClick={addSpot}>💾 Lưu chỗ này</button>
        </Sheet>
      )}
    </div>
  );
}

/* ============ Dòng thời gian tình yêu ============ */
function Timeline({people,me}){
  const [items,setItems]=useLocal('ju.timeline',[]);
  const [open,setOpen]=useState(false);
  const [edit,setEdit]=useState(null);
  const save=(it)=>{ if(it.id) setItems(items.map(x=>x.id===it.id?it:x)); else setItems([...items,{...it,id:uid(),by:me,createdAt:Date.now()}]); setOpen(false); setEdit(null); };
  const del=(id)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setItems(items.filter(x=>x.id!==id)); } };
  const shown=items.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return (
    <div>
      <div className="row" style={{margin:'10px 14px'}}><span className="grow muted" style={{fontSize:13}}>Những cột mốc của hai đứa 💞</span>
        <button className="btn sm" onClick={()=>{setEdit(null);setOpen(true);}}>＋ Thêm mốc</button></div>
      {shown.length===0 && <div className="empty"><span className="big">🕰️</span>Lần đầu gặp, ngày yêu, chuyến đi đầu tiên, ngày cưới… ghi lại hành trình nhé!</div>}
      {shown.length>0 && (
        <div style={{margin:'6px 22px 10px',borderLeft:'2px solid var(--line)',paddingLeft:18}}>
          {shown.map(it=>(
            <div key={it.id} style={{position:'relative',paddingBottom:14}}>
              <div style={{position:'absolute',left:-28,top:0,width:20,height:20,borderRadius:'50%',background:'var(--primary)',display:'grid',placeItems:'center',fontSize:11,boxShadow:'0 0 0 3px var(--bg)'}}>{it.icon||'💗'}</div>
              <div className="card" style={{margin:0,padding:'10px 12px'}}>
                <div className="row"><b style={{fontSize:14.5,flex:1}}>{it.title}</b>
                  <button className="iconbtn" onClick={()=>{setEdit(it);setOpen(true);}}>✏️</button>
                  <button className="iconbtn" onClick={()=>del(it.id)}>🗑️</button></div>
                <div className="muted" style={{fontSize:12,marginTop:2}}>{fmtDateVN(it.date)}</div>
                {it.photo && <PhotoImg photo={it.photo} style={{width:'100%',maxHeight:220,objectFit:'cover',borderRadius:10,marginTop:8,display:'block'}}/>}
                {it.note && <div className="it-note">{it.note}</div>}
              </div>
            </div>
          ))}
        </div>
      )}
      {open && <TimelineForm init={edit} onClose={()=>{setOpen(false);setEdit(null);}} onSave={save}/>}
    </div>
  );
}
function TimelineForm({init,onClose,onSave}){
  const ICONS=['💗','💑','💍','🏠','✈️','🎁','🌹','🎓','👶','🐾','🎉','📸'];
  const [f,setF]=useState(()=>init?{...init}:{title:'',date:'',note:'',icon:'💗',photo:null});
  const [busy,setBusy]=useState(false);
  const fileRef=useRef(null);
  const onFile=async(e)=>{
    const file=e.target.files[0]; if(!file)return; e.target.value='';
    setBusy(true);
    try{
      if(Cloud.connected()){ const path=await Cloud.uploadPhoto(file); setF(p=>({...p,photo:{path}})); setBusy(false); }
      else { const r=new FileReader(); r.onload=()=>{ setF(p=>({...p,photo:{src:r.result}})); setBusy(false); }; r.readAsDataURL(file); }
    }catch(err){ setBusy(false); }
  };
  return (
    <Sheet title={(init?'Sửa ':'Thêm ')+'cột mốc'} onClose={onClose}>
      <div className="field"><label>Cột mốc</label>
        <input className="inp" autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="VD: Lần đầu gặp nhau"/></div>
      <div className="field"><label>Ngày</label>
        <input className="inp" type="date" value={f.date||''} onChange={e=>setF({...f,date:e.target.value})}/></div>
      <div className="field"><label>Biểu tượng</label>
        <div className="emoji-row">{ICONS.map(i=><button key={i} className={f.icon===i?'on':''} onClick={()=>setF({...f,icon:i})}>{i}</button>)}</div></div>
      <div className="field"><label>Ảnh kỷ niệm (tuỳ chọn)</label>
        {f.photo
          ? <div style={{position:'relative'}}>
              <PhotoImg photo={f.photo} style={{width:'100%',height:150,objectFit:'cover',borderRadius:12,display:'block'}}/>
              <button className="pill" style={{position:'absolute',top:6,right:6}} onClick={()=>setF(p=>({...p,photo:null}))}>✕ Bỏ ảnh</button>
            </div>
          : <button className="btn soft" onClick={()=>fileRef.current.click()}>{busy?'Đang tải…':'📷 Thêm ảnh'}</button>}
        <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile}/></div>
      <div className="field"><label>Kỷ niệm / ghi chú</label>
        <textarea className="inp" value={f.note||''} onChange={e=>setF({...f,note:e.target.value})} placeholder="Hôm đó thế nào…"/></div>
      <button className="btn" onClick={()=>{ if(f.title.trim()&&f.date) onSave(f); }}>💾 Lưu</button>
    </Sheet>
  );
}

/* ============ Chia việc nhà ============ */
function Chores({people,me}){
  const [items,setItems]=useLocal('ju.chores',[]);
  const [t,setT]=useState('');
  const [who,setWho]=useState('both');
  const add=()=>{ if(!t.trim())return; setItems([{id:uid(),title:t.trim(),who,done:false,by:me,createdAt:Date.now()},...items]); setT(''); };
  const toggle=(id)=>setItems(items.map(x=>x.id===id?{...x,done:!x.done}:x));
  const del=(id)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setItems(items.filter(x=>x.id!==id)); } };
  const resetAll=()=>setItems(items.map(x=>({...x,done:false})));
  const whoLabel=(w)=> w==='a'?people.a.name : w==='b'?people.b.name : 'Cả hai';
  const whoAv=(w)=> w==='a'?people.a.avatar : w==='b'?people.b.avatar : '👫';
  return (
    <div>
      <div className="muted center" style={{fontSize:12.5,margin:'10px 14px'}}>🧹 Chia việc nhà cho công bằng — ai làm việc gì.</div>
      <div className="row" style={{margin:'0 14px',gap:6}}>
        <input className="inp grow" placeholder="Thêm việc nhà…" value={t} onChange={e=>setT(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') add(); }}/>
        <select className="inp" style={{width:92,flex:'0 0 auto'}} value={who} onChange={e=>setWho(e.target.value)}>
          <option value="both">Cả hai</option><option value="a">{people.a.name}</option><option value="b">{people.b.name}</option>
        </select>
        <button className="btn sm" onClick={add}>＋</button>
      </div>
      {items.length===0 && <div className="empty"><span className="big">🧹</span>Chưa có việc nào. Thêm việc rồi chia cho công bằng nhé!</div>}
      {items.length>0 && <div className="row" style={{margin:'12px 14px 0'}}><span className="grow muted" style={{fontSize:12}}>{items.filter(x=>!x.done).length} việc chưa xong</span>
        <button className="pill" onClick={resetAll}>↻ Đặt lại tất cả</button></div>}
      <div className="card" style={{padding:'4px 13px'}}>
        {items.map(x=>(
          <div key={x.id} className="row" style={{padding:'9px 0',borderBottom:'1px solid var(--line)'}}>
            <button onClick={()=>toggle(x.id)} style={{fontSize:20}}>{x.done?'✅':'⬜'}</button>
            <span className="grow" style={{textDecoration:x.done?'line-through':'none',opacity:x.done?.55:1}}>{x.title}</span>
            <span className="pill">{whoAv(x.who)} {whoLabel(x.who)}</span>
            <button className="muted" onClick={()=>del(x.id)} style={{marginLeft:6}}>✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ Mục tiêu chung (có các bước) ============ */
function Goals({people,me}){
  const [goals,setGoals]=useLocal('ju.goals',[]);
  const [open,setOpen]=useState(false);
  const save=(g)=>{ setGoals([{...g,id:uid(),by:me,steps:[],createdAt:Date.now()},...goals]); setOpen(false); };
  const del=(id)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setGoals(goals.filter(x=>x.id!==id)); } };
  const addStep=(gid,text)=>setGoals(goals.map(g=>g.id===gid?{...g,steps:[...(g.steps||[]),{id:uid(),text,done:false}]}:g));
  const toggleStep=(gid,sid)=>setGoals(goals.map(g=>{ if(g.id!==gid) return g; const steps=g.steps.map(s=>s.id===sid?{...s,done:!s.done}:s); if(steps.length&&steps.every(s=>s.done)&&!g.steps.every(s=>s.done)) celebrate(['🏆','🎉','💞','✨']); return {...g,steps}; }));
  const delStep=(gid,sid)=>{ if(confirm('Bạn có chắc muốn xoá? Thao tác này không hoàn tác được.')){ setGoals(goals.map(g=>g.id===gid?{...g,steps:g.steps.filter(s=>s.id!==sid)}:g)); } };
  return (
    <div>
      <div className="row" style={{margin:'10px 14px'}}><span className="grow muted" style={{fontSize:13}}>Mục tiêu hai đứa cùng theo đuổi 🎯</span>

      {goals.length===0 && <div className="empty"><span className="big">🏆</span>VD: học tiếng Anh, tập gym cùng nhau, tiết kiệm mua nhà… chia thành các bước nhỏ.</div>}
      {goals.map(g=>{
        const total=(g.steps||[]).length, done=(g.steps||[]).filter(s=>s.done).length;
        const pct=total?Math.round(done/total*100):0;
        return (
          <div key={g.id} className="item">
            <div className="it-top"><h4>{g.title}</h4><span className="pill">{pct}%</span></div>
            {g.note && <div className="it-note">{g.note}</div>}
            {total>0 && <div className="prog"><i style={{width:pct+'%'}}></i></div>}
            <div style={{marginTop:8}}>
              {(g.steps||[]).map(s=>(
                <div key={s.id} className="row" style={{padding:'3px 0'}}>
                  <button onClick={()=>toggleStep(g.id,s.id)} style={{fontSize:17}}>{s.done?'✅':'⬜'}</button>
                  <span className={'grow'+(s.done?' dim':'')} style={{fontSize:14,textDecoration:s.done?'line-through':'none'}}>{s.text}</span>
                  <button className="muted" onClick={()=>delStep(g.id,s.id)}>✕</button>
                </div>
              ))}
              <TodoAdd onAdd={(t)=>addStep(g.id,t)}/>
            </div>
            <div className="it-meta"><span className="av-sm">{people[g.by]?.avatar}</span><span className="grow"></span>
              <button className="iconbtn" onClick={()=>del(g.id)}>🗑️</button></div>
          </div>
        );
      })}
      {open && <BigGoalForm onClose={()=>setOpen(false)} onSave={save}/>}
    </div>
  );
}

function periodNext(){
  const p=store.get('ju.period',null); if(!p) return null;
  const cycle=p.cycle||28, length=p.length||5;
  const start=(p.history&&p.history.length)?p.history.slice().sort().slice(-1)[0]:p.start;
  if(!start) return null;
  const s=new Date(start+'T00:00:00'), today=new Date(todayISO()+'T00:00:00');
  let next=new Date(s); while(next<today){ next.setDate(next.getDate()+cycle); }
  const days=Math.round((next-today)/86400000);
  const sinceLast=Math.round((today-s)/86400000);
  return {date:next.getFullYear()+'-'+pad(next.getMonth()+1)+'-'+pad(next.getDate()),days,onPeriod:sinceLast>=0&&sinceLast<length,dayOfPeriod:sinceLast+1,length,start};
}
function PeriodTracker({people}){
  const [pRaw,setP]=useLocal('ju.period',{cycle:28,length:5,history:[],prep:[],note:''});
  const p=pRaw||{cycle:28,length:5,history:[],prep:[],note:''};
  const [showSet,setShowSet]=useState(false);
  const [showHist,setShowHist]=useState(false);
  const info=periodNext();
  const hist=(p.history||[]).slice().sort();
  const gaps=[]; for(let i=1;i<hist.length;i++){ gaps.push(Math.round((new Date(hist[i]+'T00:00:00')-new Date(hist[i-1]+'T00:00:00'))/86400000)); }
  const avg=gaps.length? Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null;
  const fertile=(()=>{ if(!info||info.onPeriod) return null; const ov=new Date(info.date+'T00:00:00'); ov.setDate(ov.getDate()-14);
    const a=new Date(ov); a.setDate(a.getDate()-3); const b=new Date(ov); b.setDate(b.getDate()+1);
    const f=x=>x.getDate()+'/'+(x.getMonth()+1); return {a:f(a),b:f(b),ov:f(ov)}; })();
  const [pickDate,setPickDate]=useState(todayISO());
  const logOn=(iso)=>{ if(!iso) return; const h=(p.history||[]).slice(); if(h.indexOf(iso)<0) h.push(iso); h.sort(); setP({...p,history:h,start:h[h.length-1]}); celebrate(['🌸']); };
  const logToday=()=>logOn(todayISO());
  const undoLast=()=>{ const h=hist.slice(0,-1); setP({...p,history:h,start:h[h.length-1]}); };
  const togglePrep=(item)=>{ const pr=(p.prep||[]); setP({...p,prep: pr.indexOf(item)>=0? pr.filter(x=>x!==item):[...pr,item]}); };
  const name=(people&&people.b&&people.b.name)||'vợ';
  return (
    <div>
      <div className="card" style={{background:'linear-gradient(135deg,var(--chip),var(--card))'}}>
        <div className="row"><b>🌸 Chu kỳ của {name}</b><span className="grow"></span>
          <button className="muted" style={{fontSize:11.5}} onClick={()=>setShowSet(v=>!v)}>⚙️ chu kỳ {p.cycle||28}n</button></div>
        {!info ? <div className="muted" style={{fontSize:12.5,margin:'8px 0'}}>Chưa có dữ liệu. Bấm “Bắt đầu kỳ hôm nay” vào ngày đầu của kỳ để theo dõi.</div>
          : info.onPeriod
            ? <div style={{margin:'8px 0',fontSize:14}}>🌸 <b>Đang trong kỳ</b> — ngày thứ {info.dayOfPeriod}/{info.length}. Nhớ giữ ấm & nghỉ ngơi nhé 💗</div>
            : <div style={{margin:'8px 0',fontSize:14}}>Kỳ tiếp theo: <b>{fmtDateVN(info.date)}</b> · còn <b>{info.days} ngày</b>{info.days<=3?<span className="pill" style={{marginLeft:6,background:'var(--primary)',color:'#fff'}}>Sắp đến!</span>:null}</div>}
        {fertile && <div className="muted" style={{fontSize:12,margin:'2px 0 8px'}}>🌱 Ngày dễ thụ thai (ước tính): <b>{fertile.a}–{fertile.b}</b> · rụng trứng ~{fertile.ov}</div>}
        <button className="btn" onClick={logToday}>🌸 Bắt đầu kỳ hôm nay</button>
        <div className="row" style={{gap:6,marginTop:8,alignItems:'center'}}>
          <span className="muted" style={{fontSize:11.5,flex:'0 0 auto'}}>Hoặc chọn ngày:</span>
          <input className="inp grow" type="date" max={todayISO()} value={pickDate} onChange={e=>setPickDate(e.target.value)} style={{padding:'6px 9px',fontSize:13}}/>
          <button className="btn sm soft" style={{flex:'0 0 auto'}} onClick={()=>logOn(pickDate)}>＋ Ghi</button>
        </div>
        {showSet && <div className="row" style={{gap:8,marginTop:8}}>
          <div className="field grow" style={{margin:0}}><label>Chu kỳ (ngày)</label><input className="inp" type="number" value={p.cycle||28} onChange={e=>setP({...p,cycle:Number(e.target.value)||28})}/></div>
          <div className="field grow" style={{margin:0}}><label>Số ngày hành kinh</label><input className="inp" type="number" value={p.length||5} onChange={e=>setP({...p,length:Number(e.target.value)||5})}/></div>
        </div>}
        {(avg||hist.length>0) && <div className="row" style={{marginTop:8}}>
          {avg && <span className="muted" style={{fontSize:11.5}}>📊 Chu kỳ TB: <b>{avg} ngày</b> · {hist.length} kỳ đã ghi</span>}
          <span className="grow"></span>
          {hist.length>0 && <button className="muted" style={{fontSize:11.5}} onClick={()=>setShowHist(v=>!v)}>📜 lịch sử</button>}
        </div>}
        {showHist && hist.length>0 && <div style={{marginTop:6}}>
          {hist.slice().reverse().slice(0,8).map((d,i,arr)=>{ const gap= i<arr.length-1? Math.round((new Date(d+'T00:00:00')-new Date(arr[i+1]+'T00:00:00'))/86400000):null;
            return <div key={d} className="muted" style={{fontSize:12,padding:'3px 0'}}>🌸 {fmtDateVN(d)}{gap?` · cách kỳ trước ${gap} ngày`:''}</div>; })}
          <button className="muted" style={{fontSize:11.5,marginTop:4}} onClick={undoLast}>↩︎ Xoá kỳ gần nhất (nếu ghi nhầm)</button>
        </div>}
      </div>
      <div className="sec-title">🧺 Cần chuẩn bị</div>
      <div className="card"><div>{PERIOD_PREP.map(it=>(
        <button key={it} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5,background:(p.prep||[]).indexOf(it)>=0?'var(--good)':'var(--chip)',color:(p.prep||[]).indexOf(it)>=0?'#fff':'var(--chip-tx)'}}

      ))}</div></div>
      <div className="sec-title">🍲 Nên ăn (ấm bụng, bổ máu)</div>
      <div className="card"><div className="muted" style={{fontSize:13.5,lineHeight:1.7}}>{PERIOD_FOOD.join(' · ')}</div>
        <div className="muted" style={{fontSize:12,marginTop:8}}><b>Hạn chế:</b> {PERIOD_AVOID.join(', ')}.</div>
        <div className="muted" style={{fontSize:12,marginTop:6}}>👉 Vào <b>Thực đơn</b> chọn mục tiêu <b>🌸 Bổ máu (đèn đỏ)</b> để tạo thực đơn hợp ngày này.</div>
      </div>
      <div className="muted center" style={{fontSize:11,margin:'8px 14px'}}>Chỉ là ước tính theo chu kỳ — không thay thế tư vấn y tế.</div>
    </div>
  );
}

   text:'KINH VU LAN — BÁO HIẾU (phần tinh yếu)\n\nNgài Đại Mục Kiền Liên tu chứng thần thông, thấy mẹ đọa làm ngạ quỷ đói khổ. Ngài dâng cơm nhưng cơm hóa thành than lửa. Đức Phật dạy: một mình con không cứu được; phải nhờ uy lực chư Tăng mười phương.\n\nNgày Rằm tháng Bảy (lễ Tự Tứ), sắm sửa cúng dường Tam Bảo và chư Tăng, hồi hướng công đức thì cha mẹ nhiều đời được nhẹ nghiệp, siêu thoát.\n\nÝ NGHĨA: nhắc con cháu giữ lòng HIẾU — báo đáp công ơn cha mẹ còn sống và đã khuất. Mùa Vu Lan nhớ về thăm, chăm sóc, làm việc thiện hồi hướng cho cha mẹ.\n\n(Phần tinh yếu — đọc toàn văn ở link bên dưới.)'},

   text:'KINH DƯỢC SƯ — Bản Nguyện Công Đức (phần tinh yếu)\n\nĐức Phật Dược Sư Lưu Ly Quang Như Lai ngự cõi Tịnh Lưu Ly phương Đông; khi còn tu hạnh Bồ Tát đã phát MƯỜI HAI ĐẠI NGUYỆN cứu độ chúng sanh: trị lành bệnh tật, đủ ăn mặc, thân tướng trang nghiêm, thoát khổ nạn, được giải thoát…\n\nTrì niệm danh hiệu và chú Dược Sư giúp tiêu trừ tai ách, thân tâm khỏe mạnh, tăng phước thọ.\n\nDƯỢC SƯ QUÁN ĐẢNH CHÂN NGÔN:\nNam mô bạc già phạt đế, bệ sát xã, lũ lô thích lưu ly, bác lặc bà, hắc ra xà dã. Đát tha yết đa da, a ra hắc đế. Tam miệu tam bột đà da, đát điệt tha. Án! Bệ sát thệ, bệ sát thệ, bệ sát xã tam một yết đế tóa ha.\n\nNiệm: NAM MÔ DƯỢC SƯ LƯU LY QUANG VƯƠNG PHẬT.\n\n(Phần tinh yếu — đọc toàn văn ở link bên dưới.)'},
  {title:'🙇 Sám Hối Hồng Danh',sub:'Sám hối nghiệp chướng, làm mới thân tâm.',q:'Sám hối Hồng danh 88 vị Phật toàn văn',

        <div className="muted center" style={{fontSize:12,margin:'10px 14px'}}>Những bài kinh / chú quan trọng nhất — chạm để đọc & tụng.</div>

function WeeklyMenu({me}){
  const [plan,setPlan]=useLocal('ju.menuPlan',null);
  const [shop,setShop]=useLocal('ju.shop',[]);
  const [prefs,setPrefs]=useLocal('ju.dishPrefs',{});
  const [favs,setFavs]=useLocal('ju.favDishes',[]);
  const [goal,setGoal]=useState((plan&&plan.goal)||'cb');
  const [recipe,setRecipe]=useState(null);
  const [favOpen,setFavOpen]=useState(false);
  const [favN,setFavN]=useState(''); const [favT,setFavT]=useState('man');
  const allDishes=()=>DISHES.concat(favs.map(f=>({n:f.n,t:f.t,g:['cb'],ing:[],r:'(Món bạn tự thêm — chưa có công thức sẵn. Bấm “Xem video” để tham khảo cách làm.)',custom:true})));
  const dishByName=(n)=>allDishes().find(d=>d.n===n);
  const matchG=(d)=> goal==='cb'? true : (d.g||[]).indexOf(goal)>=0;
  const rate=(name,v)=>{ const n={...prefs}; n[name]= n[name]===v?0:v; if(!n[name]) delete n[name]; setPrefs(n); };
  const addFav=()=>{ const nm=favN.trim(); if(!nm) return; if(!favs.find(f=>f.n===nm)) setFavs([{n:nm,t:favT},...favs]); setFavN(''); celebrate(['❤️']); };
  const shuffle=(a)=>a.slice().sort(()=>Math.random()-0.5);
  const mkPool=(t)=>{ const base=allDishes();
    let a=base.filter(d=>d.t===t&&matchG(d)&&prefs[d.n]!==-1);
    if(a.length<(t==='man'?2:1)) a=base.filter(d=>d.t===t&&prefs[d.n]!==-1); // nới mục tiêu nếu thiếu món
    if(!a.length) a=base.filter(d=>d.t===t); // cùng lắm bỏ qua cả "không thích"
    const liked=a.filter(d=>prefs[d.n]===1); return liked.concat(liked).concat(a); }; // ưu tiên món thích
  const gen=()=>{
    const mRef={a:shuffle(mkPool('man'))}, cRef={a:shuffle(mkPool('canh'))};
    const popNot=(ref,ex)=>{ for(let k=ref.a.length-1;k>=0;k--){ if(!ex.has(ref.a[k].n)) return ref.a.splice(k,1)[0]; } return ref.a.pop(); };
    const days=[];
    for(let i=0;i<7;i++){ if(mRef.a.length<2) mRef.a=shuffle(mkPool('man')); if(cRef.a.length<1) cRef.a=shuffle(mkPool('canh'));
      const ex=new Set(); const m1=popNot(mRef,ex); if(m1)ex.add(m1.n); const m2=popNot(mRef,ex); const c=cRef.a.pop();
      days.push({man:[m1&&m1.n,m2&&m2.n].filter(Boolean),canh:c?c.n:''}); }
    setPlan({goal,days}); celebrate(['🍱','😋','✨']);
  };
  const toShop=()=>{ if(!plan) return; const ings=new Set();
    plan.days.forEach(d=>{ (d.man||[]).concat([d.canh]).forEach(n=>{ const dish=dishByName(n); if(dish) (dish.ing||[]).forEach(x=>ings.add(x)); }); });
    const have=new Set(shop.map(s=>s.text)); const add=[...ings].filter(x=>!have.has(x)).map(x=>({id:uid(),text:x,by:me||'a',done:false}));
    setShop([...add,...shop]); celebrate(['🛒']); alert('Đã thêm '+add.length+' nguyên liệu vào mục Đi chợ.'); };
  const goalLabel=(k)=>(MENU_GOALS.find(x=>x.k===k)||{}).label||'';
  const dislikedNames=Object.keys(prefs).filter(k=>prefs[k]===-1);
  return (
    <div>
      <div className="muted center" style={{fontSize:12.5,margin:'10px 14px 4px'}}>🍱 Thực đơn tối cả tuần — mỗi ngày 2 món mặn + 1 canh, đủ chất. Đánh dấu 👍/👎 để lần sau gợi ý hợp khẩu vị hơn.</div>
      <div className="filters">{MENU_GOALS.map(g=><button key={g.k} className={goal===g.k?'on':''} onClick={()=>setGoal(g.k)}>{g.icon} {g.label}</button>)}</div>
      <div className="row" style={{margin:'10px 14px',gap:8}}>
        <button className="btn grow" onClick={gen}>🎲 Tạo thực đơn tuần</button>
        <button className="btn sm soft" onClick={()=>setFavOpen(true)}>❤️ Món</button>
        {plan && <button className="btn sm soft" onClick={toShop}>🛒 Ra chợ</button>}
      </div>
      {!plan && <div className="empty"><span className="big">🍱</span>Bấm “Tạo thực đơn tuần” để có 7 ngày đủ chất, kèm công thức & danh sách mua.</div>}
      {plan && <div className="muted center" style={{fontSize:11.5,marginBottom:4}}>Mục tiêu: {goalLabel(plan.goal)} · chạm món để xem công thức 📖</div>}
      {plan && plan.days.map((d,i)=>(
        <div key={i} className="item">
          <div className="it-top"><h4>{DOW[i]}</h4></div>
          {(d.man||[]).map((n,j)=>(
            <div key={j} className="row" style={{padding:'3px 0'}}>
              <span className="muted" style={{width:42,fontSize:11,flex:'0 0 auto'}}>Mặn {j+1}</span>
              <span className="grow" style={{fontSize:14,cursor:'pointer'}} onClick={()=>setRecipe(dishByName(n))}>🍖 {n} 📖</span>
              <button onClick={()=>rate(n,1)} style={{fontSize:14,opacity:prefs[n]===1?1:.4}}>👍</button>
              <button onClick={()=>rate(n,-1)} style={{fontSize:14,opacity:prefs[n]===-1?1:.4}}>👎</button></div>
          ))}
          <div className="row" style={{padding:'3px 0'}}>
            <span className="muted" style={{width:42,fontSize:11,flex:'0 0 auto'}}>Canh</span>
            <span className="grow" style={{fontSize:14,cursor:'pointer'}} onClick={()=>setRecipe(dishByName(d.canh))}>🥣 {d.canh} 📖</span>
            <button onClick={()=>rate(d.canh,1)} style={{fontSize:14,opacity:prefs[d.canh]===1?1:.4}}>👍</button>
            <button onClick={()=>rate(d.canh,-1)} style={{fontSize:14,opacity:prefs[d.canh]===-1?1:.4}}>👎</button></div>
        </div>
      ))}
      {recipe && <Sheet title={recipe.n} onClose={()=>setRecipe(null)}>
        <div className="row" style={{marginBottom:8}}>
          <span className="muted grow" style={{fontSize:12}}>{recipe.t==='canh'?'🥣 Món canh':'🍖 Món mặn'} · {(recipe.g||[]).map(g=>goalLabel(g)).filter(Boolean).join(', ')}</span>
          <button className="pill" style={{background:prefs[recipe.n]===1?'var(--good)':'var(--chip)',color:prefs[recipe.n]===1?'#fff':'var(--chip-tx)'}} onClick={()=>rate(recipe.n,1)}>👍 Thích</button>
          <button className="pill" style={{background:prefs[recipe.n]===-1?'#b06b6b':'var(--chip)',color:prefs[recipe.n]===-1?'#fff':'var(--chip-tx)'}} onClick={()=>rate(recipe.n,-1)}>👎</button>
        </div>
        {(recipe.ing||[]).length>0 && <><b style={{fontSize:13.5}}>Nguyên liệu (2 người):</b>
          <ul style={{margin:'6px 0 12px',paddingLeft:18,fontSize:13.5,lineHeight:1.6}}>{recipe.ing.map((x,i)=><li key={i}>{x}</li>)}</ul></>}
        <b style={{fontSize:13.5}}>Cách làm:</b>
        <div style={{fontSize:13.5,marginTop:6,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{recipe.r}</div>
        <a className="btn" style={{display:'block',textAlign:'center',marginTop:14,textDecoration:'none'}}
          href={'https://www.youtube.com/results?search_query='+encodeURIComponent('cách làm '+recipe.n)} target="_blank" rel="noreferrer">🎬 Xem video hướng dẫn</a>
        <div className="muted center" style={{fontSize:11,marginTop:6}}>Mở YouTube với nhiều video hướng dẫn món này.</div>
      </Sheet>}
      {favOpen && <Sheet title="❤️ Sở thích món ăn" onClose={()=>setFavOpen(false)}>
        <b style={{fontSize:13.5}}>Thêm món ưa thích của nhà mình</b>
        <div className="muted" style={{fontSize:12,margin:'4px 0 8px'}}>Món bạn thêm sẽ được ưu tiên đưa vào thực đơn tuần.</div>
        <div className="row" style={{gap:6}}>
          <input className="inp grow" placeholder="Tên món (vd: Gà nướng mật ong)" value={favN} onChange={e=>setFavN(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') addFav(); }}/>
          <select className="inp" value={favT} onChange={e=>setFavT(e.target.value)} style={{width:84}}><option value="man">Mặn</option><option value="canh">Canh</option></select>
          <button className="btn sm" onClick={addFav}>＋</button>
        </div>
        {favs.length>0 && <div style={{margin:'10px 0'}}>{favs.map((f,i)=>(
          <span key={i} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5}}>{f.t==='canh'?'🥣':'🍖'} {f.n} <span onClick={()=>{ if(confirm('Bỏ món ưa thích này?')) setFavs(favs.filter(x=>x.n!==f.n)); }} style={{cursor:'pointer',marginLeft:4}}>✕</span></span>
        ))}</div>}
        {dislikedNames.length>0 && <><div className="sec-title" style={{marginLeft:0}}>👎 Món đang ẩn (không gợi ý)</div>
          <div>{dislikedNames.map(n=>(<span key={n} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5,background:'var(--chip)'}}>{n} <span onClick={()=>rate(n,-1)} style={{cursor:'pointer',marginLeft:4}}>↩︎</span></span>))}</div></>}
      </Sheet>}
    </div>
  );
}

const ILL_SYMPTOMS=['Sốt','Ho','Sổ mũi','Tiêu chảy','Nôn trớ','Phát ban','Biếng ăn','Khó ngủ'];
function ChildCare({people,me}){
  const [child,setChild]=useLocal('ju.child',{name:'',dob:'',gender:''});
  const [growth,setGrowth]=useLocal('ju.childGrowth',[]);
  const [vac,setVac]=useLocal('ju.childVaccines',{});
  const [mile,setMile]=useLocal('ju.childMilestones',{});
  const [diary,setDiary]=useLocal('ju.childDiary',[]);
  const [pack,setPack]=useLocal('ju.childPack',{});
  const [skills,setSkills]=useLocal('ju.childSkills',{});
  const [med,setMed]=useLocal('ju.childMed',{allergy:'',meds:'',sleep:'',note:''});
  const [ill,setIll]=useLocal('ju.childIllness',[]);
  const [words,setWords]=useLocal('ju.childWords',[]);
  const [tantrum,setTantrum]=useLocal('ju.childTantrum',[]);
  const [pq,setPq]=useLocal('ju.childParenting',{});
  const [tab,setTab]=useState('develop');
  const [editChild,setEditChild]=useState(false);
  const [gw,setGw]=useState(''); const [gh,setGh]=useState('');
  const [dtext,setDtext]=useState(''); const [wordIn,setWordIn]=useState('');
  const [illForm,setIllForm]=useState({symptoms:[],meds:'',note:''});
  const [tanForm,setTanForm]=useState({situation:'',handling:''});
  const months=child.dob? Math.max(0, Math.round((new Date(todayISO()+'T00:00:00')-new Date(child.dob+'T00:00:00'))/(30.44*86400000))) : null;
  const ageLabel = months==null?'chưa đặt ngày sinh' : months<24? months+' tháng tuổi' : Math.floor(months/12)+' tuổi'+(months%12?(' '+(months%12)+' th'):'');
  const tg=(obj,set,key)=>{ const n={...obj}; if(n[key]) delete n[key]; else n[key]=true; set(n); };
  const addGrowth=()=>{ const w=parseFloat(gw), h=parseFloat(gh); if(!w&&!h) return; setGrowth([{id:uid(),date:todayISO(),w:w||null,h:h||null},...growth]); setGw('');setGh(''); celebrate(['📏']); };
  const addDiary=()=>{ if(!dtext.trim()) return; setDiary([{id:uid(),date:todayISO(),text:dtext.trim()},...diary]); setDtext(''); celebrate(['📔','💞']); };
  const addWord=()=>{ const w=wordIn.trim(); if(!w) return; if(!words.find(x=>x.word.toLowerCase()===w.toLowerCase())) setWords([{id:uid(),word:w,date:todayISO()},...words]); setWordIn(''); celebrate(['🗣️']); };
  const toggleSym=(s)=> setIllForm(f=>({...f,symptoms:f.symptoms.indexOf(s)>=0?f.symptoms.filter(x=>x!==s):[...f.symptoms,s]}));
  const addIll=()=>{ if(!illForm.symptoms.length&&!illForm.note.trim()) return; setIll([{id:uid(),date:todayISO(),symptoms:illForm.symptoms,meds:illForm.meds.trim(),note:illForm.note.trim(),recovered:''},...ill]); setIllForm({symptoms:[],meds:'',note:''}); celebrate(['💊']); };
  const recover=(id)=> setIll(ill.map(x=>x.id===id?{...x,recovered:x.recovered?'':todayISO()}:x));
  const addTantrum=()=>{ if(!tanForm.situation.trim()) return; setTantrum([{id:uid(),date:todayISO(),situation:tanForm.situation.trim(),handling:tanForm.handling.trim(),worked:null},...tantrum]); setTanForm({situation:'',handling:''}); };
  const setTanWorked=(id,v)=> setTantrum(tantrum.map(x=>x.id===id?{...x,worked:x.worked===v?null:v}:x));
  const schoolDays=child.schoolDate? daysFromToday(child.schoolDate) : null;
  const packDone=CHILD_PACK.filter(it=>pack[it]).length;
  const skillDone=CHILD_SKILLS.filter(it=>skills[it]).length;
  const wordsThisWeek=words.filter(w=>{ const d=Math.round((new Date(todayISO()+'T00:00:00')-new Date(w.date+'T00:00:00'))/86400000); return d>=0&&d<7; }).length;
  const exportMed=()=>{ const lines=['HỒ SƠ Y TẾ — '+(child.name||'Bé'),
    'Ngày sinh: '+(child.dob?fmtDateVN(child.dob):'—')+(months!=null?(' ('+ageLabel+')'):''),
    'Giới tính: '+(child.gender==='nam'?'Bé trai':child.gender==='nu'?'Bé gái':'—'),'',
    'Dị ứng: '+(med.allergy||'Không rõ'),'Thuốc đang dùng: '+(med.meds||'Không'),
    'Thói quen ngủ: '+(med.sleep||'—'),'Ghi chú cho cô: '+(med.note||'—'),'',
    'Liên hệ bố/mẹ: '+[people.a.name,people.b.name].filter(Boolean).join(' / ')];
    const txt=lines.join('\n');
    try{ const w=window.open('','_blank'); if(w){ w.document.write('<title>Hồ sơ y tế</title><pre style="font-family:system-ui,sans-serif;font-size:15px;white-space:pre-wrap;padding:24px;line-height:1.8">'+txt.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>'); w.document.close(); w.focus(); setTimeout(()=>{ try{w.print();}catch(e){} },350); return; } }catch(e){}
    if(navigator.share) navigator.share({title:'Hồ sơ y tế',text:txt}).catch(()=>{}); else { navigator.clipboard.writeText(txt); alert('Đã copy hồ sơ — dán để gửi cô nhé!'); } };
  const last=growth[0];
  return (
    <div>
      <div className="card" style={{background:'linear-gradient(135deg,var(--chip),var(--card))'}}>
        <div className="row"><span style={{fontSize:24}}>👶</span>
          <div className="grow"><b style={{fontSize:15}}>{child.name||'Bé yêu'}</b>
            <div className="muted" style={{fontSize:12}}>{ageLabel}{child.gender?(' · '+(child.gender==='nam'?'bé trai':'bé gái')):''}</div></div>
          {(child.name&&child.dob&&!editChild) && <button className="muted" style={{fontSize:12}} onClick={()=>setEditChild(true)}>✎ Sửa</button>}
        </div>
        {(!child.name||!child.dob||editChild) && <>
          <div className="row" style={{gap:8,marginTop:8}}>
            <input className="inp grow" placeholder="Tên bé" value={child.name||''} onChange={e=>setChild({...child,name:e.target.value})} style={{padding:'7px 10px',fontSize:13}}/>
            <select className="inp" value={child.gender||''} onChange={e=>setChild({...child,gender:e.target.value})} style={{width:90,padding:'7px',fontSize:13}}>
              <option value="">—</option><option value="nam">Trai</option><option value="nu">Gái</option></select>
          </div>
          <div className="field" style={{margin:'8px 0 0'}}><label>Ngày sinh</label>
            <input className="inp" type="date" max={todayISO()} value={child.dob||''} onChange={e=>setChild({...child,dob:e.target.value})}/></div>
          {editChild && child.name && child.dob && <button className="btn sm" style={{marginTop:8}} onClick={()=>setEditChild(false)}>✓ Xong</button>}
        </>}
      </div>
      <div className="filters">
        <button className={tab==='develop'?'on':''} onClick={()=>setTab('develop')}>🌱 Phát triển</button>
        <button className={tab==='health'?'on':''} onClick={()=>setTab('health')}>🏥 Sức khoẻ</button>
        <button className={tab==='eat'?'on':''} onClick={()=>setTab('eat')}>🍎 Ăn uống</button>
        <button className={tab==='school'?'on':''} onClick={()=>setTab('school')}>🎒 Đi học</button>
        <button className={tab==='parent'?'on':''} onClick={()=>setTab('parent')}>💞 Nuôi dạy</button>
      </div>

      {tab==='develop' && <div>
        <div className="sec-title">🎯 Mốc phát triển</div>
        <div className="muted center" style={{fontSize:11.5,margin:'0 14px 4px'}}>Chỉ hiện mốc đúng độ tuổi của bé — tích mốc bé đã làm được.</div>
        {months==null
          ? <div className="empty muted">Nhập ngày sinh bé ở trên để hiện mốc đúng tuổi.</div>
          : (()=>{ const b=CHILD_MILESTONES.find(x=>months>=x.lo&&months<x.hi)||CHILD_MILESTONES[CHILD_MILESTONES.length-1];
              return <div className="item" style={{borderLeft:'4px solid var(--primary)'}}>
                <div className="it-top"><h4>⭐ {b.band} <span className="muted" style={{fontSize:11,fontWeight:400}}>(bé {months} tháng)</span></h4></div>
                <div>{b.items.map(it=>{ const k=b.band+'|'+it; const on=!!mile[k];
                  return <button key={it} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5,background:on?'var(--good)':'var(--chip)',color:on?'#fff':'var(--chip-tx)'}} onClick={()=>tg(mile,setMile,k)}>{on?'✓ ':''}{it}</button>; })}</div>
              </div>; })()}
        <div className="sec-title">🗣️ Mốc ngôn ngữ <span className="grow"></span><span className="muted" style={{fontSize:12}}>{words.length} từ · +{wordsThisWeek} tuần này</span></div>
        <div className="card">
          <div className="row" style={{gap:6}}>
            <input className="inp grow" placeholder="Thêm từ bé mới nói được…" value={wordIn} onChange={e=>setWordIn(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') addWord(); }}/>
            <button className="btn sm" onClick={addWord}>＋</button>
          </div>
          {words.length===0 && <div className="muted" style={{fontSize:12.5,marginTop:8}}>Ghi lại mỗi từ mới — vài tháng nhìn lại sẽ rất đáng yêu 💕</div>}
          {words.length>0 && <div style={{marginTop:8}}>{words.slice(0,40).map(w=>(
            <span key={w.id} className="pill" style={{margin:'3px 6px 3px 0',padding:'6px 10px',fontSize:12.5}}>{w.word} <span onClick={()=>{ if(confirm('Xoá từ này?')) setWords(words.filter(x=>x.id!==w.id)); }} style={{cursor:'pointer',marginLeft:3,opacity:.6}}>✕</span></span>
          ))}</div>}
        </div>
        <div className="sec-title">🎲 Trò chơi gợi ý (20–24 tháng)</div>
        {PLAY_LIB.map((p,i)=>(
          <div key={i} className="item" style={{padding:'9px 13px'}}>
            <div className="row"><b style={{fontSize:13.5}} className="grow">{p.c.split(' ')[0]} {p.n}</b><span className="muted" style={{fontSize:11}}>{p.c.split(' ').slice(1).join(' ')}</span></div>
            <div className="muted" style={{fontSize:12.5,marginTop:3,lineHeight:1.5}}>{p.d}</div>
          </div>
        ))}
      </div>}

      {tab==='health' && <div>
        <div className="sec-title">💉 Lịch tiêm chủng</div>
        <div className="muted center" style={{fontSize:11.5,margin:'0 14px 4px'}}>Tham khảo (TCMR + dịch vụ) — tích mũi đã tiêm.</div>
        {CHILD_VACCINES.map(v=>{ const due=months!=null&&vacAgeMonths(v.age)<=months; const allDone=v.items.every(it=>vac[v.age+'|'+it]);
          return <div key={v.age} className="item" style={due&&!allDone?{borderLeft:'4px solid var(--primary)'}:null}>
            <div className="it-top"><h4>{v.age}{due&&!allDone?' · đến hạn':''}{allDone?' ✅':''}</h4></div>
            <div>{v.items.map(it=>{ const k=v.age+'|'+it; const on=!!vac[k];
              return <button key={it} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5,background:on?'var(--good)':'var(--chip)',color:on?'#fff':'var(--chip-tx)'}} onClick={()=>tg(vac,setVac,k)}>{on?'✓ ':''}{it}</button>; })}</div>
          </div>; })}
        <div className="sec-title">📏 Chiều cao & cân nặng</div>
        <div className="card">
          <div className="row" style={{gap:8}}>
            <div className="field grow" style={{margin:0}}><label>Cân nặng (kg)</label><input className="inp" type="number" value={gw} onChange={e=>setGw(e.target.value)} placeholder="vd 11.5"/></div>
            <div className="field grow" style={{margin:0}}><label>Chiều cao (cm)</label><input className="inp" type="number" value={gh} onChange={e=>setGh(e.target.value)} placeholder="vd 82"/></div>
          </div>
          <button className="btn" style={{marginTop:8}} onClick={addGrowth}>📏 Ghi hôm nay</button>
          {last && <div className="muted" style={{fontSize:12,marginTop:8}}>Gần nhất ({fmtDateVN(last.date)}): {last.w?last.w+'kg':''}{last.w&&last.h?' · ':''}{last.h?last.h+'cm':''}</div>}
        </div>
        {months!=null && months>=18 && months<=24 && <div className="muted center" style={{fontSize:11.5,margin:'2px 14px 8px'}}>Tham khảo ~20 tháng (WHO): bé trai ~10.5–12.5kg / 81–86cm; bé gái ~10–12kg / 80–85cm.</div>}
        {growth.map(e=>(
          <div key={e.id} className="row" style={{padding:'6px 14px',borderBottom:'1px solid var(--line)',fontSize:13}}>
            <span className="muted grow">{fmtDateVN(e.date)}</span>
            <span>{e.w?'⚖️ '+e.w+'kg':''}{e.w&&e.h?'  ':''}{e.h?'📐 '+e.h+'cm':''}</span>
            <button className="iconbtn" onClick={()=>{ if(confirm('Xoá lần đo này?')) setGrowth(growth.filter(x=>x.id!==e.id)); }}>🗑️</button>

function icsDownload(title,dateISO,note){
  if(!dateISO) return;
  const dt=dateISO.replace(/-/g,'');
  const esc=(s)=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JustUs//VI','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+dt+Math.random().toString(36).slice(2)+'@justus','DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+esc(title),
    note?'DESCRIPTION:'+esc(note):'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(title||'su-kien').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics'; a.click();
}
function MiniCalendar(){
  const setup=store.get('ju.setup',{})||{};
  const [events]=useLocal('ju.events',[]);
  const [dates]=useLocal('ju.dates',[]);
  const now=new Date();
  const [ym,setYm]=useState({y:now.getFullYear(),m:now.getMonth()});
  const [sel,setSel]=useState(null);
  const marks={}; const addMark=(day,t,kind)=>{ (marks[day]=marks[day]||[]).push({t,kind}); };
  events.forEach(e=>{ if(!e.date)return; const [y,m,d]=e.date.split('-').map(Number); if(y===ym.y&&m-1===ym.m) addMark(d,e.title,'📅'); });
  dates.forEach(e=>{
    if(e.lunar&&e.lunarDay&&e.lunarMonth){ const r=lunar2Solar(e.lunarDay,e.lunarMonth,ym.y,0,7); if(r&&r[2]&&r[1]-1===ym.m) addMark(r[0],e.title,e.icon||'🕯️'); return; }
    if(!e.date)return; const p=e.date.split('-').map(Number); if(p[1]-1===ym.m) addMark(p[2],e.title,e.icon||'🎂'); });
  [['loveDate','Kỷ niệm ngày yêu'],['weddingDate','Kỷ niệm ngày cưới']].forEach(([k,label])=>{ if(setup[k]){ const p=setup[k].split('-').map(Number); if(p[1]-1===ym.m) addMark(p[2],label,'💞'); } });
  holidaysForYear(ym.y).forEach(h=>{ const p=h.date.split('-').map(Number); if(p[1]-1===ym.m) addMark(p[2],h.name,h.icon); });
  const startDow=(new Date(ym.y,ym.m,1).getDay()+6)%7;
  const daysIn=new Date(ym.y,ym.m+1,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(d);
  const isToday=(d)=> ym.y===now.getFullYear()&&ym.m===now.getMonth()&&d===now.getDate();
  const moveM=(x)=>{ let m=ym.m+x,y=ym.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setYm({y,m}); setSel(null); };
  const MN=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  return (
    <div className="card">
      <div className="row"><button className="iconbtn" onClick={()=>moveM(-1)}>‹</button>
        <b className="grow" style={{textAlign:'center'}}>{MN[ym.m]} {ym.y}</b>
        <button className="iconbtn" onClick={()=>moveM(1)}>›</button></div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginTop:8,textAlign:'center'}}>
        {['T2','T3','T4','T5','T6','T7','CN'].map(w=><div key={w} className="muted" style={{fontSize:10,fontWeight:700}}>{w}</div>)}
        {cells.map((d,i)=>(
          <div key={i} onClick={()=>d&&setSel(sel===d?null:d)} style={{aspectRatio:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
            borderRadius:8,cursor:d?'pointer':'default',
            background:d&&isToday(d)?'var(--primary)':(sel===d?'var(--chip)':'transparent'),
            color:d&&isToday(d)?'var(--on-primary)':'var(--text)',fontSize:12.5}}>
            {d||''}
            {d&&marks[d] && <div style={{display:'flex',gap:1,marginTop:1}}>{marks[d].slice(0,3).map((x,j)=><span key={j} style={{width:4,height:4,borderRadius:'50%',background:isToday(d)?'#fff':'var(--primary)'}}></span>)}</div>}
          </div>
        ))}
      </div>
      {sel && (marks[sel]
        ? <div style={{marginTop:8}}>{marks[sel].map((x,i)=><div key={i} className="row" style={{fontSize:13,padding:'3px 0'}}><span>{x.kind}</span><span className="grow" style={{marginLeft:6}}>{x.t}</span></div>)}</div>
        : <div className="muted center" style={{fontSize:12,marginTop:8}}>Ngày {sel} chưa có gì.</div>)}
    </div>
  );
}

function ageOf(d){ if(!d) return null; const today=new Date(todayISO()+'T00:00:00'); const cy=today.getFullYear();
  const by=d.birthYear?Number(d.birthYear):((!d.lunar&&d.date&&Number(d.date.slice(0,4))<cy)?Number(d.date.slice(0,4)):null);
  if(!by||by<1900||by>cy) return null;
  let nextOccYear;
  if(d.lunar){ const nd=dnextDate(d); if(!nd) return null; nextOccYear=Number(nd.slice(0,4)); }
  else { const bm=Number(d.date.slice(5,7)), bd=Number(d.date.slice(8,10)); const thisYear=new Date(cy,bm-1,bd);
    if(thisYear.getTime()===today.getTime()) return cy-by; nextOccYear = thisYear>today? cy : cy+1; }
  const a=nextOccYear-by-1; return (a>=0&&a<140)?a:null; }
function DatesCalendar({dates}){
  const now=new Date();

  dates.forEach(e=>{
    if(e.lunar&&e.lunarDay&&e.lunarMonth){ const r=lunar2Solar(e.lunarDay,e.lunarMonth,ym.y,0,7); if(r&&r[2]&&r[1]-1===ym.m) put(r[0],e); return; }
    if(!e.date) return; const p=e.date.split('-').map(Number); if(p[1]-1===ym.m) put(p[2],e);
  });

      if(!m) return;

      const dd=String(dnum).padStart(2,'0'), mm=String(mnum).padStart(2,'0');
      let yy=m[3]?parseInt(m[3],10):2026; if(yy<100) yy+=2000;
      let name=line.replace(m[0],'').replace(/[\s,;|–-]*(âm\s*lịch|âm|âl|al)\s*$/i,'')
        .replace(/(ngoại|nội|ngoai|noi)\s*(chồng|vợ|chong|vo)/ig,'')
        .replace(/^[\s,;\-|–]+|[\s,;\-|–]+$/g,'').trim()||(kind==='death'?'Ngày giỗ':'Sinh nhật');
      if(isLunar) parsed.push({title:name,lunar:true,lunarDay:dnum,lunarMonth:mnum,icon:'🕯️',remind:3,kind,side});
      else parsed.push({title:name,date:yy+'-'+mm+'-'+dd,icon:kind==='death'?'🕯️':'🎂',remind:3,kind,side});
    });
    const key=(t,d)=>(t||'').toLowerCase()+'|'+(d.lunar?('L'+d.lunarDay+'/'+d.lunarMonth):((d.date||'').slice(5)));
    const seen=new Set(dates.map(x=>key(x.title,x)));
    const fresh=parsed.filter(a=>{ const k=key(a.title,a); if(seen.has(k)) return false; seen.add(k); return true; });
    setDates([...fresh.map(a=>({...a,id:uid(),by:me,createdAt:Date.now()})),...dates]);
