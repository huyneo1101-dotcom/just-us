<style>
:root{
  --bg:#fff0f4; --bg2:#ffe3ec; --card:#ffffff; --text:#3a2b31; --muted:#9b8088;
  --line:#f3d3dd; --primary:#e85d8a; --primary2:#ff8fb1; --on-primary:#fff;
  --accent:#b65cff; --chip:#ffe0ea; --chip-tx:#b23a63; --good:#2bb673; --warn:#e8a13a;
  --heart:#ff4d76; --shadow:0 10px 30px rgba(232,93,138,.16); --radius:18px;
}
/* ===== Themes ===== */
body.theme-rose{ }
body.theme-peach{
  --bg:#fff4ec; --bg2:#ffe7d6; --card:#fff; --text:#4a3326; --muted:#a98a76;
  --line:#f6d9c4; --primary:#f0803c; --primary2:#ffb27a; --accent:#e85d5d;
  --chip:#ffe3cf; --chip-tx:#b85b22; --heart:#ff6a4d;
}
body.theme-lavender{
  --bg:#f4f0ff; --bg2:#e9e1ff; --card:#fff; --text:#352a4a; --muted:#8d7fae;
  --line:#e2d7f7; --primary:#8b5cf6; --primary2:#b794ff; --accent:#e85d8a;
  --chip:#ebe1ff; --chip-tx:#6d3fc0; --heart:#c44dff;
}
body.theme-ocean{
  --bg:#eef9fb; --bg2:#d9f0f5; --card:#fff; --text:#1f3a42; --muted:#6f97a1;
  --line:#cdeaef; --primary:#119cb0; --primary2:#5fd0dd; --accent:#1f6feb;
  --chip:#d4f1f5; --chip-tx:#0a7080; --heart:#ff5a8a;
}
body.theme-forest{
  --bg:#eef7ef; --bg2:#dcefe0; --card:#fff; --text:#26392b; --muted:#74917a;
  --line:#cfe9d3; --primary:#2f9e57; --primary2:#74d28d; --accent:#d98a2b;
  --chip:#d7f0db; --chip-tx:#1f7a42; --heart:#ff5a7a;
}
body.theme-night{
  --bg:#171221; --bg2:#221a30; --card:#241b33; --text:#f3e9f5; --muted:#a892b8;
  --line:#3a2c4d; --primary:#ff6f9d; --primary2:#c277ff; --accent:#7aa2ff;
  --chip:#3a2740; --chip-tx:#ffb3cd; --heart:#ff6f9d; --on-primary:#1a1024;
  --shadow:0 12px 34px rgba(0,0,0,.45);
}
body.theme-cherry{
  --bg:#fff1f0; --bg2:#ffe0dd; --card:#fff; --text:#43282a; --muted:#b08a8a;
  --line:#f6d3cf; --primary:#e03131; --primary2:#ff7a7a; --accent:#d6336c;
  --chip:#ffe0dd; --chip-tx:#c92a2a; --heart:#ff3b5c;
}
body.theme-sky{
  --bg:#eef5ff; --bg2:#dbe9ff; --card:#fff; --text:#23344a; --muted:#7d93ad;
  --line:#d3e2f7; --primary:#3b82f6; --primary2:#7cb0ff; --accent:#7048e8;
  --chip:#dbe9ff; --chip-tx:#1c5bd6; --heart:#ff5a8a;
}
body.theme-mocha{
  --bg:#f6efe9; --bg2:#ece0d4; --card:#fffaf6; --text:#3e2f25; --muted:#a08a78;
  --line:#e6d6c7; --primary:#b07a4f; --primary2:#d6a878; --accent:#c0392b;
  --chip:#ecdccd; --chip-tx:#8a5a36; --heart:#e0607a;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text); min-height:100vh; transition:background .3s,color .3s;
}
#root{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.app{padding:0 0 86px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--primary)}

/* Header */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4));
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
body.theme-night .topbar{background:linear-gradient(180deg,rgba(36,27,51,.9),rgba(36,27,51,.5))}
.brand{font-weight:800;font-size:18px;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.brand .heart{color:var(--heart)}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--chip);
  color:var(--chip-tx);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700}
.who .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:14px}

/* Cards & generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin:12px 14px}
.sec-title{font-weight:800;font-size:15px;margin:18px 16px 6px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--chip-tx);
  border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--on-primary);
  border-radius:12px;padding:11px 14px;font-weight:800;font-size:14.5px;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow);width:100%}
.btn.sm{padding:8px 12px;font-size:13px;width:auto}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.btn.soft{background:var(--chip);color:var(--chip-tx);box-shadow:none}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--chip-tx);font-size:15px}

/* Inputs */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;color:var(--text)}
textarea.inp{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px;background:var(--chip);border-radius:14px;padding:5px;margin:12px 14px;overflow:auto}
.seg button{flex:0 0 auto;padding:8px 13px;border-radius:10px;font-weight:700;font-size:13px;color:var(--chip-tx);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--primary);box-shadow:0 3px 10px rgba(0,0,0,.08)}

/* Filter chips */
.filters{display:flex;gap:7px;margin:10px 14px 0;flex-wrap:wrap}
.filters button{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--card);
  border:1.5px solid var(--line);color:var(--muted)}
.filters button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* List item card */
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin:10px 14px;box-shadow:var(--shadow)}
.item .it-top{display:flex;align-items:flex-start;gap:8px}
.item h4{margin:0;font-size:15.5px;font-weight:800;flex:1;line-height:1.3}
.item.dn h4{text-decoration:line-through;opacity:.6}
.it-note{font-size:13.5px;color:var(--text);opacity:.92;margin:6px 0 0;white-space:pre-wrap}
.it-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.av-sm{width:20px;height:20px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12px}
.heartbtn{font-size:18px;line-height:1}
.heartbtn.on{color:var(--heart)}
.stars{font-size:14px;letter-spacing:1px;color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:30px 20px;font-size:14px}
.empty .big{font-size:38px;display:block;margin-bottom:8px}

/* Home */
.hero{margin:14px;border-radius:24px;overflow:hidden;position:relative;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;padding:20px 18px;box-shadow:var(--shadow)}
.hero .names{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .count{font-size:40px;font-weight:900;margin-top:10px;line-height:1}
.hero .sub{opacity:.92;font-size:13.5px;margin-top:4px}
.hero .cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28}
.hero .inner{position:relative;z-index:1}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:900;color:var(--primary)}
.stat .l{font-size:12.5px;color:var(--muted);font-weight:600}
.mood-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mood-pick button{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line)}
.mood-pick button.on{border-color:var(--primary);background:var(--chip)}

/* Progress */
.prog{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:8px}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}

/* Photos */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 14px}
.gallery .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--chip)}
.gallery .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;font-size:10px;padding:10px 6px 4px}

/* Map */
#map{height:340px;border-radius:16px;margin:10px 14px;border:1px solid var(--line);overflow:hidden}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;
  background:var(--card);border-top:1px solid var(--line);display:flex;padding:7px 4px 9px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700}
.nav button .ic{font-size:21px;line-height:1}
.nav button.on{color:var(--primary)}

/* Modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px 22px;max-height:88vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:2px 0 14px;font-size:18px}
.sheet .x{position:absolute;right:16px;top:14px;font-size:22px;color:var(--muted)}
.flash{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;background:var(--text);color:var(--card);
  padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap}
.emoji-row button{font-size:22px;width:40px;height:40px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line)}
.emoji-row button.on{border-color:var(--primary);background:var(--chip)}
.dim{opacity:.55}
.center{text-align:center}
.grow{flex:1}
.danger{color:#e0436b}
.linkout{color:var(--primary);font-weight:700;font-size:13px;text-decoration:none;word-break:break-all}
</style>
</head>

<div id="root"></div>

<!-- Chống nháy theme: áp class trước khi React mount -->
<script>
(function(){
  try{
    var raw=localStorage.getItem('ju.setup');
    var t=raw?(JSON.parse(raw).theme||'rose'):'rose';
    document.body.className='theme-'+t;
  }catch(e){document.body.className='theme-rose';}
})();
</script>

<!-- Chẩn đoán: nếu app không chạy, hiện lý do thay vì màn trắng -->
<script>
window.__JU_OK=false;
setTimeout(function(){

      +'</div>';
    }
  }
},4000);
</script>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo} = React;

/* ============ store (fallback in-memory cho file://) ============ */
const mem={};
const store={
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return (k in mem)?mem[k]:d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

/* ============ Cloud: đồng bộ 2 máy qua Supabase (tuỳ chọn) ============ */
const SB_URL='https://vvgkjgvzjeklaadusbne.supabase.co';
const SB_KEY='sb_publishable_DMMPv5L2kGhrHTxeQ72iKw_dIh13iT1';
// Các key được đồng bộ (KHÔNG gồm ju.me/ju.device/ju.sync — đó là riêng từng máy)
const SYNC_KEYS=['ju.setup','ju.wish','ju.bucket','ju.watch','ju.links','ju.ideas','ju.food','ju.spots','ju.events','ju.dates','ju.fund','ju.shop','ju.notes','ju.photos','ju.mood','ju.qa','ju.timeline','ju.coupons','ju.chores','ju.lovejar','ju.quiz','ju.city','ju.goals','ju.checkin','ju.challengeDone'];
let _sb=null;
function sbClient(){
  if(_sb) return _sb;
  if(window.supabase && window.supabase.createClient){
    _sb=window.supabase.createClient(SB_URL,SB_KEY,{ auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
  }
  return _sb;
}
const Cloud={
  ready:false, channel:null, lastHash:'', pushTimer:null, onChange:null,
  coupleId:null, sessionUser:null, _inited:false, _urlCache:{},
  client(){ return sbClient(); },
  device(){ let d=store.get('ju.device',null); if(!d){ d=Math.random().toString(36).slice(2)+Date.now().toString(36); store.set('ju.device',d);} return d; },
  loggedIn(){ return !!this.sessionUser; },
  connected(){ return !!(this.sessionUser && this.coupleId); },
  couple(){ return store.get('ju.couple',null); },
  emailOf(){ return this.sessionUser ? this.sessionUser.email : ''; },

  /* ---------- auth ---------- */
  async init(){
    const c=this.client(); if(!c||this._inited) return; this._inited=true;
    c.auth.onAuthStateChange((_e,session)=>{ this._onSession(session); });
  },
  async _onSession(session){
    const u=session?session.user:null;
    const same=u && this.sessionUser && u.id===this.sessionUser.id;
    this.sessionUser=u;
    if(!u){ this.coupleId=null; this.stop(); store.del('ju.couple'); if(this.onChange)this.onChange(); return; }
    if(same && this.coupleId && this.channel){ if(this.onChange)this.onChange(); return; } // token refresh → bỏ qua
    await this.loadCouple();
  },
  async signUp(email,pw,name){
    const c=this.client();
    const {data,error}=await c.auth.signUp({email,password:pw,options:{data:{name}}});
    if(error) throw error;
    if(!data.session){ try{ const r=await c.auth.signInWithPassword({email,password:pw}); if(r.data&&r.data.session) return r.data; }catch(e){} }
    return data;
  },
  async signIn(email,pw){ const c=this.client(); const {data,error}=await c.auth.signInWithPassword({email,password:pw}); if(error) throw error; return data; },
  async signOut(){ const c=this.client(); try{ await c.auth.signOut(); }catch(e){} this.sessionUser=null; this.coupleId=null; this.stop(); store.del('ju.couple'); if(this.onChange)this.onChange(); },

  /* ---------- couple ---------- */
  async loadCouple(){
    const c=this.client(); if(!c||!this.sessionUser){ this.coupleId=null; return; }
    const {data,error}=await c.rpc('ju_my_couple');
    if(!error && data && data.id){ this.coupleId=data.id; store.set('ju.couple',data); await this.start(); }
    else { this.coupleId=null; this.stop(); store.del('ju.couple'); }
    if(this.onChange)this.onChange();
  },
  async createCouple(name){ const c=this.client(); const {data,error}=await c.rpc('ju_create_couple',{p_name:name||null}); if(error) throw error; await this.loadCouple(); return data; },
  async joinCouple(code,name){ const c=this.client(); const {data,error}=await c.rpc('ju_join_couple',{p_code:code,p_name:name||null}); if(error) throw error; await this.loadCouple(); return data; },
  async leaveCouple(){ const c=this.client(); const {error}=await c.rpc('ju_leave_couple'); if(error) throw error; this.coupleId=null; this.stop(); store.del('ju.couple'); if(this.onChange)this.onChange(); },

  /* ---------- sync ---------- */
  snapshot(){ const s={}; SYNC_KEYS.forEach(k=>{ const v=store.get(k,null); if(v!=null) s[k]=v; }); return s; },
  applyRemote(data){
    if(!data) return;
    SYNC_KEYS.forEach(k=>{ if(k in data) store.set(k,data[k]); });
    this.lastHash=JSON.stringify(this.snapshot());
    window.dispatchEvent(new CustomEvent('ju:remote'));
  },
  schedulePush(){ if(!this.connected()||!this.ready) return; clearTimeout(this.pushTimer); this.pushTimer=setTimeout(()=>this.push(),700); },
  async push(){
    const c=this.client(); if(!this.connected()||!c) return;
    const snap=this.snapshot(), h=JSON.stringify(snap);
    if(h===this.lastHash) return;
    this.lastHash=h;
    try{ await c.from('justus_data').upsert({couple_id:this.coupleId,data:snap,last_writer:this.device(),updated_at:new Date().toISOString()}); this._stamp(); }
    catch(e){}
  },
  async pull(){
    const c=this.client(); if(!this.connected()||!c) return {ok:false};
    const {data,error}=await c.from('justus_data').select('data,last_writer').eq('couple_id',this.coupleId).maybeSingle();
    if(error) return {ok:false,error};
    if(data && data.data && Object.keys(data.data).length){ this.applyRemote(data.data); return {ok:true,found:true}; }
    return {ok:true,found:false};
  },
  async start(){
    if(!this.connected()) return;
    this.ready=false;
    const r=await this.pull();
    if(r.ok && !r.found){ this.lastHash=''; await this.push(); } // couple mới → đẩy dữ liệu máy này lên làm gốc
    this.subscribe();
    this.ready=true; this._stamp();
  },
  subscribe(){
    const c=this.client(); if(!this.connected()||!c) return;
    if(this.channel){ c.removeChannel(this.channel); this.channel=null; }
    this.channel=c.channel('ju-'+this.coupleId)
      .on('postgres_changes',{event:'*',schema:'public',table:'justus_data',filter:'couple_id=eq.'+this.coupleId},async (payload)=>{
        const nw=payload.new||{};
        if(nw.last_writer===this.device()) return;
        const r=await this.pull();
        if(r.ok && this.onChange) this.onChange();
        this._stamp();
      })
      .subscribe();
  },
  stop(){ const c=this.client(); if(this.channel&&c){ c.removeChannel(this.channel); this.channel=null; } this.ready=false; },

  /* ---------- photos (Storage) ---------- */
  async uploadPhoto(file){
    const c=this.client(); if(!this.connected()||!c) throw new Error('not_connected');
    const ext=((file.name||'img').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=this.coupleId+'/'+this.device()+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6)+'.'+ext;
    const {error}=await c.storage.from('justus-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});
    if(error) throw error;
    return path;
  },
  async signedUrl(path){
    const c=this.client(); if(!c||!path) return null;
    if(this._urlCache[path]) return this._urlCache[path];
    const {data,error}=await c.storage.from('justus-photos').createSignedUrl(path,60*60*24*7);
    if(error||!data) return null;
    this._urlCache[path]=data.signedUrl; return data.signedUrl;
  },
  async deletePhoto(path){ const c=this.client(); if(!c||!path) return; try{ await c.storage.from('justus-photos').remove([path]); delete this._urlCache[path]; }catch(e){} },

  _stamp(){ try{ store.set('ju.synced', Date.now()); }catch(e){} }
};

function useLocal(key,initial){
  const [v,setV]=useState(()=>store.get(key,initial));
  useEffect(()=>{ store.set(key,v); Cloud.schedulePush(); },[key,v]);
  // nhận thay đổi từ máy kia
  useEffect(()=>{
    const h=()=>{ const nv=store.get(key,initial); setV(prev=> JSON.stringify(prev)===JSON.stringify(nv)?prev:nv); };
    window.addEventListener('ju:remote',h);
    return ()=>window.removeEventListener('ju:remote',h);
  },[key]);
  return [v,setV];
}

const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const VND=(n)=> (Number(n)||0).toLocaleString('vi-VN')+'đ';
const pad=(n)=> n<10?'0'+n:''+n;
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDateVN(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function daysFromToday(iso){
  if(!iso) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(iso+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function nextOccurrence(iso){
  // lấy ngày-tháng, đẩy về lần xuất hiện kế tiếp (>= hôm nay)
  if(!iso) return null;
  const [_,m,d]=iso.split('-').map(Number);
  const t=new Date(); t.setHours(0,0,0,0);
  let y=t.getFullYear();
  let nd=new Date(y,m-1,d);
  if(nd<t){ nd=new Date(y+1,m-1,d); }
  return nd;
}
function daysToNext(iso){
  const nd=nextOccurrence(iso); if(!nd) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.round((nd-t)/86400000);
}
function yearsBetween(iso){
  if(!iso) return 0;
  const a=new Date(iso+'T00:00:00'), b=new Date();
  let y=b.getFullYear()-a.getFullYear();
  const m=b.getMonth()-a.getMonth();
  if(m<0||(m===0&&b.getDate()<a.getDate())) y--;
  return y;
}
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<8;i++) s+=A[Math.floor(Math.random()*A.length)]; return s.slice(0,4)+'-'+s.slice(4); }
function normCode(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9-]/g,''); }
// Mốc "ngày bên nhau" sắp tới (bội số 100 ngày hoặc mốc năm)
function nextMilestone(days){
  if(days==null||days<0) return null;
  const set=new Set();
  for(let n=100;n<=20000;n+=100) set.add(n);
  for(let y=1;y<=60;y++) set.add(y*365);
  const sorted=[...set].sort((a,b)=>a-b);
  const m=sorted.find(x=>x>days);
  if(!m) return null;
  return {mark:m, inDays:m-days, isYear:m%365===0, years:Math.round(m/365)};
}
// Hiệu ứng confetti + rung nhẹ khi có khoảnh khắc vui
function celebrate(emojis){
  try{ if(navigator.vibrate) navigator.vibrate([28,40,28]); }catch(e){}
  const set=emojis||['❤️','💖','🎉','✨','💞','💕'];
  for(let i=0;i<26;i++){
    const el=document.createElement('div');
    el.textContent=set[Math.floor(Math.random()*set.length)];
    el.style.cssText='position:fixed;z-index:200;left:'+(Math.random()*100)+'vw;top:-30px;font-size:'+(16+Math.random()*18)+'px;pointer-events:none;will-change:transform,opacity;transition:transform 1.7s cubic-bezier(.3,.7,.4,1), opacity 1.7s;';
    document.body.appendChild(el);
    requestAnimationFrame(()=>{ el.style.transform='translateY('+(105+Math.random()*15)+'vh) rotate('+(Math.random()*540-270)+'deg)'; el.style.opacity='0'; });
    setTimeout(()=>{ try{el.remove();}catch(e){} },1800);
  }
}
// Chuỗi ngày liên tiếp có trả lời câu hỏi (giữ streak nếu hôm nay chưa trả lời nhưng hôm qua có)
function answerStreak(qa){
  if(!qa) return 0;
  const has=(date)=>{ const k=date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate()); const e=qa[k]; return !!(e && (e.a||e.b)); };
  let d=new Date(); d.setHours(0,0,0,0);
  if(!has(d)) d.setDate(d.getDate()-1);
  let n=0; while(has(d)){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function wmo(c){
  if(c===0) return {icon:'☀️',text:'Quang đãng'};
  if(c<=2) return {icon:'⛅',text:'Ít mây'};
  if(c===3) return {icon:'☁️',text:'Nhiều mây'};
  if(c<=48) return {icon:'🌫️',text:'Sương mù'};
  if(c<=57) return {icon:'🌦️',text:'Mưa phùn'};
  if(c<=67) return {icon:'🌧️',text:'Mưa'};
  if(c<=77) return {icon:'🌨️',text:'Tuyết'};
  if(c<=82) return {icon:'🌧️',text:'Mưa rào'};
  return {icon:'⛈️',text:'Dông'};
}

function Stars({value=0,onChange}){
  return <span className="stars">{[1,2,3,4,5].map(i=>(
    <span key={i} onClick={onChange?()=>onChange(i===value?0:i):undefined} style={{cursor:onChange?'pointer':'default'}}>
      {i<=value?'★':'☆'}</span>
  ))}</span>;
}

function Sheet({title,onClose,children}){
  return (
    <div className="ov" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="x" onClick={onClose}>✕</div>
        {title && <h3>{title}</h3>}
        {children}
      </div>
    </div>
  );
}

  const shown=useMemo(()=>{
    let a=items.slice();
    if(filter==='mine') a=a.filter(x=>x.by===me);
    if(filter==='fav') a=a.filter(x=>x.fav);
    if(filter==='todo') a=a.filter(x=>!x.done);
    if(q.trim()){ const s=q.toLowerCase(); a=a.filter(x=>(x.title||'').toLowerCase().includes(s)||(x.note||'').toLowerCase().includes(s)); }
    a.sort((p,r)=> (r.fav?1:0)-(p.fav?1:0) || r.createdAt-p.createdAt);
    return a;
  },[items,filter,q,me]);

  return (
    <div>
      <div className="row" style={{margin:'4px 14px 0',gap:8}}>
        <input className="inp grow" placeholder="🔎 Tìm…" value={q} onChange={e=>setQ(e.target.value)} />
        {suggest && <button className="btn sm soft" onClick={()=>setSugOpen(true)}>💡</button>}
        <button className="btn sm" onClick={()=>{setEdit(null);setOpen(true);}}>＋ Thêm</button>
      </div>
      <div className="filters">
        <button className={filter==='all'?'on':''} onClick={()=>setFilter('all')}>Tất cả</button>
        <button className={filter==='todo'?'on':''} onClick={()=>setFilter('todo')}>Chưa {doneLabel.toLowerCase()}</button>
        <button className={filter==='mine'?'on':''} onClick={()=>setFilter('mine')}>Của tôi</button>
        <button className={filter==='fav'?'on':''} onClick={()=>setFilter('fav')}>❤️ Thích</button>
      </div>

      {shown.length===0 && <div className="empty"><span className="big">{empty?.icon||'✨'}</span>{empty?.text||'Chưa có gì cả — thêm mục đầu tiên nhé!'}</div>}

      {shown.map(it=>(
        <div key={it.id} className={'item'+(it.done?' dn':'')}>
          <div className="it-top">
            <h4>{it.title}</h4>
            <button className={'heartbtn'+(it.fav?' on':'')} onClick={()=>toggle(it.id,'fav')}>{it.fav?'❤️':'🤍'}</button>
          </div>
          {it.note && <div className="it-note">{it.note}</div>}
          {it.address && <div className="it-note muted">📍 {it.address}</div>}
          {it.link && <div style={{marginTop:6}}><a className="linkout" href={it.link} target="_blank" rel="noreferrer">🔗 {it.link}</a></div>}
          <div className="it-meta">
            <span className="av-sm">{people[it.by]?.avatar||'❤️'}</span>
            <span className="muted" style={{fontSize:12}}>{people[it.by]?.name||''}</span>
            {it.budget && <span className="pill">{budgetLabel(it.budget)}</span>}
            {typeof it.price==='number' && it.price>0 && <span className="pill">{VND(it.price)}</span>}
            {it.tag && <span className="pill">{it.tag}</span>}
            {typeof it.rating==='number' && it.rating>0 && <Stars value={it.rating} />}
            <span className="grow"></span>
            <button className="pill" onClick={()=>toggle(it.id,'done')}>{it.done?'↩︎ Bỏ':'✓ '+doneLabel}</button>
            <button className="iconbtn" onClick={()=>{setEdit(it);setOpen(true);}}>✏️</button>
            <button className="iconbtn" onClick={()=>del(it.id)}>🗑️</button>
          </div>
        </div>
      ))}

      {open && <ItemForm title={(edit?'Sửa ':'Thêm ')+addLabel} init={edit} fields={fields} tagOptions={tagOptions}
        onClose={()=>{setOpen(false);setEdit(null);}} onSave={save} />}

      {sugOpen && suggest && <Sheet title="💡 Gợi ý — chạm để thêm" onClose={()=>setSugOpen(false)}>
        <div>
          {suggest.filter(s=>!items.some(it=>(it.title||'').trim().toLowerCase()===s.toLowerCase())).map(s=>(
            <button key={s} className="pill" style={{margin:'4px 6px 4px 0',padding:'8px 12px',fontSize:13}}
              onClick={()=>{ addQuick(s); flash&&flash('Đã thêm: '+s); }}>＋ {s}</button>
          ))}
          {suggest.filter(s=>!items.some(it=>(it.title||'').trim().toLowerCase()===s.toLowerCase())).length===0 &&
            <div className="muted center" style={{padding:'16px 0'}}>Bạn đã thêm hết gợi ý rồi 🎉</div>}
        </div>
      </Sheet>}
    </div>
  );
}

function ItemForm({title,init,fields,tagOptions,onClose,onSave}){
  const [f,setF]=useState(()=> init? {...init} : {title:''});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const has=(k)=>fields.includes(k);
  const submit=()=>{ if(!f.title || !f.title.trim()){ return; } onSave(f); };
  return (
    <Sheet title={title} onClose={onClose}>
      <div className="field"><label>Tiêu đề</label>
        <input className="inp" value={f.title||''} onChange={e=>set('title',e.target.value)} placeholder="Nhập…" autoFocus/></div>
      {has('budget') && <div className="field"><label>Ngân sách</label>
        <select className="inp" value={f.budget||''} onChange={e=>set('budget',e.target.value)}>
          <option value="">— chọn —</option>{BUDGETS.map(b=><option key={b.k} value={b.k}>{b.label}</option>)}
        </select></div>}
      {has('tag') && <div className="field"><label>Loại</label>
        <select className="inp" value={f.tag||''} onChange={e=>set('tag',e.target.value)}>
          <option value="">— chọn —</option>{(tagOptions||[]).map(t=><option key={t} value={t}>{t}</option>)}
        </select></div>}
      {has('price') && <div className="field"><label>Giá ước tính (đ)</label>
        <input className="inp" type="number" value={f.price||''} onChange={e=>set('price',Number(e.target.value))} placeholder="0"/></div>}
      {has('address') && <div className="field"><label>Địa chỉ</label>
        <input className="inp" value={f.address||''} onChange={e=>set('address',e.target.value)} placeholder="Ở đâu?"/></div>}
      {has('link') && <div className="field"><label>Link</label>
        <input className="inp" value={f.link||''} onChange={e=>set('link',e.target.value)} placeholder="https://…"/></div>}
      {has('rating') && <div className="field"><label>Đánh giá</label>
        <div><Stars value={f.rating||0} onChange={v=>set('rating',v)} /></div></div>}
      {has('note') && <div className="field"><label>Ghi chú</label>
        <textarea className="inp" value={f.note||''} onChange={e=>set('note',e.target.value)} placeholder="Thêm chi tiết…"/></div>}
      <button className="btn" onClick={submit}>💾 Lưu</button>
    </Sheet>
  );
}

/* ============ Câu hỏi mỗi ngày ============ */
function DailyQuestion({people,me}){
  const [qa,setQa]=useLocal('ju.qa',{});
  const key=todayISO();
  const q=questionOfToday();
  const today=qa[key]||{q};
  const [draft,setDraft]=useState('');
  const [editing,setEditing]=useState(false);
  useEffect(()=>{ setDraft((qa[key]||{})[me]||''); setEditing(false); },[key]);
  const other=me==='a'?'b':'a';
  const myAnswer=today[me], otherAnswer=today[other];
  const save=()=>{ if(!draft.trim())return; setQa({...qa,[key]:{...today,q,[me]:draft.trim()}}); setEditing(false); };
  const streak=answerStreak(qa);
  return (
    <div className="card">
      <div className="row"><b>❓ Câu hỏi hôm nay</b>{streak>1 && <span className="pill" style={{marginLeft:8}}>🔥 {streak} ngày</span>}<span className="grow"></span><span className="muted" style={{fontSize:12}}>{fmtDateVN(key)}</span></div>
      <div style={{fontWeight:700,margin:'8px 0 10px',fontSize:15,lineHeight:1.35}}>{q}</div>
      {(!myAnswer || editing) ? (
        <div className="row" style={{gap:8}}>
          <input className="inp grow" placeholder="Câu trả lời của bạn…" value={draft}
            onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') save(); }} autoFocus={editing}/>
          <button className="btn sm" onClick={save}>Gửi</button>
        </div>
      ) : (
        <div style={{background:'var(--chip)',color:'var(--chip-tx)',borderRadius:12,padding:'9px 12px',fontSize:14}}>
          <div className="row"><span className="muted" style={{fontSize:11}}>{people[me].name} (bạn)</span>
            <span className="grow"></span><button className="muted" style={{fontSize:11}} onClick={()=>{setDraft(myAnswer);setEditing(true);}}>✏️ sửa</button></div>
          <div style={{marginTop:2}}>{myAnswer}</div>
        </div>
      )}
      {myAnswer && (otherAnswer
        ? <div style={{background:'var(--bg)',border:'1px solid var(--line)',borderRadius:12,padding:'9px 12px',fontSize:14,marginTop:6}}>
            <span className="muted" style={{fontSize:11}}>{people[other].name}</span>
            <div style={{marginTop:2}}>{otherAnswer}</div></div>
        : <div className="muted" style={{fontSize:12,marginTop:8}}>Đã trả lời ✓ — chờ {people[other].name} trả lời nhé 💞</div>)}
    </div>
  );
}

/* ============ Đố vui "Hiểu nhau đến đâu?" ============ */
function CoupleQuiz({people,me}){
  const [quiz,setQuiz]=useLocal('ju.quiz',{});
  const key=todayISO(); const q=quizOfToday();
  const today=quiz[key]||{q};
  const other=me==='a'?'b':'a';
  const mine=today[me]||{}, theirs=today[other]||{};
  const [self,setSelf]=useState(''); const [guess,setGuess]=useState('');
  useEffect(()=>{ const t=(quiz[key]||{})[me]||{}; setSelf(t.self||''); setGuess(t.guess||''); },[key,me]);
  const done=mine.self&&mine.guess;
  const bothDone=done && theirs.self && theirs.guess;
  const save=()=>{ if(!self.trim()||!guess.trim())return; setQuiz({...quiz,[key]:{...today,q,[me]:{self:self.trim(),guess:guess.trim()}}}); };
  const norm=(s)=>(s||'').trim().toLowerCase();
  const iRight=bothDone && norm(mine.guess)===norm(theirs.self);
  const theyRight=bothDone && norm(theirs.guess)===norm(mine.self);
  const score=(iRight?1:0)+(theyRight?1:0);
  return (
    <div className="card">
      <div className="row"><b>💞 Hiểu nhau đến đâu?</b><span className="grow"></span><span className="muted" style={{fontSize:12}}>đố vui mỗi ngày</span></div>
      <div style={{fontWeight:700,margin:'8px 0 10px'}}>{q}</div>
      {!done ? (
        <div>
          <div className="field"><label>Câu trả lời thật của bạn</label>
            <input className="inp" value={self} onChange={e=>setSelf(e.target.value)} placeholder="Về chính bạn…"/></div>
          <div className="field"><label>Đoán câu trả lời của {people[other].name}</label>
            <input className="inp" value={guess} onChange={e=>setGuess(e.target.value)} placeholder="Bạn nghĩ người kia trả lời gì?"/></div>
          <button className="btn" onClick={save}>Gửi</button>
        </div>
      ) : !bothDone ? (
        <div className="muted" style={{fontSize:13}}>Bạn đã chơi ✓ — chờ {people[other].name} để lật kết quả 💕</div>
      ) : (
        <div>
          <div style={{background:'var(--chip)',color:'var(--chip-tx)',borderRadius:12,padding:'10px',fontSize:13}}>
            <div>Bạn đoán {people[other].name}: “{mine.guess}” → {iRight?'✅ Đúng!':'❌ thật ra: “'+theirs.self+'”'}</div>
            <div style={{marginTop:6}}>{people[other].name} đoán bạn: “{theirs.guess}” → {theyRight?'✅ Đúng!':'❌ thật ra: “'+mine.self+'”'}</div>
          </div>
          <div className="center" style={{marginTop:8,fontWeight:800}}>Điểm hiểu nhau: {score}/2 {score===2?'🎉':'💪'}</div>
        </div>
      )}
    </div>
  );
}

/* ============ Thử thách đôi hôm nay ============ */
function DailyChallenge(){
  const [log,setLog]=useLocal('ju.challengeDone',{});
  const key=todayISO();
  const ch=challengeOfToday();
  const done=!!log[key];
  const has=(d)=>!!log[d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())];
  const streak=streakOf(has);
  const toggle=()=>{ const nv={...log}; if(done){ delete nv[key]; } else { nv[key]=true; celebrate(['💞','🎉','✨','💪']); } setLog(nv); };
  return (
    <div className="card">
      <div className="row"><b>🎯 Thử thách đôi hôm nay</b>{streak>1 && <span className="pill" style={{marginLeft:8}}>🔥 {streak} ngày</span>}<span className="grow"></span></div>
      <div style={{fontWeight:700,fontSize:15,margin:'8px 0 10px',lineHeight:1.35}}>{ch}</div>
      <button className={'btn'+(done?' soft':'')} onClick={toggle}>{done?'✓ Đã làm cùng nhau 💞 (bỏ đánh dấu)':'Đánh dấu đã làm cùng nhau'}</button>
    </div>
  );
}

/* ============ Check-in tuần ============ */
function WeeklyCheckin({people,me}){
  const [data,setData]=useLocal('ju.checkin',{});
  const wk=weekKey();
  const week=data[wk]||{};
  const mine=week[me]||{}, other=me==='a'?'b':'a', theirs=week[other]||{};
  const [rating,setRating]=useState(0); const [note,setNote]=useState('');
  useEffect(()=>{ const w=(data[wk]||{})[me]||{}; setRating(w.rating||0); setNote(w.note||''); },[wk,me]);
  const save=()=>{ if(!rating)return; setData({...data,[wk]:{...(data[wk]||{}),[me]:{rating,note:note.trim()}}}); };
  return (
    <div className="card">
      <div className="row"><b>📝 Check-in tuần này</b><span className="grow"></span><span className="muted" style={{fontSize:12}}>tuần {fmtDateVN(wk)}</span></div>
      <div className="muted" style={{fontSize:12.5,margin:'6px 0'}}>Tuần qua của hai đứa thế nào?</div>
      <div className="row" style={{gap:2}}>{[1,2,3,4,5].map(i=><button key={i} onClick={()=>setRating(i)} style={{fontSize:24,lineHeight:1}}>{i<=rating?'❤️':'🤍'}</button>)}</div>
      <input className="inp" style={{marginTop:8}} placeholder="Điều gì đáng nhớ tuần này? (tuỳ chọn)" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') save(); }}/>
      <button className="btn" style={{marginTop:8}} onClick={save}>{mine.rating?'Cập nhật check-in':'Gửi check-in'}</button>

        : <div className="muted" style={{fontSize:12,marginTop:8}}>{people[other].name} chưa check-in tuần này.</div>}
    </div>
  );
}

/* ============ Lọ yêu thương ============ */
function LoveJar({people,me}){
  const [jar,setJar]=useLocal('ju.lovejar',[]);
  const [drawn,setDrawn]=useState(null);
  const [open,setOpen]=useState(false);
  const [text,setText]=useState('');
  const add=(t)=>{ const x=((t!=null?t:text)||'').trim(); if(!x)return; setJar(prev=>[{id:uid(),text:x,by:me,createdAt:Date.now()},...prev]); setText(''); };
  const draw=()=>{ if(jar.length===0)return; setDrawn(jar[Math.floor(Math.random()*jar.length)]); };
  return (
    <div className="card">
      <div className="row"><b>🫙 Lọ yêu thương</b><span className="grow"></span><span className="muted" style={{fontSize:12}}>{jar.length} điều</span></div>
      {drawn
        ? <div className="center" style={{margin:'10px 0'}}>
            <div style={{fontSize:16,fontWeight:700,lineHeight:1.4}}>“{drawn.text}”</div>
            <div className="muted" style={{fontSize:11,marginTop:4}}>— {people[drawn.by]?.name} viết</div>
          </div>
        : <div className="muted" style={{fontSize:12.5,margin:'8px 0'}}>Cất những lý do yêu nhau / điều biết ơn vào lọ — lúc buồn rút ra đọc 💞</div>}
      <div className="row" style={{gap:8}}>
        <button className="btn grow" onClick={draw} disabled={jar.length===0}>{jar.length===0?'Lọ đang trống':'💝 Rút một điều'}</button>
        <button className="btn sm soft" onClick={()=>setOpen(true)}>＋</button>
      </div>
      {open && <Sheet title="🫙 Thêm vào lọ yêu thương" onClose={()=>setOpen(false)}>
        <div className="field"><label>Điều bạn yêu / biết ơn ở người ấy</label>
          <textarea className="inp" autoFocus value={text} onChange={e=>setText(e.target.value)} placeholder="Vì em luôn…"/></div>
        <button className="btn" onClick={()=>{ if(text.trim()){ add(); setOpen(false); } }}>💾 Cất vào lọ</button>

        <div>{LOVEJAR_SUGGEST.map(s=><button key={s} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5}}
          onClick={()=>{ add(s); setOpen(false); }}>＋ {s}</button>)}</div>
      </Sheet>}

  );
}

/* ============ Nhắc nhở hôm nay ============ */
function Reminders({setup,go}){
  const [events]=useLocal('ju.events',[]);
  const [dates]=useLocal('ju.dates',[]);
  const [chores]=useLocal('ju.chores',[]);
  const [shop]=useLocal('ju.shop',[]);
  const list=[];
  events.forEach(e=>{ const d=daysFromToday(e.date); const lead=e.remind!=null?e.remind:3; if(d!=null && d>=0 && d<=lead) list.push({icon:'📅',text:e.title,d}); });
  dates.forEach(e=>{ const d=daysToNext(e.date); const lead=e.remind!=null?e.remind:3; if(d!=null && d<=lead) list.push({icon:e.icon||'🎂',text:e.title,d}); });
  if(setup.loveDate){ const d=daysToNext(setup.loveDate); if(d<=3) list.push({icon:'💗',text:'Kỷ niệm ngày yêu',d}); }
  if(setup.weddingDate){ const d=daysToNext(setup.weddingDate); if(d<=3) list.push({icon:'💍',text:'Kỷ niệm ngày cưới',d}); }
  list.sort((a,b)=>a.d-b.d);
  const choreLeft=chores.filter(c=>!c.done).length;
  const shopLeft=shop.filter(s=>!s.done).length;
  if(list.length===0 && choreLeft===0 && shopLeft===0) return null;
  return (
    <div className="card" style={{borderLeft:'4px solid var(--primary)'}}>
      <b>🔔 Hôm nay cần nhớ</b>
      {list.map((r,i)=>(
        <div key={i} className="row" onClick={()=>go('us')} style={{cursor:'pointer',marginTop:6,fontSize:13.5}}>
          <span>{r.icon}</span><span className="grow">{r.text}</span>
          <span className="pill">{r.d===0?'Hôm nay!':r.d===1?'Ngày mai':'còn '+r.d+' ngày'}</span>
        </div>
      ))}
      {(choreLeft>0||shopLeft>0) && <div className="row" style={{marginTop:10,gap:8,flexWrap:'wrap'}}>
        {choreLeft>0 && <button className="pill" onClick={()=>go('us')}>🧹 {choreLeft} việc nhà chưa xong</button>}
        {shopLeft>0 && <button className="pill" onClick={()=>go('us')}>🛒 {shopLeft} món cần mua</button>}
      </div>}
    </div>
  );
}

/* ============ Ngày này năm xưa ============ */
function OnThisDay(){
  const timeline=store.get('ju.timeline',[])||[];
  const notes=store.get('ju.notes',[])||[];
  const photos=store.get('ju.photos',[])||[];
  const now=new Date(), mm=pad(now.getMonth()+1), dd=pad(now.getDate()), yy=now.getFullYear();
  const items=[];
  const sameMD=(iso)=>{ if(!iso||iso.length<10) return false; const [y,m,d]=iso.split('-'); return m===mm&&d===dd&&Number(y)<yy; };
  timeline.forEach(t=>{ if(sameMD(t.date)) items.push({icon:t.icon||'🕰️',text:t.title,yrs:yy-Number(t.date.slice(0,4))}); });
  photos.forEach(p=>{ if(sameMD(p.date)) items.push({icon:'📷',text:p.caption||'Ảnh kỷ niệm',yrs:yy-Number(p.date.slice(0,4))}); });
  notes.forEach(n=>{ const d=new Date(n.createdAt); if(pad(d.getMonth()+1)===mm&&pad(d.getDate())===dd&&d.getFullYear()<yy) items.push({icon:'💌',text:n.text,yrs:yy-d.getFullYear()}); });
  if(items.length===0) return null;
  return (
    <div className="card" style={{background:'linear-gradient(135deg,var(--chip),var(--card))'}}>
      <b>📆 Ngày này năm xưa</b>
      {items.slice(0,4).map((it,i)=>(
        <div key={i} className="row" style={{marginTop:8,gap:8,alignItems:'flex-start'}}>
          <span style={{fontSize:18}}>{it.icon}</span>
          <div className="grow" style={{fontSize:13.5}}>{it.text} <span className="muted">· {it.yrs} năm trước</span></div>
        </div>
      ))}
    </div>
  );
}

/* ============ Tâm trạng + lịch 14 ngày ============ */
function MoodCard({people,me}){
  const [mood,setMood]=useLocal('ju.mood',{});
  const key=todayISO();
  const today=mood[key]||{};
  const [note,setNote]=useState('');
  useEffect(()=>{ setNote((mood[key]||{})[me+'n']||''); },[key,me]);
  const setMyMood=(emo)=> setMood({...mood,[key]:{...(mood[key]||{}),[me]:emo}});
  const saveNote=()=> setMood({...mood,[key]:{...(mood[key]||{}),[me+'n']:note.trim()}});
  const days=[];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); days.push({k,day:d.getDate(),m:mood[k]||{}}); }
  return (
    <div className="card">
      <div className="row"><b>Tâm trạng hôm nay</b><span className="grow"></span><span className="muted" style={{fontSize:12}}>{fmtDateVN(key)}</span></div>
      <div className="row" style={{marginTop:8,gap:14}}>
        <div className="grow"><div className="muted" style={{fontSize:12,marginBottom:4}}>{people.a.name} {me==='a'?'(bạn)':''}</div>
          <div style={{fontSize:30}}>{today.a||'—'}</div>{today.an && <div className="muted" style={{fontSize:11}}>“{today.an}”</div>}</div>
        <div className="grow"><div className="muted" style={{fontSize:12,marginBottom:4}}>{people.b.name} {me==='b'?'(bạn)':''}</div>
          <div style={{fontSize:30}}>{today.b||'—'}</div>{today.bn && <div className="muted" style={{fontSize:11}}>“{today.bn}”</div>}</div>
      </div>
      <div className="muted" style={{fontSize:12,marginTop:10}}>Chọn tâm trạng của bạn:</div>
      <div className="mood-pick">{MOODS.map(m=><button key={m} className={today[me]===m?'on':''} onClick={()=>setMyMood(m)}>{m}</button>)}</div>
      {today[me] && <div className="row" style={{gap:8,marginTop:8}}>
        <input className="inp grow" placeholder="Vì sao? (tuỳ chọn)" value={note}
          onChange={e=>setNote(e.target.value)} onBlur={saveNote} onKeyDown={e=>{ if(e.key==='Enter') saveNote(); }}/>
      </div>}
      <div className="muted" style={{fontSize:12,marginTop:12,marginBottom:4}}>📅 14 ngày qua</div>
      <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:4}}>
        {days.map(d=>(
          <div key={d.k} style={{flex:'0 0 auto',textAlign:'center',minWidth:24,background:d.k===key?'var(--chip)':'transparent',borderRadius:8,padding:'3px 1px'}}>
            <div style={{fontSize:15,lineHeight:1.15}}>{d.m.a||'·'}</div>
            <div style={{fontSize:15,lineHeight:1.15}}>{d.m.b||'·'}</div>
            <div className="muted" style={{fontSize:9}}>{d.day}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ HOME ============ */
function Home({setup,people,me,go}){
  const [notes]=useLocal('ju.notes',[]);
  const [events]=useLocal('ju.events',[]);
  const [dates]=useLocal('ju.dates',[]);
  const [photos]=useLocal('ju.photos',[]);
  const [wish]=useLocal('ju.wish',[]);
  const [bucket]=useLocal('ju.bucket',[]);

  const loveDays = setup.loveDate ? Math.max(0,(daysFromToday(setup.loveDate)||0)*-1) : null;
  const weddingDays = setup.weddingDate ? Math.max(0,(daysFromToday(setup.weddingDate)||0)*-1) : null;
  useEffect(()=>{ if(loveDays!=null && loveDays>0 && (loveDays%100===0||loveDays%365===0)) celebrate(['🎉','🎊','💞','✨','💖']); },[]);

  // sự kiện / ngày sắp tới gần nhất
  const upcoming=useMemo(()=>{
    const list=[];
    events.forEach(e=>{ const d=daysFromToday(e.date); if(d!=null&&d>=0) list.push({t:e.title,d,date:e.date,kind:'Sự kiện'}); });
    dates.forEach(e=>{ const d=daysToNext(e.date); if(d!=null) list.push({t:e.title,d,kind:'Ngày nhớ'}); });
    // kỷ niệm yêu/cưới
    if(setup.loveDate){ const d=daysToNext(setup.loveDate); list.push({t:'Kỷ niệm ngày yêu',d,kind:'💗'}); }
    if(setup.weddingDate){ const d=daysToNext(setup.weddingDate); list.push({t:'Kỷ niệm ngày cưới',d,kind:'💍'}); }
    list.sort((a,b)=>a.d-b.d);
    return list.slice(0,3);
  },[events,dates,setup]);

  const lastNote=notes.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
  const [cover,setCover]=useState(null);
  useEffect(()=>{ let on=true; const c=setup.cover||photos[0]; if(!c){ setCover(null); return; }
    if(c.path){ Cloud.signedUrl(c.path).then(u=>{ if(on) setCover(u); }); } else setCover(c.src||null);
    return ()=>{ on=false; };
  },[setup.cover, photos]);

  return (
    <div>
      <div className="hero">
        {cover && <div className="cover" style={{backgroundImage:`url(${cover})`}}></div>}
        <div className="inner">
          <div className="names">{people.a.avatar} {people.a.name} <span style={{opacity:.85}}>＋</span> {people.b.name} {people.b.avatar}</div>
          {loveDays!=null
            ? <><div className="count">{loveDays.toLocaleString('vi-VN')} ngày</div>
                <div className="sub">bên nhau từ {fmtDateVN(setup.loveDate)} · {yearsBetween(setup.loveDate)} năm 💗</div></>
            : <div className="sub" style={{marginTop:10}}>Thêm ngày yêu nhau trong Hồ sơ để bắt đầu đếm nhé ✨</div>}
          {weddingDays!=null && <div className="sub" style={{marginTop:6}}>💍 Cưới nhau {weddingDays.toLocaleString('vi-VN')} ngày · {yearsBetween(setup.weddingDate)} năm</div>}
        </div>
      </div>

      {/* Nhắc nhở hôm nay */}
      <Reminders setup={setup} go={go}/>

      {/* Mốc kỷ niệm sắp tới */}
      {loveDays!=null && (()=>{
        const todayMilestone = loveDays>0 && (loveDays%100===0 || loveDays%365===0);
        const ms=nextMilestone(loveDays);
        return (
          <div className="card" style={{background:'linear-gradient(135deg,var(--chip),var(--card))'}}>
            {todayMilestone
              ? <div className="center"><div style={{fontSize:28}}>🎉</div><b style={{fontSize:15}}>Hôm nay tròn {loveDays.toLocaleString('vi-VN')} ngày bên nhau!</b></div>
              : ms && <div className="row" style={{gap:10,alignItems:'center'}}>
                  <div style={{fontSize:24}}>🎯</div>
                  <div className="grow" style={{fontSize:13.5}}>Còn <b>{ms.inDays} ngày</b> nữa tới mốc <b>{ms.mark.toLocaleString('vi-VN')} ngày</b> bên nhau{ms.isYear?` (${ms.years} năm)`:''} 💞</div>
                </div>}
          </div>
        );
      })()}

      {/* Ngày này năm xưa */}
      <OnThisDay/>

      {/* Tâm trạng hôm nay */}
      <MoodCard people={people} me={me}/>

      {/* Câu hỏi mỗi ngày */}
      <DailyQuestion people={people} me={me}/>

      {/* Đố vui hiểu nhau */}
      <CoupleQuiz people={people} me={me}/>

      {/* Thử thách đôi hôm nay */}
      <DailyChallenge/>

      {/* Phân vân: ăn gì / làm gì */}
      <FunPickers/>

      {/* Lọ yêu thương */}
      <LoveJar people={people} me={me}/>

      {/* Check-in tuần */}
      <WeeklyCheckin people={people} me={me}/>

      {/* Sắp tới */}
      <div className="sec-title">⏳ Sắp tới</div>
      {upcoming.length===0 && <div className="empty">Chưa có sự kiện nào sắp tới.</div>}
      {upcoming.map((u,i)=>(
        <div key={i} className="item" onClick={()=>go('us')} style={{cursor:'pointer'}}>
          <div className="it-top">
            <h4>{u.t}</h4>
            <span className="pill">{u.d===0?'Hôm nay!':u.d===1?'Ngày mai':'còn '+u.d+' ngày'}</span>
          </div>
          <div className="muted" style={{fontSize:12,marginTop:4}}>{u.kind}{u.date?' · '+fmtDateVN(u.date):''}</div>
        </div>
      ))}

      {/* Lời nhắn mới nhất */}
      {lastNote && (
        <div className="card" onClick={()=>go('us')} style={{cursor:'pointer'}}>
          <div className="row"><b>💌 Lời nhắn mới</b><span className="grow"></span><span className="muted" style={{fontSize:12}}>{people[lastNote.by]?.name}</span></div>
          <div className="it-note" style={{marginTop:6}}>{lastNote.text}</div>
        </div>
      )}

      <div className="stat-grid">
        <div className="stat" onClick={()=>go('wish')} style={{cursor:'pointer'}}><div className="n">{wish.length}</div><div className="l">🎁 Quà mong muốn</div></div>
        <div className="stat" onClick={()=>go('wish')} style={{cursor:'pointer'}}><div className="n">{bucket.filter(b=>!b.done).length}</div><div className="l">🎯 Điều muốn làm cùng</div></div>
        <div className="stat" onClick={()=>go('us')} style={{cursor:'pointer'}}><div className="n">{events.length}</div><div className="l">📅 Sự kiện</div></div>
        <div className="stat" onClick={()=>go('me')} style={{cursor:'pointer'}}><div className="n">{photos.length}</div><div className="l">📷 Ảnh chung</div></div>
      </div>
      <div style={{height:8}}></div>
    </div>
  );
}

/* ============ Phiếu yêu thương ============ */
function Coupons({people,me,flash}){
  const [coupons,setCoupons]=useLocal('ju.coupons',[]);
  const [t,setT]=useState('');
  const [sugOpen,setSugOpen]=useState(false);
  const other=me==='a'?'b':'a';
  const add=(title)=>{ const x=((title!=null?title:t)||'').trim(); if(!x)return; setCoupons(prev=>[{id:uid(),title:x,by:me,redeemed:false,createdAt:Date.now()},...prev]); setT(''); };
  const redeem=(id)=>{ setCoupons(coupons.map(c=>c.id===id?{...c,redeemed:true,redeemedAt:Date.now()}:c)); celebrate(['🎟️','🎉','💝','✨','💞']); };
  const del=(id)=>setCoupons(coupons.filter(c=>c.id!==id));

  const received=coupons.filter(c=>c.by===other);
  const given=coupons.filter(c=>c.by===me);
  return (
    <div>
      <div className="muted center" style={{fontSize:12.5,margin:'10px 14px'}}>🎟️ Tặng nhau những “phiếu” dễ thương — người kia đổi được bất cứ lúc nào.</div>
      <div className="row" style={{margin:'0 14px',gap:8}}>
        <input className="inp grow" placeholder={'Tặng '+people[other].name+' một phiếu…'} value={t}
          onChange={e=>setT(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') add(); }}/>
        <button className="btn sm soft" onClick={()=>setSugOpen(true)}>💡</button>
        <button className="btn sm" onClick={()=>add()}>Tặng</button>
      </div>

      <div className="sec-title">🎁 Phiếu bạn nhận ({received.filter(c=>!c.redeemed).length})</div>
      {received.length===0 && <div className="empty" style={{padding:'14px'}}>Chưa có phiếu nào — rủ {people[other].name} tặng bạn nhé 💕</div>}
      {received.map(c=>(
        <div key={c.id} className={'item'+(c.redeemed?' dn':'')}>
          <div className="it-top"><h4>🎟️ {c.title}</h4></div>
          <div className="it-meta">
            <span className="av-sm">{people[c.by]?.avatar}</span><span className="muted" style={{fontSize:12}}>{people[c.by]?.name} tặng</span>
            <span className="grow"></span>
            {c.redeemed ? <span className="pill">✓ Đã đổi</span> : <button className="btn sm" onClick={()=>redeem(c.id)}>Đổi ngay 🎉</button>}
          </div>
        </div>
      ))}

      <div className="sec-title">💝 Phiếu bạn đã tặng ({given.length})</div>
      {given.length===0 && <div className="empty" style={{padding:'14px'}}>Bạn chưa tặng phiếu nào.</div>}
      {given.map(c=>(
        <div key={c.id} className={'item'+(c.redeemed?' dn':'')}>
          <div className="it-top"><h4>🎟️ {c.title}</h4>
            <button className="iconbtn" onClick={()=>del(c.id)}>🗑️</button></div>
          <div className="it-meta"><span className="muted" style={{fontSize:12}}>Tặng {people[other].name}</span>
            <span className="grow"></span>
            {c.redeemed ? <span className="pill" style={{background:'var(--good)',color:'#fff'}}>Đã được đổi 🎉</span> : <span className="pill">Chờ đổi</span>}
          </div>
        </div>
      ))}

      {sugOpen && <Sheet title="💡 Gợi ý phiếu — chạm để tặng" onClose={()=>setSugOpen(false)}>
        <div>{COUPON_SUGGEST.map(s=>(
          <button key={s} className="pill" style={{margin:'4px 6px 4px 0',padding:'8px 12px',fontSize:13}}
            onClick={()=>{ add(s); flash&&flash('Đã tặng phiếu: '+s); }}>＋ {s}</button>
        ))}</div>
      </Sheet>}
    </div>
  );
}

/* ============ Thời tiết + gợi ý theo thời tiết ============ */
function WeatherCard(){
  const [cityKey,setCityKey]=useLocal('ju.city','hanoi');
  const city=CITIES.find(c=>c.k===cityKey)||CITIES[0];
  const [w,setW]=useState(null); const [err,setErr]=useState(false);
  useEffect(()=>{ let on=true; setW(null); setErr(false);
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+city.lat+'&longitude='+city.lng+'&current=temperature_2m,weather_code,precipitation&timezone=auto')
      .then(r=>r.json()).then(d=>{ if(on) d&&d.current?setW(d.current):setErr(true); }).catch(()=>{ if(on) setErr(true); });
    return ()=>{ on=false; };
  },[city.k]);
  const sel=(
    <select className="inp" style={{width:120,flex:'0 0 auto',padding:'6px 8px',fontSize:12.5}} value={cityKey} onChange={e=>setCityKey(e.target.value)}>
      {CITIES.map(c=><option key={c.k} value={c.k}>{c.name}</option>)}
    </select>
  );
  if(err) return <div className="card row" style={{gap:8}}><span className="muted grow" style={{fontSize:12.5}}>⛅ Không lấy được thời tiết (cần mạng).</span>{sel}</div>;
  if(!w) return <div className="card row" style={{gap:8}}><span className="muted grow" style={{fontSize:12.5}}>⛅ Đang xem thời tiết…</span>{sel}</div>;
  const wm=wmo(w.weather_code);
  const rainy=(w.precipitation>0)||[51,53,55,61,63,65,80,81,82,95,96,99].indexOf(w.weather_code)>=0;
  return (
    <div className="card">
      <div className="row" style={{gap:12,alignItems:'center'}}>
        <div style={{fontSize:34}}>{wm.icon}</div>
        <div className="grow"><b>{Math.round(w.temperature_2m)}°C · {wm.text}</b>
          <div className="muted" style={{fontSize:12}}>{rainy?'Trời ẩm ướt — hợp hẹn hò trong nhà ☕🎬':'Thời tiết đẹp — đi chơi ngoài trời thôi 🌳🚲'}</div></div>
        {sel}
      </div>
    </div>
  );
}

/* ============ Catalog "Gợi ý Hà Nội" ============ */
function HanoiCatalog({me,flash}){
  const [,setIdeas]=useLocal('ju.ideas',[]);
  const [,setFood]=useLocal('ju.food',[]);
  const [,setSpots]=useLocal('ju.spots',[]);
  const [cat,setCat]=useState('');
  const [bud,setBud]=useState('');
  const list=HANOI_SPOTS.filter(s=>(!cat||s.cat===cat)&&(!bud||s.budget===bud));
  const isFood=(s)=>s.cat==='an'||s.cat==='cafe';
  const info=(s)=>[s.h?'🕘 '+s.h:'', s.p?'💵 '+s.p:''].filter(Boolean).join(' · ');
  const mapsUrl=(s)=> 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.n+(/Hà Nội|Gia Lâm|Hưng Yên/i.test(s.area)?', '+s.area:', '+s.area+', Hà Nội'));
  const addIdea=(s)=>{ setIdeas(p=>[{id:uid(),title:s.n,budget:s.budget,note:[s.area,s.note,info(s)].filter(Boolean).join(' · '),by:me,fav:false,done:false,createdAt:Date.now()},...p]); flash('Đã lưu ý tưởng: '+s.n); };
  const addFood=(s)=>{ setFood(p=>[{id:uid(),title:s.n,address:s.area,note:[s.note,info(s)].filter(Boolean).join(' · '),by:me,fav:false,done:false,createdAt:Date.now()},...p]); flash('Đã lưu vào Quán: '+s.n); };
  const pin=(s)=>{ setSpots(p=>[{id:uid(),title:s.n,cat:isFood(s)?'ăn':'chơi',note:[s.area,s.note,info(s)].filter(Boolean).join(' · '),lat:s.lat,lng:s.lng,by:me,done:false,createdAt:Date.now()},...p]); flash('Đã ghim bản đồ: '+s.n); };
  const catIcon=(k)=>(HANOI_CATS.find(c=>c.k===k)||{}).icon||'📍';
  return (
    <div>
      <div className="muted center" style={{fontSize:12,margin:'10px 14px 4px'}}>📍 {HANOI_SPOTS.length} địa điểm thật ở Hà Nội — chạm để lưu hoặc ghim bản đồ. <i>(Giờ & giá chỉ để tham khảo.)</i></div>
      <div className="filters">
        <button className={cat===''?'on':''} onClick={()=>setCat('')}>Tất cả</button>
        {HANOI_CATS.map(c=><button key={c.k} className={cat===c.k?'on':''} onClick={()=>setCat(c.k)}>{c.icon} {c.name}</button>)}
      </div>
      <div className="filters">
        <button className={bud===''?'on':''} onClick={()=>setBud('')}>Mọi mức</button>
        {BUDGETS.map(b=><button key={b.k} className={bud===b.k?'on':''} onClick={()=>setBud(b.k)}>{b.label}</button>)}
      </div>
      <div className="muted" style={{fontSize:11.5,margin:'8px 14px 0'}}>{list.length} địa điểm</div>
      {list.map((s,i)=>(
        <div key={i} className="item">
          <div className="it-top"><h4>{catIcon(s.cat)} {s.n}</h4></div>
          <div className="muted" style={{fontSize:12,marginTop:2}}>📍 {s.area}</div>
          {(s.h||s.p) && <div className="muted" style={{fontSize:12,marginTop:3}}>{s.h?'🕘 '+s.h:''}{s.h&&s.p?'  ·  ':''}{s.p?'💵 '+s.p:''}</div>}
          {s.note && <div className="it-note">{s.note}</div>}
          <div className="it-meta">
            <span className="pill">{budgetLabel(s.budget)}</span>
            <a className="pill" href={mapsUrl(s)} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>🗺️ Chỉ đường</a>
            <span className="grow"></span>
            <button className="pill" onClick={()=>isFood(s)?addFood(s):addIdea(s)}>{isFood(s)?'🍽️ Lưu Quán':'💡 Lưu'}</button>
            {s.lat!=null && <button className="pill" onClick={()=>pin(s)}>📍 Ghim</button>}
          </div>
        </div>
      ))}
      <div style={{height:8}}></div>
    </div>
  );
}

/* ============ Tab: Hẹn hò ============ */
function DateTab({people,me,flash}){
  const [seg,setSeg]=useState('idea');
  return (
    <div>
      <div className="seg">

function DateIdeas({people,me}){
  const [items,setItems]=useLocal('ju.ideas',[]);
  const [events,setEvents]=useLocal('ju.events',[]);
  const [bFilter,setBFilter]=useState('');
  const [open,setOpen]=useState(false);
  const [edit,setEdit]=useState(null);
  const [pick,setPick]=useState(null);
  const [sugOpen,setSugOpen]=useState(false);
  const [planning,setPlanning]=useState(null);
  const [planDate,setPlanDate]=useState('');
  const schedule=()=>{ if(!planDate)return; setEvents([{id:uid(),title:'Hẹn hò: '+planning.title,date:planDate,note:planning.note||'',remind:1,by:me,todos:[]},...events]); celebrate(['📅','💞','✨']); setPlanning(null); setPlanDate(''); };

  const save=(it)=>{
    if(it.id) setItems(items.map(x=>x.id===it.id?it:x));
    else setItems([{...it,id:uid(),by:me,fav:false,done:false,createdAt:Date.now()},...items]);
    setOpen(false);setEdit(null);
  };
  const addIdea=(title,budget)=> setItems(prev=>[{title,budget,id:uid(),by:me,fav:false,done:false,createdAt:Date.now()},...prev]);
  const del=(id)=>setItems(items.filter(x=>x.id!==id));
  const toggle=(id,f)=>setItems(items.map(x=>x.id===id?{...x,[f]:!x[f]}:x));

  const pool=bFilter?items.filter(x=>x.budget===bFilter):items;
  const shown=pool.slice().sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||b.createdAt-a.createdAt);
  const random=()=>{ if(pool.length===0) return; setPick(pool[Math.floor(Math.random()*pool.length)]); };

  return (
    <div>
      <div className="filters">
        <button className={bFilter===''?'on':''} onClick={()=>setBFilter('')}>Mọi mức</button>
        {BUDGETS.map(b=><button key={b.k} className={bFilter===b.k?'on':''} onClick={()=>setBFilter(b.k)}>{b.label}</button>)}
      </div>
      <div className="row" style={{margin:'10px 14px',gap:8}}>
        <button className="btn grow" onClick={random}>🎲 Gợi ý ngẫu nhiên</button>
        <button className="btn sm soft" onClick={()=>setSugOpen(true)}>💡 Thư viện</button>
        <button className="btn sm soft" onClick={()=>{setEdit(null);setOpen(true);}}>＋</button>
      </div>
      {pick && (
        <div className="card center" style={{borderColor:'var(--primary)',borderWidth:2}}>
          <div className="muted" style={{fontSize:12}}>🎲 Hôm nay đi đâu nhỉ…</div>
          <div style={{fontSize:20,fontWeight:800,margin:'6px 0'}}>{pick.title}</div>
          {pick.budget && <span className="pill">{budgetLabel(pick.budget)}</span>}
          {pick.note && <div className="it-note" style={{marginTop:8}}>{pick.note}</div>}
        </div>
      )}
      {shown.length===0 && <div className="empty"><span className="big">💡</span>Thêm ý tưởng hẹn hò theo từng mức ngân sách.</div>}
      {shown.map(it=>(
        <div key={it.id} className={'item'+(it.done?' dn':'')}>
          <div className="it-top">
            <h4>{it.title}</h4>
            <button className={'heartbtn'+(it.fav?' on':'')} onClick={()=>toggle(it.id,'fav')}>{it.fav?'❤️':'🤍'}</button>
          </div>
          {it.note && <div className="it-note">{it.note}</div>}
          <div className="it-meta">
            <span className="av-sm">{people[it.by]?.avatar||'❤️'}</span>
            {it.budget && <span className="pill">{budgetLabel(it.budget)}</span>}
            <span className="grow"></span>
            <button className="pill" onClick={()=>{setPlanning(it);setPlanDate('');}}>📅 Lên lịch</button>
            <button className="pill" onClick={()=>toggle(it.id,'done')}>{it.done?'↩︎ Bỏ':'✓ Đã đi'}</button>
            <button className="iconbtn" onClick={()=>{setEdit(it);setOpen(true);}}>✏️</button>
            <button className="iconbtn" onClick={()=>del(it.id)}>🗑️</button>
          </div>
        </div>
      ))}
      {open && <ItemForm title={(edit?'Sửa ':'Thêm ')+'ý tưởng hẹn hò'} init={edit} fields={['budget','note']}
        onClose={()=>{setOpen(false);setEdit(null);}} onSave={save}/>}

      {sugOpen && <Sheet title="💡 Thư viện ý tưởng hẹn hò" onClose={()=>setSugOpen(false)}>
        {BUDGETS.map(b=>{
          const left=(IDEA_SUGGEST[b.k]||[]).filter(s=>!items.some(it=>(it.title||'').trim().toLowerCase()===s.toLowerCase()));
          if(left.length===0) return null;
          return (
            <div key={b.k} style={{marginBottom:12}}>
              <div className="muted" style={{fontSize:12.5,fontWeight:800,margin:'4px 0 6px'}}>{b.label}</div>
              <div>{left.map(s=>(
                <button key={s} className="pill" style={{margin:'3px 6px 3px 0',padding:'7px 11px',fontSize:12.5}}
                  onClick={()=>addIdea(s,b.k)}>＋ {s}</button>
              ))}</div>
            </div>
          );
        })}
        <div className="muted center" style={{fontSize:12}}>Chạm để thêm vào danh sách của hai bạn.</div>
      </Sheet>}

      {planning && <Sheet title={'📅 Lên lịch: '+planning.title} onClose={()=>setPlanning(null)}>
        <div className="muted" style={{fontSize:12.5,marginBottom:10}}>Chọn ngày hẹn — sẽ tạo một sự kiện và nhắc trước 1 ngày.</div>
        <div className="field"><label>Ngày hẹn hò</label>
          <input className="inp" type="date" value={planDate} onChange={e=>setPlanDate(e.target.value)} autoFocus/></div>
        <button className="btn" onClick={schedule}>💞 Tạo lịch hẹn</button>
      </Sheet>}
    </div>
  );
}

/* ============ Map spots ============ */
function MapSpots({people,me}){
  const [spots,setSpots]=useLocal('ju.spots',[]);
  const mapRef=useRef(null), elRef=useRef(null), layerRef=useRef(null);
  const [picking,setPicking]=useState(false);
  const [draft,setDraft]=useState(null); // {lat,lng}
  const [form,setForm]=useState(null);
  const [search,setSearch]=useState(''); const [results,setResults]=useState([]); const [searching,setSearching]=useState(false);
  const doSearch=async()=>{ if(!search.trim())return; setSearching(true);
    try{ const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=vi&q='+encodeURIComponent(search)); setResults(await r.json()); }
    catch(e){ setResults([]); } setSearching(false); };
  const chooseResult=(r)=>{ const lat=parseFloat(r.lat), lng=parseFloat(r.lon);
    if(mapRef.current) mapRef.current.setView([lat,lng],15);
    setDraft({lat,lng}); setForm({title:(r.display_name||'').split(',')[0],cat:'chơi',note:''}); setResults([]); setSearch(''); };

  useEffect(()=>{
    if(!window.L || mapRef.current) return;
    const map=L.map(elRef.current,{zoomControl:true}).setView([21.0278,105.8342],12); // Hà Nội
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    layerRef.current=L.layerGroup().addTo(map);
    map.on('click',(e)=>{
      setPicking(p=>{
        if(p){ setDraft({lat:e.latlng.lat,lng:e.latlng.lng}); setForm({title:'',cat:'chơi',note:''}); return false; }
        return p;
      });
    });
    mapRef.current=map;
  },[]);

  // vẽ markers
  useEffect(()=>{
    const lg=layerRef.current; if(!lg) return;
    lg.clearLayers();
    spots.forEach(s=>{
      if(s.lat==null) return;
      const m=L.marker([s.lat,s.lng]).addTo(lg);
      m.bindPopup('<b>'+(s.cat==='ăn'?'🍜 ':'📍 ')+(s.title||'')+'</b>'+(s.done?' ✅':'')+(s.note?'<br>'+s.note:''));
    });
  },[spots]);

  const addSpot=()=>{
    if(!form.title.trim()){ return; }
    setSpots([{id:uid(),title:form.title,cat:form.cat,note:form.note,lat:draft.lat,lng:draft.lng,by:me,done:false,createdAt:Date.now()},...spots]);
    setForm(null);setDraft(null);
  };
  const del=(id)=>setSpots(spots.filter(x=>x.id!==id));
  const toggle=(id)=>setSpots(spots.map(x=>x.id===id?{...x,done:!x.done}:x));

  return (
    <div>
      <div className="row" style={{margin:'10px 14px 0',gap:8}}>
        <button className={'btn grow'+(picking?'':' soft')} onClick={()=>setPicking(!picking)}>
          {picking?'👆 Chạm lên bản đồ để ghim…':'📍 Ghim chỗ mới'}</button>
      </div>
      <div className="muted center" style={{fontSize:12,margin:'6px 14px'}}>Lưu những chỗ hai đứa muốn đi / đã đi.</div>
      <div className="row" style={{margin:'0 14px 6px',gap:8}}>
        <input className="inp grow" placeholder="🔎 Tìm địa điểm theo tên…" value={search}
          onChange={e=>setSearch(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') doSearch(); }}/>
        <button className="btn sm" onClick={doSearch}>{searching?'…':'Tìm'}</button>
      </div>
      {results.length>0 && <div className="card" style={{padding:'4px 12px',marginTop:0}}>
        {results.map((r,i)=>(
          <div key={i} className="row" style={{padding:'8px 0',borderBottom:'1px solid var(--line)',cursor:'pointer'}} onClick={()=>chooseResult(r)}>
            <span style={{fontSize:15}}>📍</span><span className="grow" style={{fontSize:13}}>{r.display_name}</span>
          </div>
        ))}
      </div>}
      <div id="map" ref={elRef}></div>

      {spots.length===0 && <div className="empty">Chưa ghim chỗ nào. Bấm “Ghim chỗ mới” rồi chạm lên bản đồ.</div>}
      {spots.map(s=>(
        <div key={s.id} className={'item'+(s.done?' dn':'')}>
          <div className="it-top">
            <h4>{s.cat==='ăn'?'🍜 ':'📍 '}{s.title}</h4>
            <button className="iconbtn" onClick={()=>{ if(mapRef.current&&s.lat!=null){ mapRef.current.setView([s.lat,s.lng],16); window.scrollTo({top:0,behavior:'smooth'});} }}>🔍</button>
          </div>
          {s.note && <div className="it-note">{s.note}</div>}
          <div className="it-meta">
            <span className="av-sm">{people[s.by]?.avatar||'❤️'}</span>
            {s.lat!=null && <a className="pill" href={'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>🗺️ Chỉ đường</a>}
            <span className="grow"></span>
            <button className="pill" onClick={()=>toggle(s.id)}>{s.done?'↩︎ Chưa đi':'✓ Đã đi'}</button>
            <button className="iconbtn" onClick={()=>del(s.id)}>🗑️</button>
          </div>
        </div>
      ))}

      {form && (
        <Sheet title="Ghim chỗ mới" onClose={()=>{setForm(null);setDraft(null);}}>
          <div className="field"><label>Tên chỗ</label>
            <input className="inp" autoFocus value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="Quán cà phê, công viên…"/></div>
          <div className="field"><label>Loại</label>
            <select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}>
              <option value="chơi">📍 Chỗ chơi</option><option value="ăn">🍜 Chỗ ăn</option></select></div>
          <div className="field"><label>Ghi chú</label>
            <textarea className="inp" value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
          <button className="btn" onClick={addSpot}>💾 Lưu chỗ này</button>
        </Sheet>
      )}
    </div>
  );
}

function TimelineForm({init,onClose,onSave}){
  const ICONS=['💗','💑','💍','🏠','✈️','🎁','🌹','🎓','👶','🐾','🎉','📸'];
  const [f,setF]=useState(()=>init?{...init}:{title:'',date:'',note:'',icon:'💗',photo:null});
  const [busy,setBusy]=useState(false);
  const fileRef=useRef(null);
  const onFile=async(e)=>{
    const file=e.target.files[0]; if(!file)return; e.target.value='';
    setBusy(true);
    try{
      if(Cloud.connected()){ const path=await Cloud.uploadPhoto(file); setF(p=>({...p,photo:{path}})); setBusy(false); }
      else { const r=new FileReader(); r.onload=()=>{ setF(p=>({...p,photo:{src:r.result}})); setBusy(false); }; r.readAsDataURL(file); }
    }catch(err){ setBusy(false); }
  };
  return (
    <Sheet title={(init?'Sửa ':'Thêm ')+'cột mốc'} onClose={onClose}>
      <div className="field"><label>Cột mốc</label>
        <input className="inp" autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="VD: Lần đầu gặp nhau"/></div>
      <div className="field"><label>Ngày</label>
        <input className="inp" type="date" value={f.date||''} onChange={e=>setF({...f,date:e.target.value})}/></div>
      <div className="field"><label>Biểu tượng</label>
        <div className="emoji-row">{ICONS.map(i=><button key={i} className={f.icon===i?'on':''} onClick={()=>setF({...f,icon:i})}>{i}</button>)}</div></div>
      <div className="field"><label>Ảnh kỷ niệm (tuỳ chọn)</label>
        {f.photo
          ? <div style={{position:'relative'}}>
              <PhotoImg photo={f.photo} style={{width:'100%',height:150,objectFit:'cover',borderRadius:12,display:'block'}}/>
              <button className="pill" style={{position:'absolute',top:6,right:6}} onClick={()=>setF(p=>({...p,photo:null}))}>✕ Bỏ ảnh</button>
            </div>
          : <button className="btn soft" onClick={()=>fileRef.current.click()}>{busy?'Đang tải…':'📷 Thêm ảnh'}</button>}
        <input ref={fileRef} type="file" accept="image/*" hidden onChange={onFile}/></div>
      <div className="field"><label>Kỷ niệm / ghi chú</label>
        <textarea className="inp" value={f.note||''} onChange={e=>setF({...f,note:e.target.value})} placeholder="Hôm đó thế nào…"/></div>
      <button className="btn" onClick={()=>{ if(f.title.trim()&&f.date) onSave(f); }}>💾 Lưu</button>
    </Sheet>
  );
}

/* ============ Chia việc nhà ============ */
function Chores({people,me}){
  const [items,setItems]=useLocal('ju.chores',[]);
  const [t,setT]=useState('');
  const [who,setWho]=useState('both');
  const add=()=>{ if(!t.trim())return; setItems([{id:uid(),title:t.trim(),who,done:false,by:me,createdAt:Date.now()},...items]); setT(''); };
  const toggle=(id)=>setItems(items.map(x=>x.id===id?{...x,done:!x.done}:x));
  const del=(id)=>setItems(items.filter(x=>x.id!==id));
  const resetAll=()=>setItems(items.map(x=>({...x,done:false})));
  const whoLabel=(w)=> w==='a'?people.a.name : w==='b'?people.b.name : 'Cả hai';
  const whoAv=(w)=> w==='a'?people.a.avatar : w==='b'?people.b.avatar : '👫';
  return (
    <div>
      <div className="muted center" style={{fontSize:12.5,margin:'10px 14px'}}>🧹 Chia việc nhà cho công bằng — ai làm việc gì.</div>

          <option value="both">Cả hai</option><option value="a">{people.a.name}</option><option value="b">{people.b.name}</option>
        </select>
        <button className="btn sm" onClick={add}>＋</button>
      </div>
      {items.length===0 && <div className="empty"><span className="big">🧹</span>Chưa có việc nào. Thêm việc rồi chia cho công bằng nhé!</div>}

        <button className="pill" onClick={resetAll}>↻ Đặt lại tất cả</button></div>}
      <div className="card" style={{padding:'4px 13px'}}>
        {items.map(x=>(
          <div key={x.id} className="row" style={{padding:'9px 0',borderBottom:'1px solid var(--line)'}}>

            <span className="pill">{whoAv(x.who)} {whoLabel(x.who)}</span>
            <button className="muted" onClick={()=>del(x.id)} style={{marginLeft:6}}>✕</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ Mục tiêu chung (có các bước) ============ */
function Goals({people,me}){
  const [goals,setGoals]=useLocal('ju.goals',[]);
  const [open,setOpen]=useState(false);
  const save=(g)=>{ setGoals([{...g,id:uid(),by:me,steps:[],createdAt:Date.now()},...goals]); setOpen(false); };
  const del=(id)=>setGoals(goals.filter(x=>x.id!==id));
  const addStep=(gid,text)=>setGoals(goals.map(g=>g.id===gid?{...g,steps:[...(g.steps||[]),{id:uid(),text,done:false}]}:g));
  const toggleStep=(gid,sid)=>setGoals(goals.map(g=>{ if(g.id!==gid) return g; const steps=g.steps.map(s=>s.id===sid?{...s,done:!s.done}:s); if(steps.length&&steps.every(s=>s.done)&&!g.steps.every(s=>s.done)) celebrate(['🏆','🎉','💞','✨']); return {...g,steps}; }));
  const delStep=(gid,sid)=>setGoals(goals.map(g=>g.id===gid?{...g,steps:g.steps.filter(s=>s.id!==sid)}:g));
  return (
    <div>
      <div className="row" style={{margin:'10px 14px'}}><span className="grow muted" style={{fontSize:13}}>Mục tiêu hai đứa cùng theo đuổi 🎯</span>
        <button className="btn sm" onClick={()=>setOpen(true)}>＋ Thêm</button></div>

function icsDownload(title,dateISO,note){
  if(!dateISO) return;
  const dt=dateISO.replace(/-/g,'');
  const esc=(s)=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JustUs//VI','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+dt+Math.random().toString(36).slice(2)+'@justus','DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+esc(title),
    note?'DESCRIPTION:'+esc(note):'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(title||'su-kien').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics'; a.click();
}
function MiniCalendar(){
  const setup=store.get('ju.setup',{})||{};
  const [events]=useLocal('ju.events',[]);
  const [dates]=useLocal('ju.dates',[]);
  const now=new Date();
  const [ym,setYm]=useState({y:now.getFullYear(),m:now.getMonth()});
  const [sel,setSel]=useState(null);
  const marks={}; const addMark=(day,t,kind)=>{ (marks[day]=marks[day]||[]).push({t,kind}); };
  events.forEach(e=>{ if(!e.date)return; const [y,m,d]=e.date.split('-').map(Number); if(y===ym.y&&m-1===ym.m) addMark(d,e.title,'📅'); });
  dates.forEach(e=>{ if(!e.date)return; const p=e.date.split('-').map(Number); if(p[1]-1===ym.m) addMark(p[2],e.title,e.icon||'🎂'); });
  [['loveDate','Kỷ niệm ngày yêu'],['weddingDate','Kỷ niệm ngày cưới']].forEach(([k,label])=>{ if(setup[k]){ const p=setup[k].split('-').map(Number); if(p[1]-1===ym.m) addMark(p[2],label,'💞'); } });
  const startDow=(new Date(ym.y,ym.m,1).getDay()+6)%7;
  const daysIn=new Date(ym.y,ym.m+1,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(d);
  const isToday=(d)=> ym.y===now.getFullYear()&&ym.m===now.getMonth()&&d===now.getDate();
  const moveM=(x)=>{ let m=ym.m+x,y=ym.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} setYm({y,m}); setSel(null); };
  const MN=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  return (
    <div className="card">
      <div className="row"><button className="iconbtn" onClick={()=>moveM(-1)}>‹</button>
        <b className="grow" style={{textAlign:'center'}}>{MN[ym.m]} {ym.y}</b>
        <button className="iconbtn" onClick={()=>moveM(1)}>›</button></div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginTop:8,textAlign:'center'}}>
        {['T2','T3','T4','T5','T6','T7','CN'].map(w=><div key={w} className="muted" style={{fontSize:10,fontWeight:700}}>{w}</div>)}
        {cells.map((d,i)=>(
          <div key={i} onClick={()=>d&&setSel(sel===d?null:d)} style={{aspectRatio:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
            borderRadius:8,cursor:d?'pointer':'default',
            background:d&&isToday(d)?'var(--primary)':(sel===d?'var(--chip)':'transparent'),
            color:d&&isToday(d)?'var(--on-primary)':'var(--text)',fontSize:12.5}}>
            {d||''}
            {d&&marks[d] && <div style={{display:'flex',gap:1,marginTop:1}}>{marks[d].slice(0,3).map((x,j)=><span key={j} style={{width:4,height:4,borderRadius:'50%',background:isToday(d)?'#fff':'var(--primary)'}}></span>)}</div>}
          </div>
        ))}
      </div>
      {sel && (marks[sel]
        ? <div style={{marginTop:8}}>{marks[sel].map((x,i)=><div key={i} className="row" style={{fontSize:13,padding:'3px 0'}}><span>{x.kind}</span><span className="grow" style={{marginLeft:6}}>{x.t}</span></div>)}</div>
        : <div className="muted center" style={{fontSize:12,marginTop:8}}>Ngày {sel} chưa có gì.</div>)}
    </div>
  );
}

function Notes({people,me}){

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[notes.length]);
  const del=(id)=>setNotes(notes.filter(x=>x.id!==id));
  const heart=(id)=>setNotes(notes.map(n=>{ if(n.id!==id) return n; const r={...(n.reacts||{})}; r[me]=r[me]?null:'❤️'; return {...n,reacts:r}; }));

              <div style={{maxWidth:'72%'}}>

                <div style={{background:mine?'linear-gradient(135deg,var(--primary),var(--primary2))':'var(--card)',

/* ============ Tài khoản & ghép đôi (đăng nhập thật) ============ */
function authErrVN(e){
  const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login')) return 'Sai email hoặc mật khẩu.';
  if(m.includes('already registered')||m.includes('already been registered')) return 'Email này đã đăng ký — hãy Đăng nhập.';
  if(m.includes('password')&&m.includes('6')) return 'Mật khẩu cần ít nhất 6 ký tự.';
  if(m.includes('email')&&m.includes('invalid')) return 'Email không hợp lệ.';
  if(m.includes('invalid_code')) return 'Mã mời không đúng.';
  if(m.includes('couple_full')) return 'Cặp đôi này đã đủ 2 người.';
  if(m.includes('already_in_couple')) return 'Bạn đã ở trong một cặp đôi khác.';
  return (e&&e.message)||'Có lỗi xảy ra.';
}
