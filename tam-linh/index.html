<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tâm linh đã chuyển sang app riêng</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#fbf7f6;color:#3b2f33;padding:24px;text-align:center}
  .hop{max-width:340px}
  .sen{font-size:52px;line-height:1}
  h1{font-size:19px;margin:14px 0 6px;font-weight:700}
  p{margin:0 0 18px;color:#7b6b70;font-size:13.5px}
  a{display:inline-block;background:#d6446e;color:#fff;text-decoration:none;
    padding:13px 22px;border-radius:13px;font-weight:600;min-height:44px;box-sizing:border-box}
  @media (prefers-color-scheme:dark){body{background:#1b1618;color:#f0e8ea}p{color:#a89aa0}}
</style>
</head><body>
<div class="hop">
  <div class="sen">🪷</div>
  <h1>Tâm linh nay là app riêng</h1>
  <p>Đang chuyển sang địa chỉ mới và mang theo ngày sinh đã lưu…</p>
  <a id="di" href="https://tam-linh.pages.dev/">Mở app Tâm linh &rarr;</a>
</div>
<script>
/* Trang thay chỗ app Tâm linh cũ (tách thành app riêng 19/08/2026).

   VÌ SAO KHÔNG XOÁ HẲN THƯ MỤC: ai đã cài app này lên màn hình chính thì lối vào của họ
   vẫn trỏ vào đúng đường dẫn này, và ngày sinh họ nhập nằm trong localStorage của origin
   cũ — xoá thư mục là app đã cài mở ra trang không tồn tại, dữ liệu kẹt lại vĩnh viễn
   mà không lỗi nào phát ra. Service worker cũ lấy trang theo lối mạng-trước nên trang này
   tới được máy họ.

   Ba việc, theo đúng thứ tự: gói dữ liệu → gỡ service worker và cache cũ → chuyển đi. */
(function(){
  var DICH='https://tam-linh.pages.dev/';
  var dich=DICH;
  try{
    var goi={},co=false;
    ['ju.tuvi','ju.thanso','ju.setup'].forEach(function(k){
      var v=localStorage.getItem(k); if(v!=null){ goi[k]=v; co=true; }
    });
    if(co){
      var b=new TextEncoder().encode(JSON.stringify(goi));
      dich=DICH+'#ju='+encodeURIComponent(btoa(String.fromCharCode.apply(null,b)));
    }
  }catch(e){}
  document.getElementById('di').href=dich;

  /* Gỡ service worker + cache của RIÊNG app này. Để lại thì bản cũ vẫn được phục vụ
     khi mất mạng, và người dùng thấy hai app Tâm linh khác nhau tuỳ lúc.
     ⛔ Chỉ đụng cache tiền tố 'tamlinh-': Just Us dùng chung origin này. */
  function don(){
    var xong=[];
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
        xong.push(navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.filter(function(r){
            return (r.scope||'').indexOf('/tam-linh/')>=0;
          }).map(function(r){ return r.unregister(); }));
        }));
      }
      if(window.caches&&caches.keys){
        xong.push(caches.keys().then(function(ks){
          return Promise.all(ks.filter(function(k){ return k.indexOf('tamlinh-')===0; })
                               .map(function(k){ return caches.delete(k); }));
        }));
      }
    }catch(e){}
    return Promise.all(xong).catch(function(){});
  }

  /* Dọn xong mới đi, nhưng KHÔNG chờ quá 1,5 giây: dọn trượt thì vẫn phải chuyển,
     đứng lại ở đây là người dùng mất hẳn lối vào app. */
  var da=false;
  function di(){ if(da) return; da=true; location.replace(dich); }
  setTimeout(di,1500);
  don().then(di);
})();
</script>
</body></html>
