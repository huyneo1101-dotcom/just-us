<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Just Us đã chuyển địa chỉ</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#222;padding:24px;text-align:center}
  .hop{max-width:340px}
  h1{font-size:19px;margin:0 0 6px}
  p{margin:0 0 18px;color:#666;font-size:13.5px}
  a{display:inline-flex;align-items:center;justify-content:center;background:#7a2048;color:#fff;text-decoration:none;padding:0 22px;border-radius:13px;font-weight:600;min-height:44px}
  @media (prefers-color-scheme:dark){body{background:#151515;color:#eee}p{color:#aaa}}
</style>
</head><body>
<div class="hop">
  <h1>Just Us đã chuyển sang địa chỉ mới</h1>
  <p>Đang chuyển… Mở lần đầu ở địa chỉ mới thì đăng nhập lại một lần.</p>
  <a href="https://just-us-nha.pages.dev/">Mở Just Us &rarr;</a>
</div>
<script>
/* qd377-chuyen-huong — trang thay chỗ app cũ trên gốc chung huyneo1101-dotcom.github.io
   (QD-377, tắt ngày 23/11/2026 sau khi hai điện thoại đã sang địa chỉ riêng).
   Gốc chung này còn 10 app khác, có app hiện nội dung internet, nên trang dọn sạch dữ liệu
   của RIÊNG app này khỏi ngăn lưu chung rồi mới chuyển đi. ⛔ Không xoá khoá sb-ltmlueqkajqmduoqghdf-*:
   Điểm Tin trên cùng gốc dùng chung kho Supabase đó, xoá là đăng xuất Điểm Tin. */
(function(){
  var DICH='https://just-us-nha.pages.dev/';
  function don(){
    var viec=[];
    try{ Object.keys(localStorage).forEach(function(k){ if(/^(ju\.|sb-vvgkjgvzjeklaadusbne-)/.test(k)) localStorage.removeItem(k); }); }catch(e){}
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
        viec.push(navigator.serviceWorker.getRegistrations().then(function(rs){
          return Promise.all(rs.filter(function(r){ return /\/just-us\/$/.test(new URL(r.scope).pathname); })
            .map(function(r){ return r.unregister(); }));
        }));
      }
      if(window.caches&&caches.keys){
        viec.push(caches.keys().then(function(ks){
          return Promise.all(ks.filter(function(k){ return k.indexOf('justus-')===0; }).map(function(k){ return caches.delete(k); }));
        }));
      }
    }catch(e){}
    return Promise.all(viec);
  }
  var di=function(){ location.replace(DICH); };
  Promise.race([don(), new Promise(function(r){ setTimeout(r,1500); })]).then(di,di);
})();
</script>
</body></html>
